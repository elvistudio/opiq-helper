schema_version: "1.0"
artifact_type: pedagogical_activity_catalog
activities:
  - activity_id: back-to-back-description
    names:
      en: Back-to-back description
      et: Seljad vastamisi kirjeldamine
      ru: Описание спиной к спине
    category: collaborative_learning
    short_description_ru: Один участник описывает изображение или схему, не показывая её, второй восстанавливает содержание по описанию.
    capabilities:
      collaborative_practice: primary
      diagram_interpretation: supporting
      guided_practice: supporting
      map_interpretation: supporting
      oral_production: primary
      peer_explanation: supporting
    linked_principle_ids:
      - peer-explanation
      - varied-context-and-representation
    suitable_lesson_phases:
      - guided_practice
      - collaborative_practice
    suitable_grades:
      min: 2
      max: 12
    content_types:
      - map_and_spatial
      - oral_explanation
      - vocabulary
    subjects:
      - cross_curricular
      - science
      - geography
      - language_learning
    delivery_constraints:
      group_size:
        min: 2
        max: 2
      supported_group_formats:
        - pair
      delivery_modes:
        - classroom
        - homeschool
        - remote
        - parent_supported
      source_access_during_first_attempt: allowed
    duration:
      min_minutes: 5
      max_minutes: 15
    effort:
      teacher_preparation:
        level: medium
        rationale_ru: Подготовка материалов для «Описание спиной к спине» оценена отдельно от ведения работы.
      teacher_facilitation:
        level: medium
        rationale_ru: Уровень учитывает объём моделирования, наблюдения и обратной связи во время «Описание спиной к спине».
      learner_setup:
        level: medium
        rationale_ru: Ученик готовит только перечисленные обязательные ресурсы.
      homeschool_parent:
        level: medium
        role: listening_partner
        role_description_ru: Взрослый выслушивает объяснение и просит уточнить мысль, но не даёт готовый ответ.
        rationale_ru: Роль ограничена организационной, слушающей, проверочной или безопасностной поддержкой.
    learner_independence: developing
    homeschool_adaptation:
      status: adaptable
      variants:
        - parent_child
        - remote_peer
      child_responsibility_ru: Описывать признаки по порядку и уточнять непонятое.
      adult_role_ru: Следовать только услышанному описанию и не угадывать за ребёнка.
      adult_safety_supervision_ru: null
      subject_teacher_responsibility_ru: Проверить точность терминов и подготовить подходящее изображение.
      limitations_ru:
        - Парный обмен дома не воспроизводит разнообразие ответов группы.
    resource_requirements:
      required:
        - diagram
        - paper
        - writing_tool
      optional: []
      printer_required: false
      internet_required: false
      shared_display_required: false
      outdoor_access_required: false
      laboratory_materials_required: false
      reusable_materials: []
      consumable_materials:
        - paper
      setup_minutes: 4
      cleanup_minutes: 0
    learner_demands:
      receptive_language: medium
      productive_language: high
      interaction: high
      reading_load: low
      writing_load: low
      step_complexity: low
      working_memory_support: recommended
      movement_demand: low
      sensory_demand: low
      strategy_familiarity_required: low
      teacher_modelling: required
      estonian_a1_a2_compatibility: limited
      scaffolds_ru:
        - Банк слов
        - Модель фразы
        - Разрешение сначала описать по-русски
    compatibility:
      offline: directly_supported
      no_printer: directly_supported
      one_learner: adaptable
      large_class: adaptable
      mixed_ability_group: adaptable
      remote_delivery: adaptable
    accessibility:
      supports_ru:
        - Устный и визуальный каналы связаны явной задачей.
      barriers_ru:
        - Высокая нагрузка на устную речь и пространственные обозначения.
      adaptations_ru:
        - Разрешить жесты направлений только после первой попытки
        - Дать последовательность вопросов.
    safety:
      risk_level: none
      requires_adult_supervision: false
      controls_ru: []
    risks_and_misuse:
      - risk_id: guessing-instead-of-listening
        description_ru: Второй участник угадывает объект вместо точного следования описанию.
        mitigation_ru: Требовать уточняющий вопрос и сравнить результат с исходником.
    contraindications_ru:
      - Не использовать как самостоятельную проверку предметного понимания без последующего объяснения.
    assessment_roles:
      - formative
    source_provenance:
      - claim_id: back-to-back-source
        claim_origin: source_supported
        statement_ru: Каталог методов включает описание без визуального контакта как учебную активность.
        reference_ids:
          - oppeulesanded-method-catalog
        boundary_ru: Конкретная последовательность и языковые опоры сформулированы проектом.
    project_authored_guidance:
      claim_origin: project_authored_design
      implementation_steps_ru:
        - Сначала дать время изучить изображение и слова
        - Затем провести описание без показа
        - В конце сравнить и исправить неточности.
      adaptation_boundary_ru: Не считать точный рисунок доказательством научного понимания без вопроса о связях.
    grade5_science_applicability:
      grade: 5
      subject: science
      instruction_language: ru
      subject_support_language: et
      learner_estonian_level: A1-A2
      delivery_modes:
        - classroom
        - homeschool
      classroom_example_ru: Описать партнёру простую карту реки по-русски и использовать две эстонские подписи.
      homeschool_example_ru: Описать взрослому схему круговорота, затем вместе сверить расположение стрелок.
    taxonomy_assessment:
      claim_origin: project_authored_design
      reference_ids: []
      confidence:
        level: provisional
        rationale: Операционная классификация «Описание спиной к спине» выведена из нормализованного описания и ожидает teacher
          review.
    confidence:
      level: medium
      rationale: Метод присутствует в предоставленном каталоге; проектные языковые и домашние варианты не проходили
        независимое ревью.
  - activity_id: brainstorming
    names:
      en: Brainstorming
      et: Ajurünnak
      ru: Мозговой штурм
    category: activation
    short_description_ru: Участники быстро предлагают возможные идеи по вопросу, временно отделяя сбор вариантов от их последующей проверки.
    capabilities:
      collaborative_practice: supporting
      formative_assessment: supporting
      misconception_detection: incidental
      oral_production: supporting
      prior_knowledge_activation: primary
    linked_principle_ids:
      - autonomy-support
      - relatedness-and-safe-climate
    suitable_lesson_phases:
      - activation
      - orientation
    suitable_grades:
      min: 1
      max: 12
    content_types:
      - conceptual_text
      - misconception
      - oral_explanation
    subjects:
      - cross_curricular
      - science
    delivery_constraints:
      group_size:
        min: 1
        max: 35
      supported_group_formats:
        - individual
        - pair
        - small_group
        - whole_class
      delivery_modes:
        - classroom
        - homeschool
        - remote
        - parent_supported
      source_access_during_first_attempt: allowed
    duration:
      min_minutes: 3
      max_minutes: 12
    effort:
      teacher_preparation:
        level: low
        rationale_ru: Подготовка материалов для «Мозговой штурм» оценена отдельно от ведения работы.
      teacher_facilitation:
        level: medium
        rationale_ru: Уровень учитывает объём моделирования, наблюдения и обратной связи во время «Мозговой штурм».
      learner_setup:
        level: low
        rationale_ru: Ученик готовит только перечисленные обязательные ресурсы.
      homeschool_parent:
        level: low
        role: listening_partner
        role_description_ru: Взрослый выслушивает объяснение и просит уточнить мысль, но не даёт готовый ответ.
        rationale_ru: Роль ограничена организационной, слушающей, проверочной или безопасностной поддержкой.
    learner_independence: developing
    homeschool_adaptation:
      status: adaptable
      variants:
        - independent
        - parent_child
      child_responsibility_ru: Сначала записать собственные идеи без проверки источника.
      adult_role_ru: Задать вопрос и фиксировать ответы, не исправляя их до этапа проверки.
      adult_safety_supervision_ru: null
      subject_teacher_responsibility_ru: Выбрать вопрос и обеспечить последующую научную проверку идей.
      limitations_ru:
        - Один ребёнок не получает разнообразия идей полноценной группы.
    resource_requirements:
      required:
        - paper
        - writing_tool
      optional:
        - board
        - timer
      printer_required: false
      internet_required: false
      shared_display_required: false
      outdoor_access_required: false
      laboratory_materials_required: false
      reusable_materials:
        - board
      consumable_materials:
        - paper
      setup_minutes: 2
      cleanup_minutes: 0
    learner_demands:
      receptive_language: medium
      productive_language: medium
      interaction: high
      reading_load: low
      writing_load: very_low
      step_complexity: low
      working_memory_support: recommended
      movement_demand: low
      sensory_demand: low
      strategy_familiarity_required: low
      teacher_modelling: recommended
      estonian_a1_a2_compatibility: supported_with_scaffold
      scaffolds_ru:
        - Разрешить одно слово или рисунок
        - Собирать идеи по-русски и выделять только целевые термины по-эстонски
    compatibility:
      offline: directly_supported
      no_printer: directly_supported
      one_learner: directly_supported
      large_class: directly_supported
      mixed_ability_group: adaptable
      remote_delivery: adaptable
    accessibility:
      supports_ru:
        - Принимаются короткие ответы и разные формы представления.
      barriers_ru:
        - Быстрый темп и публичность могут мешать неспешному мышлению.
      adaptations_ru:
        - Сначала дать тихое индивидуальное время
        - Разрешить передать идею письменно.
    safety:
      risk_level: none
      requires_adult_supervision: false
      controls_ru: []
    risks_and_misuse:
      - risk_id: unverified-ideas
        description_ru: Предложенные идеи остаются без проверки и воспринимаются как факты.
        mitigation_ru: После сбора отдельно классифицировать и проверять утверждения.
    contraindications_ru:
      - Не использовать как единственный источник научного объяснения.
    assessment_roles:
      - formative
    source_provenance:
      - claim_id: brainstorming-source
        claim_origin: source_supported
        statement_ru: Мозговой штурм включён в предоставленный каталог учебных методов.
        reference_ids:
          - oppeulesanded-method-catalog
        boundary_ru: Описание процедуры и ограничения являются оригинальной проектной формулировкой.
    project_authored_guidance:
      claim_origin: project_authored_design
      implementation_steps_ru:
        - Задать узкий вопрос и дать тихую паузу
        - Собрать варианты без немедленной оценки
        - Перейти к проверке и группировке идей.
      adaptation_boundary_ru: Не считать количество идей показателем правильного понимания.
    grade5_science_applicability:
      grade: 5
      subject: science
      instruction_language: ru
      subject_support_language: et
      learner_estonian_level: A1-A2
      delivery_modes:
        - classroom
        - homeschool
      classroom_example_ru: Собрать предположения о том, куда уходит дождевая вода, затем проверить по схеме.
      homeschool_example_ru: Ребёнок за две минуты записывает способы экономить воду, после чего сверяет их с критериями.
    taxonomy_assessment:
      claim_origin: project_authored_design
      reference_ids: []
      confidence:
        level: provisional
        rationale: Операционная классификация «Мозговой штурм» выведена из нормализованного описания и ожидает teacher review.
    confidence:
      level: medium
      rationale: Наличие метода подтверждено каталогом; заявляется пригодность при условиях, а не доказанный эффект.
  - activity_id: concept-map
    names:
      en: Concept map
      et: Mõistekaart
      ru: Карта понятий
    category: concept_organization
    short_description_ru: Ученик размещает ключевые понятия и подписывает смысловые связи между ними.
    capabilities:
      classification: supporting
      comparison: supporting
      concept_formation: primary
      diagram_interpretation: supporting
      formative_assessment: supporting
      retrieval: supporting
      visual_representation: primary
    linked_principle_ids:
      - retrieval-practice
      - varied-context-and-representation
    suitable_lesson_phases:
      - guided_practice
      - retrieval
      - consolidation
      - formative_assessment
    suitable_grades:
      min: 2
      max: 12
    content_types:
      - conceptual_text
      - process
      - comparison
      - vocabulary
    subjects:
      - cross_curricular
      - science
      - geography
    delivery_constraints:
      group_size:
        min: 1
        max: 6
      supported_group_formats:
        - individual
        - pair
        - small_group
      delivery_modes:
        - classroom
        - homeschool
        - independent_study
        - remote
        - parent_supported
      source_access_during_first_attempt: prohibited
    duration:
      min_minutes: 8
      max_minutes: 30
    effort:
      teacher_preparation:
        level: low
        rationale_ru: Подготовка материалов для «Карта понятий» оценена отдельно от ведения работы.
      teacher_facilitation:
        level: low
        rationale_ru: Уровень учитывает объём моделирования, наблюдения и обратной связи во время «Карта понятий».
      learner_setup:
        level: low
        rationale_ru: Ученик готовит только перечисленные обязательные ресурсы.
      homeschool_parent:
        level: minimal
        role: logistical_support
        role_description_ru: Взрослый помогает подготовить место и материалы, не подсказывая предметный ответ.
        rationale_ru: Роль ограничена организационной, слушающей, проверочной или безопасностной поддержкой.
    learner_independence: developing
    homeschool_adaptation:
      status: directly_suitable
      variants:
        - independent
        - parent_child
      child_responsibility_ru: Сначала построить карту по памяти и объяснить одну связь.
      adult_role_ru: Попросить объяснить стрелки и предложить сверку, не перестраивая карту за ребёнка.
      adult_safety_supervision_ru: null
      subject_teacher_responsibility_ru: Проверить научную корректность связей и выбрать разумный объём понятий.
      limitations_ru:
        - Без собеседника труднее заметить двусмысленную подпись связи.
    resource_requirements:
      required:
        - paper
        - writing_tool
      optional:
        - device
        - printable_cards
      printer_required: false
      internet_required: false
      shared_display_required: false
      outdoor_access_required: false
      laboratory_materials_required: false
      reusable_materials:
        - printable_cards
      consumable_materials:
        - paper
      setup_minutes: 2
      cleanup_minutes: 0
    learner_demands:
      receptive_language: medium
      productive_language: medium
      interaction: low
      reading_load: low
      writing_load: medium
      step_complexity: medium
      working_memory_support: recommended
      movement_demand: low
      sensory_demand: low
      strategy_familiarity_required: low
      teacher_modelling: recommended
      estonian_a1_a2_compatibility: supported_with_scaffold
      scaffolds_ru:
        - Список ключевых терминов
        - Начальная пара узлов
        - Подписи связей по-русски
    compatibility:
      offline: directly_supported
      no_printer: directly_supported
      one_learner: directly_supported
      large_class: adaptable
      mixed_ability_group: adaptable
      remote_delivery: adaptable
    accessibility:
      supports_ru:
        - Видимая структура уменьшает нагрузку на длинный текст.
      barriers_ru:
        - Пространственное размещение и формулировка связей могут быть сложны.
      adaptations_ru:
        - Дать крупные карточки
        - Разрешить линейную схему вместо сети.
    safety:
      risk_level: none
      requires_adult_supervision: false
      controls_ru: []
    risks_and_misuse:
      - risk_id: decorative-map
        description_ru: Карта содержит слова и линии без обозначенного смысла.
        mitigation_ru: Требовать глагол или короткую подпись на каждой существенной связи.
    contraindications_ru:
      - Не использовать сложную свободную сеть до первоначального точного объяснения понятий.
    assessment_roles:
      - formative
    source_provenance:
      - claim_id: concept-map-source
        claim_origin: source_supported
        statement_ru: Карты понятий представлены в обоих методических материалах, включая воспроизведение по памяти.
        reference_ids:
          - gag-opiraam-opistrateegiad
          - oppeulesanded-method-catalog
        boundary_ru: Проект не воспроизводит исходные таблицы или примеры.
    project_authored_guidance:
      claim_origin: project_authored_design
      implementation_steps_ru:
        - Выбрать ограниченный набор понятий
        - Построить и подписать связи без источника
        - Сверить и исправить карту другим цветом.
      adaptation_boundary_ru: Карта должна показывать отношения, а не служить декоративным перечнем.
    grade5_science_applicability:
      grade: 5
      subject: science
      instruction_language: ru
      subject_support_language: et
      learner_estonian_level: A1-A2
      delivery_modes:
        - classroom
        - homeschool
      classroom_example_ru: Связать водоём, испарение, облако и осадки русскими подписями и эстонскими терминами.
      homeschool_example_ru: Восстановить карту темы по памяти, затем объяснить взрослому одну причинную стрелку.
    taxonomy_assessment:
      claim_origin: project_authored_design
      reference_ids: []
      confidence:
        level: provisional
        rationale: Операционная классификация «Карта понятий» выведена из нормализованного описания и ожидает teacher review.
    confidence:
      level: high
      rationale: Метод и его retrieval-вариант прямо поддержаны предоставленными материалами; проектный формат ограничивает
        нагрузку.
