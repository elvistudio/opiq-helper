        key_release: adult_managed
      artifact_type: parent_guidance
      escalation_triggers_ru:
        - Ребёнок не понимает предоставленное учителем объяснение.
        - Ключ и учебный материал противоречат друг другу.
        - Практическая инструкция неясна или условие безопасности не выполнено.
        - Повторяющаяся ошибка не исправляется после сверки.
        - Требуется новое предметное объяснение.
        - Нужный ресурс недоступен.
        - Запланированное время систематически нереалистично.
      guidance_id: homeschool-oral-parent-child-parent-guidance
      known_limits:
        - Взрослый не считается предметным учителем.
        - Инструкции и временные оценки требуют teacher review и домашней апробации.
      prohibited_actions_ru:
        - Не давать ответ до самостоятельной попытки.
        - Не придумывать предметное объяснение и не менять научные утверждения учителя.
        - Не менять процедуру или меры безопасности.
        - Не считать эстонскую беглость доказательством предметного понимания.
        - Не снижать предметный результат только из-за формы эстонского ответа.
        - Не разрешать практическую работу без разрешения предметного учителя.
      responsibility_boundary:
        adult_safety_supervision_ru: Взрослый выполняет только указанный надзор и не меняет процедуру.
        adult_support_ru: Взрослый организует условия и разрешённую поддержку, но не создаёт предметный ответ.
        child_responsibility_ru: Ребёнок выполняет попытку, объясняет, сверяет и отмечает нерешённый вопрос.
