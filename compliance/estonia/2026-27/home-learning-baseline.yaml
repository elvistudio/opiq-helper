  - practice_id: weekly-report
    title_ru: Еженедельный отчёт школе
    classification: school_specific
    legal_basis: null
    notes: Возможен по индивидуальному плану; национальный минимум контроля составляет раз в месяц.
  - practice_id: timesheet
    title_ru: Табель учебных часов семьи
    classification: not_verified
    legal_basis: null
    notes: Проверенные нормы не устанавливают обязательный семейный табель.
  - practice_id: specific-digital-platform
    title_ru: Конкретная цифровая платформа
    classification: not_verified
    legal_basis: null
    notes: Национальная норма не предписывает Opiq или иную конкретную платформу.
  - practice_id: opiq-helper-family-checklist
