family_evidence_practices:
  - practice_id: individual-curriculum
    title_ru: Индивидуальный учебный план
    classification: nationally_required
    legal_basis: määrus nr 6 §§ 5–7
    notes: Директор утверждает план; проводящее обучение лицо готовит его совместно со школой.
  - practice_id: monthly-school-check
    title_ru: Ежемесячная проверка результатов школой
    classification: nationally_required
    legal_basis: määrus nr 6 § 7 lõige 2
    notes: Национальная норма устанавливает минимум один раз в месяц, но не единую форму.
  - practice_id: assessment-format
    title_ru: Конкретная форма и график оценивания
    classification: required_by_individual_curriculum
    legal_basis: määrus nr 6 §§ 6 lõige 2 ja 7 lõige 1
    notes: Детали согласуются в индивидуальном плане.
  - practice_id: family-portfolio
    title_ru: Семейное портфолио работ
    classification: recommended_good_practice
    legal_basis: null
    notes: В проверенных национальных нормах портфолио не установлено как обязательная форма.
  - practice_id: daily-log
