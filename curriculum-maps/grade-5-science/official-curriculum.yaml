  known_gaps:
    - The file registers 14 verified school-stage outcomes relevant to the ten curated grade-5 topic groups, not all 36 stage-II loodusõpetus outcomes.
    - National evidence does not prescribe which of these school-stage outcomes a school must allocate specifically to grade 5.
  notes: >-
    The relevant annual-course subset is verified against the primary source, but this remains a
    partial school-stage registry and does not claim complete exact-grade-5 curriculum coverage.
