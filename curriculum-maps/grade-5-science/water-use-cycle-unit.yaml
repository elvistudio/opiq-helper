title_et: Põhjavesi, vee kasutamine, kaitse ja veeringe
official_curriculum:
  curriculum_map_id: grade-5-science-official-scope-pilot
  outcome_mappings:
    - outcome_id: prok-ii-loodusopetus-01-models-and-water-cycle
      coverage_status: partial
      course_evidence_record_ids:
        - water-cycle-et-koolibri
        - water-cycle-et-avita-2024
      evidence_summary: The lessons build and interpret the water-cycle model, but the official outcome is a broader end-of-school-stage modelling outcome.
    - outcome_id: prok-ii-loodusopetus-04-safe-investigation
      coverage_status: partial
      course_evidence_record_ids:
        - water-treatment-et-koolibri
        - drinking-water-et-koolibri
      evidence_summary: The supervised filtration model provides one safe investigation with observations and limitations, not complete end-of-stage investigation mastery.
    - outcome_id: prok-ii-loodusopetus-08-water-purification
      coverage_status: partial
      course_evidence_record_ids:
        - water-treatment-et-koolibri
        - drinking-water-et-koolibri
        - water-pollution-et-avita-2024
      evidence_summary: The unit compares a bounded filtration model with potable-water treatment while retaining the broader school-stage outcome as partial.
    - outcome_id: prok-ii-loodusopetus-19-groundwater
      coverage_status: partial
      course_evidence_record_ids:
        - groundwater-ru-avita
        - groundwater-et-avita-2024
        - water-use-ru-avita
      evidence_summary: Groundwater formation, drinking-water use, protection, and cycle links are taught, but official school-stage evidence is not an exact-grade-5 completeness claim.
    - outcome_id: prok-ii-loodusopetus-35-human-impact-communities
      coverage_status: partial
      course_evidence_record_ids:
        - water-use-ru-avita
        - water-pollution-et-avita-2024
      evidence_summary: Pupils evaluate water-use, pollution, protection, and conservation decisions; the outcome covers broader community impacts across school stage II.
grade_allocation:
  official_scope: school_stage_2
  official_basis: official_school_stage
  publisher_basis: publisher_sequence
  curated_basis: curated_course_sequence
  exact_grade_official: false
  notes: Official evidence is end-of-school-stage II; publisher placement and this curated grade-5 sequence do not turn it into an official exact-grade requirement.
learning_outcomes:
  - id: unit-groundwater-and-protection
    text_ru: Объясняет образование и использование подземных вод и обосновывает необходимость защиты источников.
    text_et: Õpilane nimetab põhjavee ja joogivee ning ütleb ühe kaitselause.
    provenance:
      category: author_created_bridge
      source_reference: groundwater-ru-avita and groundwater-et-avita-2024
      notes: Bilingual outcome synthesized from selected canonical ordinary sources.
  - id: unit-water-use-and-cycle-system
    text_ru: Связывает использование, загрязнение, очистку, защиту и природный круговорот воды в одну причинную систему.
    text_et: Õpilane järjestab veeringe ja kasutab lühidalt põhitermineid.
    provenance:
      category: author_created_bridge
      source_reference: selected eight-record multi-source synthesis
      notes: Russian system explanation and short Estonian subject-language layer are kept distinct.
  - id: unit-safe-filter-model
    text_ru: Безопасно проводит модель фильтрации и объясняет, почему прозрачность не доказывает пригодность воды для питья.
    text_et: Õpilane võrdleb vett ja ütleb, et filtreeritud mudelivesi ei ole joogivesi.
    provenance:
      category: author_created_explanation
      source_reference: practical-water-filter-model and canonical treatment sources
      notes: Bounded safety explanation addresses a dangerous misconception without claiming textbook authorship.
success_criteria:
  - id: success-system-explanation
    text_ru: Строит связную модель круговорота с испарением, конденсацией, осадками, стоком и просачиванием.
    text_et: Järjestab veeringe põhietapid.
    provenance:
      category: author_created_assessment
      source_reference: lesson 05 subject assessment
      notes: Separate content criterion derived from the selected source synthesis.
  - id: success-groundwater-protection
    text_ru: Объясняет образование подземных вод и отличает их от открытых поверхностных вод.
    text_et: Ütleb ühe põhjavee kaitsmise põhjuse.
    provenance:
      category: author_created_assessment
      source_reference: lessons 01-02
      notes: Groundwater criterion preserves Russian scientific evidence and short Estonian output.
  - id: success-filter-limit
    text_ru: По результатам фильтрационной модели отделяет наблюдаемое изменение от недоказанной питьевой безопасности.
    text_et: Filtreeritud mudelivesi ei ole joogivesi.
    provenance:
      category: author_created_assessment
      source_reference: lesson 04 filter model
      notes: Safety-critical criterion distinguishes appearance from potability.
prerequisites:
  - id: prerequisite-water-states
    text_ru: Понимает свойства воды, раствор и основные изменения состояния.
    text_et: Tunneb vee olekuid ja olekumuutusi.
    provenance:
      category: author_created_bridge
      source_reference: grade-5-water-four-lesson-plan
      notes: The existing four-lesson production unit provides the prerequisite evidence.
  - id: prerequisite-observation
    text_ru: Различает наблюдение и вывод в безопасной практической работе.
    text_et: Eristab vaatlust ja järeldust.
    provenance:
      category: author_created_bridge
      source_reference: prior safe observation practice
      notes: Required before interpreting the filtration model.
