bilingual_learning:
  primary_subject_explanation_target_ru:
    text: Осадки и просачивание пополняют подземные воды. Люди используют воду и должны предотвращать загрязнение и очищать сточные воды. В круговороте вода испаряется, конденсируется, выпадает осадками, стекает или просачивается. Бумажная фильтрация удаляет лишь часть видимых частиц и не доказывает питьевую безопасность.
    provenance:
      category: author_created_explanation
      source_reference: multi-source synthesis of eight selected canonical records
      notes: Concise Russian target; it does not copy or translate a full Opiq chapter.
  estonian_terminology:
    - term_et: põhjavesi
      equivalent_ru: подземная вода
      simple_definition_et: Põhjavesi on maa sees olev vesi.
      provenance:
        category: author_created_bridge
        source_reference: groundwater-et-avita-2024
        notes: A1-A2 definition grounded in the selected canonical Estonian record.
    - term_et: joogivesi
      equivalent_ru: питьевая вода
      simple_definition_et: Joogivesi on joomiseks sobiv vesi.
      provenance:
        category: author_created_bridge
        source_reference: drinking-water-et-koolibri
        notes: A1-A2 definition grounded in the selected canonical Estonian record.
    - term_et: reostus
      equivalent_ru: загрязнение
      simple_definition_et: Reostus teeb vee ohtlikuks.
      provenance:
        category: author_created_bridge
        source_reference: water-pollution-et-avita-2024
        notes: A1-A2 definition grounded in the selected canonical Estonian record.
    - term_et: puhastamine
      equivalent_ru: очистка
      simple_definition_et: Puhastamine eemaldab osa saasteaineid.
      provenance:
        category: author_created_bridge
        source_reference: water-treatment-et-koolibri
        notes: A1-A2 definition grounded in the selected canonical Estonian record.
    - term_et: veekaitse
      equivalent_ru: охрана воды
      simple_definition_et: Veekaitse aitab hoida vett puhtana.
      provenance:
        category: author_created_bridge
        source_reference: water-pollution-et-avita-2024
        notes: A1-A2 definition grounded in the selected canonical Estonian record.
    - term_et: veeringe
      equivalent_ru: круговорот воды
      simple_definition_et: Veeringe on vee pidev liikumine looduses.
      provenance:
        category: author_created_bridge
        source_reference: water-cycle-et-koolibri
        notes: A1-A2 definition grounded in the selected canonical Estonian record.
    - term_et: sademed
      equivalent_ru: осадки
      simple_definition_et: Sademed on taevast langev vesi.
      provenance:
        category: author_created_bridge
        source_reference: water-cycle-et-avita-2024
        notes: A1-A2 definition grounded in the selected canonical Estonian record.
    - term_et: imbumine
      equivalent_ru: просачивание
      simple_definition_et: Imbumisel liigub vesi pinnasesse.
      provenance:
        category: author_created_bridge
        source_reference: groundwater-et-avita-2024
        notes: A1-A2 definition grounded in the selected canonical Estonian record.
  simple_estonian_sentences:
    - text_et: Põhjavesi on maa sees.
      translation_ru: Подземная вода находится в земле.
      provenance:
        category: author_created_bridge
        source_reference: groundwater-et-avita-2024
        notes: Short Estonian subject-support sentence; complex reasoning remains Russian.
    - text_et: Vett tuleb kaitsta, sest reostus on ohtlik.
      translation_ru: Воду нужно защищать, потому что загрязнение опасно.
      provenance:
        category: author_created_bridge
        source_reference: water-pollution-et-avita-2024
        notes: Short Estonian subject-support sentence; complex reasoning remains Russian.
    - text_et: Vesi aurustub ja hiljem veeldub.
      translation_ru: Вода испаряется и позже конденсируется.
      provenance:
        category: author_created_bridge
        source_reference: water-cycle-et-koolibri
        notes: Short Estonian subject-support sentence; complex reasoning remains Russian.
    - text_et: Filtreeritud mudelivesi ei ole joogivesi.
      translation_ru: Отфильтрованная модельная вода не является питьевой.
      provenance:
        category: author_created_bridge
        source_reference: lesson 04 safety bridge
        notes: Short Estonian subject-support sentence; complex reasoning remains Russian.
  common_estonian_instructions:
    - instruction_et: Näita põhjavee kohta.
      translation_ru: Покажи место подземной воды.
      provenance:
        category: author_created_bridge
        source_reference: lesson 01
        notes: Familiar or modelled classroom instruction for supported A1-A2 work.
    - instruction_et: Põhjenda oma valikut.
      translation_ru: Обоснуй свой выбор.
      provenance:
        category: author_created_bridge
        source_reference: lesson 02
        notes: Familiar or modelled classroom instruction for supported A1-A2 work.
    - instruction_et: Järjesta veeringe.
      translation_ru: Расположи этапы круговорота по порядку.
      provenance:
        category: author_created_bridge
        source_reference: lesson 03
        notes: Familiar or modelled classroom instruction for supported A1-A2 work.
    - instruction_et: Võrdle enne ja pärast.
      translation_ru: Сравни до и после.
      provenance:
        category: author_created_bridge
        source_reference: lesson 04
        notes: Familiar or modelled classroom instruction for supported A1-A2 work.
  short_estonian_task:
    prompt_et: "Järjesta veeringe ja lõpeta lause: Vett tuleb kaitsta, sest __."
    full_expected_answer_ru: Вода проходит через испарение, конденсацию, осадки, сток и просачивание; защищать её нужно, потому что загрязнение угрожает живым организмам и питьевым источникам.
    short_oral_answer_et: Vett tuleb kaitsta, sest reostus on ohtlik.
    provenance:
      category: author_created_assessment
      source_reference: lesson 06 language assessment
      notes: Language result is scored separately from the full Russian scientific answer.
  teacher_questions:
    - question_ru: Чем подземная вода отличается от воды в реке или озере?
      full_expected_answer_ru: Подземная вода заполняет поры и трещины горных пород под поверхностью, а вода рек и озёр находится в открытых поверхностных водоёмах.
      short_oral_answer_et: Põhjavesi on maa sees.
      provenance:
