bilingual_learning:
  primary_subject_explanation_target_ru:
    text: >-
      Вода — вещество. В обычных условиях мы наблюдаем воду в твёрдом, жидком и
      газообразном состояниях. При нагревании и охлаждении состояние может изменяться:
      лёд плавится, вода испаряется, водяной пар конденсируется, а вода замерзает.
      Температура и условия наблюдения должны быть указаны, а вывод должен опираться на опыт.
    provenance:
      category: author_created_explanation
      source_reference: synthesis of golden-water-properties-ru and golden-water-states-ru
      notes: Teacher-authored Russian explanation target grounded in the two canonical Avita pages.
  estonian_terminology:
    - term_et: aine
      equivalent_ru: вещество
      simple_definition_et: Aine on see, millest kehad koosnevad.
      provenance:
        category: author_created_bridge
        source_reference: golden-water-properties-et
        notes: Simplified Estonian definition based on the selected canonical terminology.
    - term_et: vee omadus
      equivalent_ru: свойство воды
      simple_definition_et: Omadus kirjeldab, milline vesi on.
      provenance:
        category: author_created_bridge
        source_reference: golden-water-properties-et
        notes: Short language bridge based on the canonical water-properties chapter.
    - term_et: tahke
      equivalent_ru: твёрдый
      simple_definition_et: Tahkel ainel on kindel kuju.
      provenance:
        category: author_created_bridge
        source_reference: golden-water-states-et and golden-water-states-koolibri
        notes: A1-A2 definition synthesized from the selected ordinary textbook pages.
    - term_et: vedel
      equivalent_ru: жидкий
      simple_definition_et: Vedelik voolab ja võtab anuma kuju.
      provenance:
        category: author_created_bridge
        source_reference: golden-water-states-et and golden-water-states-koolibri
        notes: A1-A2 definition synthesized from the selected ordinary textbook pages.
    - term_et: gaasiline
      equivalent_ru: газообразный
      simple_definition_et: Gaas täidab kogu anuma.
      provenance:
        category: author_created_bridge
        source_reference: golden-water-states-et and golden-water-states-koolibri
        notes: A1-A2 definition synthesized from the selected ordinary textbook pages.
    - term_et: sulamine
      equivalent_ru: плавление
      simple_definition_et: Sulamisel muutub tahke aine vedelaks.
      provenance:
        category: author_created_bridge
        source_reference: golden-water-states-et and golden-water-changes-koolibri
        notes: Short phase-change definition grounded in the canonical pages.
    - term_et: jäätumine
      equivalent_ru: замерзание
      simple_definition_et: Jäätumisel muutub vesi jääks.
      provenance:
        category: author_created_bridge
        source_reference: golden-water-states-et
        notes: Short phase-change definition grounded in the canonical Avita page.
    - term_et: aurustumine
      equivalent_ru: испарение
      simple_definition_et: Aurustumisel muutub vedelik gaasiks.
      provenance:
        category: author_created_bridge
        source_reference: golden-water-states-et and golden-water-changes-koolibri
        notes: Short phase-change definition grounded in the canonical pages.
    - term_et: veeldumine
      equivalent_ru: конденсация
      simple_definition_et: Veeldumisel muutub veeaur veeks.
      provenance:
        category: author_created_bridge
        source_reference: golden-water-states-et and golden-water-changes-koolibri
        notes: Short phase-change definition grounded in the canonical pages.
    - term_et: termomeeter
      equivalent_ru: термометр
      simple_definition_et: Termomeeter mõõdab temperatuuri.
      provenance:
        category: author_created_bridge
        source_reference: golden-water-changes-koolibri
        notes: Measurement-language bridge based on the canonical experiment heading.
  simple_estonian_sentences:
    - text_et: Vesi võib olla tahke, vedel või gaasiline.
      translation_ru: Вода может быть твёрдой, жидкой или газообразной.
      provenance:
        category: author_created_bridge
        source_reference: golden-water-states-et
        notes: Short model sentence based on the selected Estonian terminology.
    - text_et: Jää sulab soojemas kohas veeks.
      translation_ru: Лёд в более тёплом месте тает и превращается в воду.
      provenance:
        category: author_created_bridge
        source_reference: golden-water-changes-koolibri
        notes: Short observation sentence for the supervised melting activity.
    - text_et: Külmal pinnal veeaur veeldub.
      translation_ru: На холодной поверхности водяной пар конденсируется.
      provenance:
        category: author_created_bridge
        source_reference: golden-water-changes-koolibri
        notes: Short model sentence for the condensation observation.
  common_estonian_instructions:
    - instruction_et: Vaata pilti ja nimeta vee olek.
      translation_ru: Посмотри на рисунок и назови состояние воды.
      provenance:
        category: author_created_bridge
        source_reference: selected Estonian Opiq task patterns in the golden unit
        notes: Teacher-curated school instruction modelled on canonical short tasks.
    - instruction_et: Mõõda temperatuur ja kirjuta tulemus tabelisse.
      translation_ru: Измерь температуру и запиши результат в таблицу.
      provenance:
        category: author_created_bridge
        source_reference: golden-water-changes-koolibri
        notes: Measurement instruction based on the canonical melting-temperature activity.
    - instruction_et: Võrdle vaatlust ja järeldust.
      translation_ru: Сравни наблюдение и вывод.
      provenance:
        category: author_created_bridge
        source_reference: golden-water-states-koolibri
        notes: Teacher-created language bridge for the experiment conclusion heading.
  short_estonian_task:
    prompt_et: "Pane kirja: mis juhtub jääga soojas ruumis ja mis olek tekib?"
    full_expected_answer_ru: В тёплом помещении лёд получает тепло, плавится и превращается в жидкую воду.
    short_oral_answer_et: Jää sulab ja muutub vedelaks veeks.
    provenance:
      category: author_created_worksheet
      source_reference: golden-water-states-et and golden-water-changes-koolibri
      notes: Short bilingual transfer task created from the selected phase-change evidence.
  teacher_questions:
    - question_ru: Чем отличаются три состояния воды?
      full_expected_answer_ru: >-
        Лёд сохраняет форму, жидкая вода течёт и принимает форму сосуда, а водяной пар
        распространяется и заполняет доступное пространство.
      short_oral_answer_et: Jää on tahke, vesi on vedel ja veeaur on gaasiline.
      provenance:
        category: author_created_assessment
        source_reference: all selected state-of-water records
        notes: Oral question synthesized from aligned Russian and Estonian canonical explanations.
    - question_ru: Что показывает опыт с холодной поверхностью?
      full_expected_answer_ru: >-
        На холодной поверхности водяной пар охлаждается и превращается в капли жидкой воды;
        этот переход называется конденсацией.
      short_oral_answer_et: Veeaur jahtub ja veeldub veeks.
      provenance:
        category: author_created_assessment
        source_reference: golden-water-changes-koolibri
        notes: Oral question grounded in the canonical condensation evidence.
  language_progression:
    level: A1-A2
    focus: grade_5_terms_instructions_short_sentences
    notes: >-
      Russian carries the conceptual explanation. Estonian output is limited to high-frequency
      terms, classroom instructions, short definitions, and one- or two-sentence oral answers.
  language_learning_notes: >-
    Introduce each Estonian term after the concept is understood in Russian. Recycle the same
    instruction verbs in Opiq and practical work; do not require a long Estonian explanation.
practical_activity:
  title_ru: Наблюдаем плавление и конденсацию
  title_et: Vaatleme sulamist ja veeldumist
  instructions_ru: >-
    Под наблюдением учителя положите одинаковые кусочки льда в два места с разной температурой,
    измеряйте и записывайте изменения. Затем поднесите холодную прозрачную поверхность к тёплому
    влажному воздуху и наблюдайте капли. Ученики не кипятят воду самостоятельно.
  instructions_et: >-
    Pane jää kahte erineva temperatuuriga kohta. Mõõda, vaatle ja kirjuta tulemus. Vaata,
    kuidas külmale pinnale tekivad veetilgad. Järgi õpetaja ohutusjuhiseid.
  expected_result_ru: >-
    В более тёплом месте лёд плавится быстрее. На холодной поверхности водяной пар охлаждается
    и образует капли: наблюдаются плавление и конденсация.
  short_oral_answer_et: Soojas jää sulab; külmal pinnal veeaur veeldub.
  source_record_ids: [golden-water-states-koolibri, golden-water-changes-koolibri]
  provenance:
    category: author_created_bridge
    source_reference: practical synthesis from Koolibri chapters 6282 and 6283
    notes: Teacher-curated safe activity grounded in canonical experiment and measurement headings.
revision:
  title_ru: Схема переходов между состояниями воды
  title_et: Vee olekute muutumise skeem
  instructions_ru: >-
    Заполните схему «лёд — вода — водяной пар», подпишите четыре перехода по-русски и по-эстонски,
    затем ответьте на два вопроса выбранной страницы Koolibri.
  instructions_et: Täida skeem jää–vesi–veeaur ja lisa sõnad sulamine, jäätumine, aurustumine, veeldumine.
  expected_result_ru: Ученик правильно связывает состояния и четыре изменения и объясняет два из них.
  short_oral_answer_et: Vee olekud on tahke, vedel ja gaasiline.
  source_record_ids: [golden-water-states-ru, golden-water-states-et, golden-water-states-koolibri]
  provenance:
    category: author_created_worksheet
    source_reference: revision synthesis from selected Avita and Koolibri pages
    notes: Deduplicated bilingual revision activity based on canonical page evidence.
assessment:
  title_ru: Короткая проверка по свойствам и состояниям воды
  title_et: Lühikontroll vee omaduste ja olekute kohta
  instructions_ru: >-
    Выполните пять заданий: назовите состояния, соотнесите переходы, объясните одно наблюдение,
    прочитайте простую температуру и дайте один короткий устный ответ по-эстонски.
  instructions_et: Täida viis ülesannet ja vasta ühele küsimusele eesti keeles.
  expected_result_ru: >-
    Зачёт получен, если понятия и переходы определены верно, вывод связан с наблюдением,
    а короткий эстонский ответ понятен и использует ключевой термин.
  short_oral_answer_et: Vesi muudab soojenemisel ja jahtumisel olekut.
  source_record_ids:
    - golden-water-properties-ru
    - golden-water-states-ru
    - golden-water-states-et
    - golden-water-changes-koolibri
  provenance:
    category: author_created_assessment
    source_reference: golden unit assessment synthesized from selected canonical records
    notes: Teacher-created assessment with explicit Russian-content and Estonian-language targets.
