    text_ru: Понимает, что термометр измеряет температуру, и умеет читать простую шкалу.
    text_et: Teab sõnu temperatuur ja termomeeter ning loeb lihtsat skaalat.
    provenance:
      category: author_created_bridge
      source_reference: golden unit prerequisite analysis
      notes: Required bridge before using measurement prompts in the selected practical pages.
  - id: prerequisite-materials
