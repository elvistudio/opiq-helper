learning_outcomes:
  - id: explain-water-as-substance
    text_ru: Ученик объясняет по-русски, что вода — вещество с наблюдаемыми свойствами.
    text_et: Õpilane nimetab eesti keeles vee põhiomadusi.
    provenance:
      category: author_created_bridge
      source_reference: golden unit synthesis from selected Opiq records
      notes: Bilingual course outcome derived from the selected ordinary textbook evidence.
  - id: distinguish-water-states
    text_ru: Ученик различает твёрдое, жидкое и газообразное состояния воды и описывает переходы.
    text_et: Õpilane eristab tahket, vedelat ja gaasilist olekut ning nimetab olekumuutusi.
    provenance:
      category: author_created_bridge
      source_reference: golden unit synthesis from selected Opiq records
      notes: Bilingual course outcome aligned to water-state pages in both course languages.
  - id: observe-state-change-safely
    text_ru: Ученик безопасно наблюдает плавление льда и конденсацию и записывает результат.
    text_et: Õpilane vaatleb ohutult jää sulamist ja veeauru veeldumist.
    provenance:
      category: author_created_bridge
      source_reference: golden unit practical synthesis from Koolibri chapters 6282 and 6283
      notes: Curated practical outcome based on canonical experiment and measurement evidence.
success_criteria:
  - id: success-three-states
    text_ru: Правильно называет три состояния воды и приводит по одному примеру.
    text_et: Nimetab vee kolm olekut ja toob iga oleku kohta ühe näite.
    provenance:
      category: author_created_assessment
      source_reference: golden unit success criteria
      notes: Teacher-facing criterion created from the selected Opiq explanations and tasks.
  - id: success-two-changes
    text_ru: Объясняет плавление и конденсацию, используя причину и результат.
    text_et: Selgitab lühidalt sulamist ja veeldumist.
    provenance:
      category: author_created_assessment
      source_reference: golden unit success criteria
      notes: Bilingual criterion for conceptual understanding and short Estonian output.
  - id: success-safe-observation
    text_ru: Следует инструкции, записывает наблюдение и отличает его от вывода.
    text_et: Järgib juhist, märgib vaatluse ja ütleb järelduse.
    provenance:
      category: author_created_assessment
      source_reference: golden unit practical success criteria
      notes: Safe-investigation criterion created for the supervised classroom activity.
prerequisites:
