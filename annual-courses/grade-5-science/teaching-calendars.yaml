    estonian_focus_et: kaart, jõgi, järv, vesi, aine, olekumuutus
    evidence: Three short stations produce separate subject and Estonian-language evidence.
    provenance: {category: author_created_assessment, source_reference: grade-5-water-04-changes-review plus annual bridge, notes: Existing water revision is extended only as an annual architecture reference.}
    implementation_status: validated_production_revision
  - revision_id: revision-water-ecosystems
    after_unit_id: grade-5-freshwater-ecosystems
