    after_unit_id: grade-5-weather-climate
    unit_ids: [grade-5-air-properties, grade-5-weather-climate]
    approximate_timing: closing lesson of unit 7
    subject_focus_ru: Связать свойства воздуха с измеряемыми элементами погоды и различием погоды и климата.
    estonian_focus_et: õhk, temperatuur, termomeeter, ilm, kliima, tuul, sademed
    evidence: A weather-data row and one Russian causal explanation show separate domains.
    provenance: {category: author_created_assessment, source_reference: grade-5 air and weather cumulative revision, notes: Planned revision architecture; full tasks are deferred.}
    implementation_status: architecture_only
  - revision_id: revision-environments-final
    after_unit_id: grade-5-bog-ecosystem
    unit_ids: [grade-5-baltic-sea, grade-5-settlements, grade-5-bog-ecosystem]
    approximate_timing: closing lesson of unit 10
    subject_focus_ru: Сравнить морскую, городскую и болотную среду, влияние человека и способы охраны.
    estonian_focus_et: Läänemeri, asula, soo, elukooslus, reostus, kaart
    evidence: Pupils classify evidence and give a full Russian comparison plus one short Estonian conclusion.
    provenance: {category: author_created_assessment, source_reference: grade-5 final environment revision architecture, notes: Final cumulative structure is planned; no complete test paper is created.}
    implementation_status: architecture_only
