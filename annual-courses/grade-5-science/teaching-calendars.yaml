    evidence: Pupils complete one concept map in Russian and selected labels in Estonian.
    provenance: {category: author_created_assessment, source_reference: grade-5 water and freshwater cumulative revision, notes: Planned cumulative revision; detailed worksheet is deferred.}
    implementation_status: architecture_only
