practical_work_calendar:
  - activity_id: practical-landform-model
    unit_id: grade-5-landforms-map
    title_ru: Модель рельефа и контур высоты
    title_et: Pinnavormi mudel ja kõrgusjoon
    activity_type: model
    selected_opiq_record_ids: [landforms-map-et-koolibri]
    expected_observations_or_data_ru: Ученики связывают форму модели с её плоским условным изображением и обозначают высокую и низкую часть.
    equipment: [пластилин или смятая бумага, поднос, карточки высоты, карандаш]
    safety_considerations: [Не бросать материалы и держать проходы свободными., После работы вымыть руки при использовании пластилина.]
    teacher_controlled_steps: [Учитель показывает безопасную сборку модели и разрезы по высоте., Учитель не требует точной топографической съёмки.]
    estimated_minutes: 25
    subject_skill: modelling and map interpretation
    estonian_language_function: describe
    assessment_role: formative_subject
    provenance: {category: author_created_bridge, source_reference: grade-5-landforms-map practical architecture, notes: Short model description derived from the selected canonical map page without copying a textbook procedure.}
    implementation_status: needs_teacher_review
  - activity_id: practical-river-route-map
    unit_id: grade-5-rivers-lakes
    title_ru: Путь реки на карте
    title_et: Jõe teekond kaardil
    activity_type: table_or_graph_interpretation
    selected_opiq_record_ids: [rivers-et-avita-2024, lakes-et-koolibri]
    expected_observations_or_data_ru: Ученики отмечают исток, направление течения, устье и ближайшее озеро или море в короткой таблице.
    equipment: [карта Эстонии, цветные карандаши, таблица наблюдения]
    safety_considerations: [Работа выполняется за столом без перемещения тяжёлых настенных карт.]
    teacher_controlled_steps: [Учитель заранее выбирает одну ясно читаемую реку и проверяет обозначения карты.]
    estimated_minutes: 25
    subject_skill: map reading and data recording
    estonian_language_function: sequence
    assessment_role: practical_skill
    provenance: {category: author_created_worksheet, source_reference: grade-5-rivers-lakes map task, notes: Author-created map table cites selected canonical river and lake sources.}
    implementation_status: architecture_only
  - activity_id: practical-water-state-observation
    unit_id: grade-5-water-four-lesson-plan
    title_ru: Наблюдение плавления и конденсации
    title_et: Sulamise ja veeldumise vaatlus
    activity_type: experiment
    selected_opiq_record_ids: [water-changes-et-koolibri-practical]
    expected_observations_or_data_ru: Ученики фиксируют уменьшение льда и появление капель на холодной поверхности и дают раздельные выводы.
    equipment: [лёд, прозрачные стаканы, холодная крышка, термометр, таблица наблюдения]
    safety_considerations: [Тёплую воду и стеклянные предметы контролирует учитель., Разлитую воду вытирают сразу.]
    teacher_controlled_steps: [Учитель выполняет этап с тёплой водой., Учитель проверяет безопасное использование термометра.]
    estimated_minutes: 24
    subject_skill: safe observation and measurement
    estonian_language_function: conclude
    assessment_role: practical_skill
    provenance: {category: author_created_bridge, source_reference: lesson-plans/grade-5-science/water/lesson-03.yaml, notes: Existing validated safe practical work is referenced without duplicating its full procedure.}
    implementation_status: validated_production_activity
  - activity_id: practical-water-filter-model
    unit_id: grade-5-water-use-cycle
    title_ru: Модель фильтрации загрязнённой воды
    title_et: Reostunud vee filtreerimise mudel
    activity_type: experiment
    selected_opiq_record_ids: [water-pollution-et-avita-2024, water-cycle-et-koolibri]
    expected_observations_or_data_ru: Ученики сравнивают вид модельной воды до и после фильтра и отмечают, что прозрачность не доказывает пригодность для питья.
    equipment: [вода с землёй, прозрачные ёмкости, воронка, бумажный фильтр, поднос]
    safety_considerations: [Модельную воду нельзя пить или пробовать., Руки моют после работы; пролитую воду вытирают сразу.]
    teacher_controlled_steps: [Учитель готовит только безопасную смесь воды и земли., Учитель явно запрещает вывод о питьевой безопасности.]
    estimated_minutes: 30
    subject_skill: controlled comparison and evidence limits
    estonian_language_function: conclude
    assessment_role: practical_skill
    provenance: {category: author_created_bridge, source_reference: grade-5-water-use-cycle filtration architecture, notes: Concise safe model linked to canonical pollution and cycle evidence; no textbook procedure is copied.}
    implementation_status: architecture_only
  - activity_id: practical-freshwater-food-web
    unit_id: grade-5-freshwater-ecosystems
    title_ru: Построение пищевой сети водоёма
    title_et: Veekogu toiduvõrgu koostamine
    activity_type: classification
    selected_opiq_record_ids: [freshwater-community-et-avita-2024, food-chains-et-koolibri]
    expected_observations_or_data_ru: Ученики классифицируют организмы по роли и соединяют несколько корректно направленных пищевых связей.
    equipment: [карточки организмов, стрелки, таблица ролей]
    safety_considerations: [Используются изображения; живые организмы не собираются и не тревожатся.]
    teacher_controlled_steps: [Учитель проверяет направление стрелок и научные названия до раздачи карточек.]
    estimated_minutes: 25
    subject_skill: classification and food-web modelling
    estonian_language_function: classify
    assessment_role: practical_skill
    provenance: {category: author_created_worksheet, source_reference: grade-5-freshwater-ecosystems card model, notes: Author-created cards summarise selected sources without reproducing textbook text.}
    implementation_status: architecture_only
  - activity_id: practical-air-space-model
    unit_id: grade-5-air-properties
    title_ru: Воздух занимает место
    title_et: Õhk võtab ruumi
    activity_type: experiment
    selected_opiq_record_ids: [air-composition-et-avita-2024]
    expected_observations_or_data_ru: Ученики наблюдают сопротивление запертого воздуха в шприце без иглы и описывают, что воздух занимает место.
    equipment: [пластиковые шприцы без игл, карточка наблюдения]
    safety_considerations: [Используются только шприцы без игл., Шприц не направляют на лицо и не разбирают.]
    teacher_controlled_steps: [Учитель проверяет отсутствие игл и ограничивает силу нажатия.]
    estimated_minutes: 20
    subject_skill: observation and evidence-based description
    estonian_language_function: describe
    assessment_role: formative_subject
    provenance: {category: author_created_bridge, source_reference: grade-5-air-properties air-space model, notes: Safe author-created demonstration linked to the canonical air-composition page.}
    implementation_status: architecture_only
  - activity_id: practical-weather-log
    unit_id: grade-5-weather-climate
    title_ru: Краткий журнал погоды
    title_et: Lühike ilmapäevik
    activity_type: measurement
    selected_opiq_record_ids: [weather-et-avita-2024]
    expected_observations_or_data_ru: Ученики записывают температуру, облачность, осадки и направление ветра в одинаковом формате несколько раз.
    equipment: [наружный термометр, безопасный указатель ветра, таблица погоды, часы]
    safety_considerations: [Наблюдение проводится из безопасного места по школьным правилам., Термометр устанавливает и проверяет учитель.]
    teacher_controlled_steps: [Учитель выбирает место и время измерения., Учитель моделирует одну строку таблицы до самостоятельной записи.]
    estimated_minutes: 15
    subject_skill: repeated measurement and data reporting
    estonian_language_function: report
    assessment_role: practical_skill
    provenance: {category: author_created_worksheet, source_reference: grade-5-weather-climate observation log, notes: Repeated table is author-created and linked to selected canonical weather evidence.}
    implementation_status: architecture_only
  - activity_id: practical-baltic-salinity-model
    unit_id: grade-5-baltic-sea
    title_ru: Сравнение модельной пресной и солоноватой воды
    title_et: Magevee ja riimvee mudeli võrdlus
    activity_type: measurement
    selected_opiq_record_ids: [baltic-sea-et-avita-2024]
    expected_observations_or_data_ru: Ученики сравнивают две заранее подготовленные безопасные модели по подписи и количеству соли, не пробуя растворы.
    equipment: [две подписанные ёмкости, вода, отмеренная поваренная соль, мерная ложка]
    safety_considerations: [Растворы не пробуют и не пьют., Соль и воду готовит учитель; разливы убираются сразу.]
    teacher_controlled_steps: [Учитель заранее готовит и подписывает модели., Учитель подчёркивает, что модель не воспроизводит всю морскую систему.]
    estimated_minutes: 20
    subject_skill: model comparison and measurement interpretation
    estonian_language_function: compare
    assessment_role: formative_subject
    provenance: {category: author_created_bridge, source_reference: grade-5-baltic-sea salinity model, notes: Concise model supports the selected Baltic source without claiming laboratory salinity analysis.}
    implementation_status: architecture_only
  - activity_id: practical-settlement-environment-audit
    unit_id: grade-5-settlements
    title_ru: Аудит среды возле школы
    title_et: Kooliümbruse keskkonna vaatlus
    activity_type: fieldwork
    selected_opiq_record_ids: [settlements-et-koolibri]
    expected_observations_or_data_ru: Ученики отмечают воду, зелёные зоны, шум, отходы и безопасные маршруты без оценки частных лиц.
    equipment: [план школьной территории, чек-лист, планшет или твёрдая папка]
    safety_considerations: [Маршрут и границы наблюдения заранее утверждает учитель., Группа соблюдает правила движения и не фотографирует людей без разрешения.]
    teacher_controlled_steps: [Учитель проводит инструктаж и ведёт группу., При плохой погоде используется виртуальное наблюдение по школьному плану.]
    estimated_minutes: 35
    subject_skill: local environmental observation
    estonian_language_function: report
    assessment_role: practical_skill
    provenance: {category: author_created_worksheet, source_reference: grade-5-settlements local audit, notes: Author-created field checklist bridges the selected Estonian source and full Russian explanation.}
    implementation_status: needs_teacher_review
  - activity_id: practical-bog-water-model
    unit_id: grade-5-bog-ecosystem
    title_ru: Модель удержания воды болотным субстратом
    title_et: Soo veesidumise mudel
    activity_type: model
    selected_opiq_record_ids: [bog-conditions-et-koolibri]
    expected_observations_or_data_ru: Ученики сравнивают количество удержанной воды в безопасных модельных материалах и обсуждают пределы модели.
    equipment: [губка, песок в закрытом контейнере, мерные стаканы, вода, поднос]
    safety_considerations: [Природный торф и живой мох не собираются., Воду не пьют; разливы вытирают сразу.]
    teacher_controlled_steps: [Учитель готовит одинаковые объёмы материалов и воды., Учитель объясняет, что губка не является болотом, а лишь показывает одно свойство.]
    estimated_minutes: 25
    subject_skill: model comparison and limitation
    estonian_language_function: conclude
    assessment_role: formative_subject
    provenance: {category: author_created_bridge, source_reference: grade-5-bog-ecosystem water-retention model, notes: Safe model is author-created and explicitly linked to canonical bog-condition evidence.}
    implementation_status: needs_teacher_review
