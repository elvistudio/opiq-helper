topic_architecture_decisions:
  - old_topic_ids: [landforms-and-map-reading]
    new_unit_id: grade-5-landforms-map
    decision: preserve
    reason: The topic is a compact prerequisite for later river, Baltic, settlement, and bog map work.
    affected_record_ids: [landforms-map-et-koolibri]
    deduplication_decision: Retain the strongest Koolibri map page; reject simplified material as ordinary evidence.
    annual_sequence_effect: Move the preserved topic to the opening block so map language is available later.
  - old_topic_ids: [rivers-and-lakes]
    new_unit_id: grade-5-rivers-lakes
    decision: preserve
    reason: River and lake concepts form one coherent spatial water-body unit with distinct bilingual roles.
    affected_record_ids: [rivers-ru-avita, lakes-ru-avita, rivers-et-avita-2024, lakes-et-koolibri]
    deduplication_decision: Keep Russian river and lake explanations plus distinct current Estonian and map evidence.
    annual_sequence_effect: Place after map literacy and before water as a substance.
  - old_topic_ids: [water-properties-and-states]
    new_unit_id: grade-5-water-four-lesson-plan
    decision: preserve
    reason: The merged four-lesson water unit is already a complete validated production thematic plan.
    affected_record_ids: [water-properties-ru-avita, water-states-ru-avita, water-properties-et-avita-2024, water-states-et-avita-2024, water-states-et-koolibri-practical, water-changes-et-koolibri-practical]
    deduplication_decision: Preserve the existing role-based six-page selection and its rejected duplicates.
    annual_sequence_effect: Retain the production unit after water-body context and before the water cycle.
  - old_topic_ids: [water-use-protection-and-cycle]
    new_unit_id: grade-5-water-use-cycle
    decision: preserve
    reason: Groundwater, use, protection, purification, and cycle form one connected application unit.
    affected_record_ids: [groundwater-ru-avita, water-use-ru-avita, water-pollution-et-avita-2024, water-cycle-et-koolibri]
    deduplication_decision: Retain complementary Russian explanation and Estonian cycle, pollution, and visual roles.
    annual_sequence_effect: Follow the water-properties unit to recycle state-change vocabulary immediately.
  - old_topic_ids: [freshwater-ecosystems]
    new_unit_id: grade-5-freshwater-ecosystems
    decision: preserve
    reason: Community structure, adaptations, and food relationships form a single ecosystem progression.
    affected_record_ids: [freshwater-community-ru-avita, freshwater-community-et-avita-2024, food-chains-et-koolibri]
    deduplication_decision: Retain one Russian core page, one current Estonian overview, and one food-chain assessment source.
    annual_sequence_effect: Place after physical water concepts and before wider ecosystem comparisons.
  - old_topic_ids: [air-properties-and-protection]
    new_unit_id: grade-5-air-properties
    decision: preserve
    reason: Air composition, properties, and protection provide one conceptual base for weather.
    affected_record_ids: [air-composition-ru-avita, air-protection-ru-avita, air-composition-et-avita-2024, air-pollution-et-avita-2024]
    deduplication_decision: Retain distinct composition and protection roles in Russian and Estonian.
    annual_sequence_effect: Place directly before weather so õhk and temperatuur recur.
  - old_topic_ids: [weather-and-climate]
    new_unit_id: grade-5-weather-climate
    decision: preserve
    reason: Weather observations and introductory climate comparison form one six-lesson progression.
    affected_record_ids: [weather-ru-avita, climate-ru-avita, weather-et-avita-2024, climate-et-avita-2024]
    deduplication_decision: Select weather and climate pages by language role; measurement tasks are author-created bridges.
    annual_sequence_effect: Follow air and precede the Baltic unit that reuses weather and climate language.
  - old_topic_ids: [baltic-sea]
    new_unit_id: grade-5-baltic-sea
    decision: preserve
    reason: Baltic salinity, ecosystem, human use, weather influence, pollution, and protection belong together.
    affected_record_ids: [baltic-sea-ru-avita, baltic-protection-ru-avita, baltic-sea-et-avita-2024, baltic-protection-et-avita-2024]
    deduplication_decision: Retain distinct core and protection pages in both languages; reject older duplicates.
    annual_sequence_effect: Place after freshwater, air, and weather so comparisons use established concepts.
  - old_topic_ids: [settlements]
    new_unit_id: grade-5-settlements
    decision: preserve
    reason: Settlement forms and environmental conditions remain coherent but need Russian author material.
    affected_record_ids: [settlements-et-koolibri]
    deduplication_decision: Use the sole ordinary Estonian page-level candidate and do not promote simplified pages.
    annual_sequence_effect: Place late so pupils can apply map, water, air, pollution, and environment concepts.
  - old_topic_ids: [bog-ecosystem]
    new_unit_id: grade-5-bog-ecosystem
    decision: preserve
    reason: Bog formation, conditions, organisms, use, and protection provide a cumulative ecosystem unit.
    affected_record_ids: [bog-conditions-et-koolibri]
    deduplication_decision: Use the sole ordinary Estonian core candidate and require an explicit Russian explanation.
    annual_sequence_effect: End with a synthesis of water, map, ecosystem, and protection concepts.
