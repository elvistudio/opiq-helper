known_gaps:
  - Only the four-lesson water unit has a complete thematic plan and detailed lesson artifacts.
  - The official map contains a verified relevant subset of school-stage outcomes, not all 36 outcomes and not an exact-grade-5 allocation.
  - Landforms need a reviewed Russian bridge; settlements and bogs need full Russian author explanations.
  - Nine unit lesson estimates remain architectural until their thematic-plan PRs validate the detailed sequence.
  - Practical descriptions, revision points, and assessments outside the water unit are concise architecture, not ready-to-print materials.
  - The one-lesson-per-week assumption has a documented 19-lesson shortfall; schools must use a feasible local timetable.
  - No simplified-curriculum or cover-only source is selected as ordinary course material.
