sequence_policy:
  publisher_sequence: >-
    Avita and Koolibri orders establish publisher grade-5 evidence but differ in grouping and
    repetition; no book is traversed from cover to cover.
  curriculum_logic: >-
    Map literacy precedes spatial topics; water properties support cycles and ecosystems; air
    supports weather; earlier water, ecosystem, and map concepts converge in later units.
  curated_sequence: >-
    Ten deduplicated topic groups are retained once, ordered by prerequisites and opportunities
    for observation, revision, assessment, and cumulative Estonian-language reuse.
  relationship: publisher_evidence_informs_but_does_not_define_curated_order
