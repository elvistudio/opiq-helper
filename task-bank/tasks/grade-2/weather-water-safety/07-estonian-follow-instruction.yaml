expected_time_minutes: 4
customer_content:
  prompt: "Прочитай короткую инструкцию на эстонском. Выбери нужную карточку и подпиши её одним словом по-эстонски."
  supplied_materials:
    - "Инструкция: Vali pilvise ilma kaart."
    - "A — päike; B — pilved; C — vihm."
  supplied_data: []
  answer_format: "Буква карточки и одно эстонское слово."
  estonian_output_requirement:
    required: true
    level: A1
    maximum_words: 1
    support: "Слова для выбора уже даны на карточках."
answer_contract:
  answer: "B — pilved."
  worked_solution: null
  success_criteria:
    - criterion_id: follows-estonian-instruction
      dimension: subject_result
      description: "Выбрана карточка B, соответствующая облачной погоде."
    - criterion_id: writes-estonian-weather-word
      dimension: estonian_language
      description: "Слово pilved записано разборчиво; небольшая орфографическая ошибка обсуждается отдельно."
  acceptable_variants:
    - "Допустимо слово pilvine, если карточка B выбрана верно."
  common_errors:
    - "Выбрана карточка по знакомому слову, но не по смыслу инструкции."
    - "Дан только русский ответ."
  feedback:
    correct: "Ты понял(а) инструкцию и отдельно записал(а) эстонское слово."
    retry: "Найди в инструкции слово pilvise и сопоставь его с подписями карточек."
