official_outcome_ids:
  - ee-prk-2026-stage1-mathematics-real-life
target_skill: Read an original weather dataset, compare whole numbers, and express one numerical difference.
response_mode: computational
difficulty: core
expected_time_minutes: 6
customer_content:
  prompt: "В четырёх баночках собрали дождевую воду. В какой день воды больше всего? На сколько миллиметров это больше, чем в день с наименьшим значением? Запиши сравнение и вычисление."
  supplied_materials:
    - "Понедельник — 13 мм."
    - "Вторник — 28 мм."
    - "Среда — 17 мм."
    - "Четверг — 22 мм."
  supplied_data:
    - "13, 28, 17, 22 миллиметра."
  answer_format: "Название дня, сравнение чисел и одно действие вычитания."
  estonian_output_requirement:
    required: false
    level: null
    maximum_words: null
    support: "Эстонский ответ не требуется."
answer_contract:
  answer: "Больше всего во вторник. 28 > 22 > 17 > 13; 28 − 13 = 15 мм."
  worked_solution: "Шаг 1: сравнить 13, 28, 17 и 22; наибольшее число 28, наименьшее 13. Шаг 2: найти разность: 28 − 13 = 15. Шаг 3: записать единицу измерения — 15 мм."
  success_criteria:
    - criterion_id: maximum-weather-value
      dimension: subject_result
      description: "Правильно найдено наибольшее значение 28 мм."
    - criterion_id: weather-value-difference
      dimension: subject_result
      description: "Показано вычисление 28 − 13 = 15 мм."
  acceptable_variants:
    - "Полная цепочка сравнений необязательна, если максимум, минимум и вычитание указаны верно."
  common_errors:
    - "Вычислено 28 − 22 вместо разности между максимумом и минимумом."
    - "В ответе пропущены миллиметры."
  feedback:
    correct: "Верно: ты нашёл(ла) максимум, минимум и разность."
    retry: "Сначала обведи самое большое и самое маленькое числа, затем вычти меньшее из большего."
