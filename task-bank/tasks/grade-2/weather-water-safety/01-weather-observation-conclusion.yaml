expected_time_minutes: 5
customer_content:
  prompt: "Прочитай две записи дежурного. Напиши О рядом с наблюдением и В рядом с выводом. Затем объясни один выбор: «Я так решил(а), потому что…»"
  supplied_materials:
    - "1. На верёвке во дворе синие ленты вытянулись в одну сторону."
    - "2. На улице дует ветер."
  supplied_data: []
  answer_format: "Две буквы и одно короткое объяснение по-русски."
  estonian_output_requirement:
    required: false
    level: null
    maximum_words: null
    support: "Эстонский ответ не требуется."
answer_contract:
  answer: "1 — О; 2 — В. Ленты можно увидеть, а ветер заключают по их движению."
  worked_solution: null
  success_criteria:
    - criterion_id: observation-conclusion
      dimension: subject_result
      description: "Правильно различены наблюдение и вывод."
    - criterion_id: evidence-reason
      dimension: subject_result
      description: "Объяснение связывает вывод с движением лент."
  acceptable_variants:
    - "Допустима формулировка о том, что направление лент является видимым признаком ветра."
  common_errors:
    - "Обе записи названы наблюдениями."
    - "Причина не связана с данными задачи."
  feedback:
    correct: "Верно: ты отделил(а) увиденный признак от вывода."
    retry: "Спроси себя, какую запись можно увидеть прямо, а какую нужно объяснить по признаку."
