customer_content:
  prompt: "Расположи карточки так, чтобы получилась понятная инструкция для сообщения о погоде. Запиши буквы по порядку и объясни, почему две соседние карточки стоят рядом."
  supplied_materials:
    - "А. Сравни запись с утренней строкой."
    - "Б. Посмотри на небо и термометр."
    - "В. Сообщи классу, что изменилось."
    - "Г. Запиши увиденное в новую строку."
  supplied_data: []
  answer_format: "Четыре буквы по порядку и одно объяснение по-русски."
  estonian_output_requirement:
    required: false
    level: null
    maximum_words: null
    support: "Эстонский ответ не требуется."
answer_contract:
  answer: "Б, Г, А, В. Сначала нужно увидеть данные, затем записать их; только после этого можно сравнить и сообщить изменение."
  worked_solution: null
  success_criteria:
    - criterion_id: coherent-weather-sequence
      dimension: subject_result
      description: "Карточки расположены в порядке Б, Г, А, В."
    - criterion_id: sequence-reason
      dimension: subject_result
      description: "Объяснение показывает логическую связь хотя бы одной пары соседних действий."
  acceptable_variants:
    - "Допустима другая формулировка причины при сохранении порядка Б, Г, А, В."
  common_errors:
    - "Сообщение классу поставлено до наблюдения и записи."
    - "Записаны действия без объяснения."
  feedback:
    correct: "Последовательность позволяет сначала получить данные, а затем сообщить вывод."
    retry: "Найди действие, без которого нельзя ничего записать, и начни с него."
