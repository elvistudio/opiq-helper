    support: "Эстонский ответ не требуется."
answer_contract:
  answer: "Погода на короткое время изменила план ребят. Деталь: из-за дождя чтение перенесли в класс."
  worked_solution: null
  success_criteria:
    - criterion_id: weather-message-main-point
      dimension: subject_result
      description: "Главная мысль охватывает всё сообщение, а не одну случайную деталь."
    - criterion_id: message-supporting-detail
      dimension: subject_result
      description: "Выбранная деталь прямо подтверждает главную мысль."
  acceptable_variants:
    - "Допустима мысль о временном влиянии дождя на занятие при наличии подходящей детали."
  common_errors:
    - "Главной мыслью назван только сухой двор утром."
    - "Выписана деталь, не связанная с сформулированной мыслью."
  feedback:
    correct: "Главная мысль охватывает весь текст и подтверждена деталью."
    retry: "Проверь, объясняет ли твоя мысль, зачем в сообщении нужны все четыре предложения."
