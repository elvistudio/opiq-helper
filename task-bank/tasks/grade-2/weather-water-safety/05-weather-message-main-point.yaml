  supplied_materials:
    - "Утром двор был сухим. К обеду появились тёмные облака, и начался короткий дождь. Ребята перенесли чтение с площадки в класс. После дождя они снова вышли на улицу."
  supplied_data: []
  answer_format: "Одна главная мысль и одна подтверждающая деталь по-русски."
