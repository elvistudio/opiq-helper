  success_criteria:
    - criterion_id: individual-accurate-weather-statement
      dimension: subject_result
      description: "Первое предложение точно передаёт одно значение и его точку."
    - criterion_id: individual-supported-comparison
      dimension: subject_result
      description: "Второе предложение сравнивает минимум два значения без ошибки."
    - criterion_id: attributable-project-contribution
      dimension: individual_contribution
      description: "Обе фразы и личный код находятся в отдельной рамке ученика."
  acceptable_variants:
    - "Любые два предложения, удовлетворяющие всем трём критериям, принимаются."
  common_errors:
    - "В сравнении нет двух чисел или точек."
    - "Есть только общий групповой текст без индивидуальной рамки."
  feedback:
    correct: "Твоя отдельная рамка содержит точный факт и проверяемое сравнение."
    retry: "Проверь одно значение, сравни его с другим и подпиши только свою рамку."
  open_ended_justification: "Несколько формулировок могут быть правильными, потому что ученик самостоятельно выбирает факт и сравнение из нового набора данных."
