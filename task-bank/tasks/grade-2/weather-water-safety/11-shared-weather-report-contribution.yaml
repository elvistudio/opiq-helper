customer_content:
  prompt: "Подготовь свою часть общего сообщения. Напиши одно точное предложение о данных и одно предложение-сравнение. Поставь в своей рамке личный код. Только после проверки рамки группа может перенести идеи в общий текст."
  supplied_materials:
    - "Северная точка — 8 °C."
    - "Восточная точка — 12 °C."
    - "Южная точка — 15 °C."
    - "Западная точка — 10 °C."
  supplied_data:
    - "Каждый ученик сдаёт отдельную подписанную рамку из двух предложений."
  answer_format: "Два индивидуальных предложения по-русски и личный код."
  estonian_output_requirement:
    required: false
    level: null
    maximum_words: null
    support: "Эстонский ответ не требуется."
