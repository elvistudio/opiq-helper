customer_content:
  prompt: "На улице сильный холодный ветер. Выбери безопасное действие, а затем составь короткую фразу на эстонском из слов банка."
  supplied_materials:
    - "Действия: выйти без шапки; надеть шапку; оставить шапку дома."
    - "Банк слов: Pane | müts | pähe."
  supplied_data: []
  answer_format: "Название безопасного действия по-русски и фраза из трёх эстонских слов."
  estonian_output_requirement:
    required: true
    level: A1-A2
    maximum_words: 3
    support: "Все нужные эстонские слова даны в независимом банке."
answer_contract:
  answer: "Надеть шапку. Pane müts pähe."
  worked_solution: null
  success_criteria:
    - criterion_id: selects-weather-safety-action
      dimension: subject_result
      description: "Выбрано действие «надеть шапку» как подходящее условию."
    - criterion_id: produces-estonian-safety-phrase
      dimension: estonian_language
      description: "Три слова расположены как Pane müts pähe и передают безопасное действие."
  acceptable_variants:
    - "Допустимо устное произнесение фразы, если отдельно зафиксирован выбор безопасного действия."
  common_errors:
    - "Фраза составлена верно, но выбрано другое действие."
    - "Выбор верен, но порядок эстонских слов не передаёт инструкцию."
  feedback:
    correct: "Безопасное действие выбрано верно, а эстонская фраза сообщает его отдельно."
    retry: "Сначала реши, что безопасно при холодном ветре, затем начни фразу с действия Pane."
