target_skill: Choose and justify the safest immediate action in an independently authored water-safety decision.
response_mode: short_answer
difficulty: core
expected_time_minutes: 5
customer_content:
  prompt: "Во время занятия у берега твой красный мяч уплыл за линию, которую взрослый назвал границей безопасной зоны. Что нужно сделать сразу? Выбери действие и объясни два признака безопасного решения."
  supplied_materials:
    - "A. Плыть за мячом, пока он виден."
    - "B. Остаться в безопасной зоне и сразу сообщить взрослому."
    - "C. Попросить другого ребёнка достать мяч."
  supplied_data: []
  answer_format: "Буква варианта и короткое объяснение по-русски."
  estonian_output_requirement:
    required: false
    level: null
    maximum_words: null
    support: "Эстонский ответ не требуется."
answer_contract:
  answer: "B. Нужно остаться внутри безопасной зоны и сообщить взрослому: ребёнок не приближается к опасности, а решение принимает ответственный взрослый."
  worked_solution: null
  success_criteria:
    - criterion_id: immediate-water-safety-action
      dimension: subject_result
      description: "Выбран вариант B без входа за границу безопасной зоны."
    - criterion_id: water-safety-reason
      dimension: subject_result
      description: "Объяснение называет дистанцию от опасности и помощь взрослого."
  acceptable_variants:
    - "Допустима формулировка «не идти за мячом и позвать взрослого»."
  common_errors:
    - "Спасение предмета поставлено выше соблюдения границы безопасности."
    - "Опасное действие передано другому ребёнку."
  feedback:
    correct: "Безопасность важнее мяча: ты остаёшься в зоне и обращаешься к взрослому."
    retry: "Найди вариант, где ни один ребёнок не пересекает установленную границу."
