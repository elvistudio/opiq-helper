target_skill: Read an original weather dataset, compare whole numbers, and express one numerical difference.
prerequisite_skills:
  - Compare whole numbers within 100.
  - Subtract a smaller whole number from a larger one.
cognitive_action: compare_and_calculate
task_archetype: small_data_table
response_mode: computational
difficulty: core
expected_time_minutes: 6
permitted_value_ranges:
  - Use four independently chosen whole-number measurements from 5 to 60 with one unique maximum.
common_misconceptions:
  - Naming the larger value without calculating the difference.
  - Subtracting in the wrong order.
expected_learner_evidence:
  - Identifies the largest value.
  - Shows a subtraction that gives the requested difference.
success_evidence_type: calculation
accessibility_support:
  - Align numbers vertically and label each value with its unit.
language_support:
  - Provide Russian terms for greater than, less than, and difference.
project_or_real_life_contexts:
  - Comparing independently created daily rainfall totals for four days.
