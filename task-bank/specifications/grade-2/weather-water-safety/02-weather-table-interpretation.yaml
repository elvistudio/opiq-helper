target_skill: Record short weather observations in a table and state one pattern supported by the entries.
prerequisite_skills:
  - Read a three-column table.
  - Compare simple weather observations.
cognitive_action: record_and_interpret
task_archetype: completed_observation_table
response_mode: procedural
difficulty: core
expected_time_minutes: 8
permitted_value_ranges:
  - Use three independently selected observation times and whole-number temperatures from 0 to 20 degrees.
common_misconceptions:
  - Giving a conclusion that is not supported by any row.
  - Copying a value into the wrong column.
expected_learner_evidence:
  - Completes all missing cells from supplied independent observations.
  - States one comparison that cites two table entries.
success_evidence_type: completed_table
accessibility_support:
  - Use a high-contrast table with a sample row that contains different data from the scored rows.
language_support:
  - Provide Russian comparison starters and keep weather labels visually consistent.
project_or_real_life_contexts:
  - A classroom observation log for one independently invented day.
