target_skill: Read a newly authored short weather message and identify its main point using textual evidence.
prerequisite_skills:
  - Read four short Russian sentences.
  - Distinguish a central message from one detail.
cognitive_action: identify_main_point
task_archetype: short_informational_message
response_mode: short_answer
difficulty: core
expected_time_minutes: 6
permitted_value_ranges:
  - Use an independently authored Russian message of 35 to 50 words with one clear main point.
common_misconceptions:
  - Selecting a vivid detail instead of the message that covers the whole text.
expected_learner_evidence:
  - States the main point in one Russian sentence.
  - Names one supporting detail from the new message.
success_evidence_type: short_written_response
accessibility_support:
  - Break the message into four short lines and bold no answer-bearing words.
language_support:
  - Provide a Russian main-point sentence starter.
project_or_real_life_contexts:
  - A fictional class weather notice written solely for this task.
