target_skill: Produce a short supported Estonian weather-safety phrase with a separately assessed communicative meaning.
prerequisite_skills:
  - Recognize one familiar safety verb in Estonian.
  - Copy or complete a short phrase frame.
cognitive_action: produce_supported_phrase
task_archetype: bounded_phrase_completion
response_mode: short_answer
difficulty: core
expected_time_minutes: 5
permitted_value_ranges:
  - Require an independently authored Estonian output of three to six words at bounded A1 to A2 level.
common_misconceptions:
  - Producing weather vocabulary without communicating the requested safe action.
expected_learner_evidence:
  - Chooses a safe action for the supplied independent weather condition.
  - Completes a short Estonian phrase that communicates that action.
success_evidence_type: oral_or_written_phrase
accessibility_support:
  - Offer a two-part phrase frame and a small independent word bank.
language_support:
  - Explain the safety decision in Russian and assess the Estonian phrase separately.
project_or_real_life_contexts:
  - Giving a brief familiar safety reminder before outdoor activity.
