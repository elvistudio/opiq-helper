target_skill: Solve a newly authored real-life elapsed-time problem and show the calculation in ordered steps.
prerequisite_skills:
  - Read whole hours and half hours.
  - Add two durations that total no more than two hours.
cognitive_action: solve_elapsed_time
task_archetype: real_life_duration_problem
response_mode: computational
difficulty: core
expected_time_minutes: 7
permitted_value_ranges:
  - Use independently chosen durations in 15-minute increments with a total below 120 minutes.
common_misconceptions:
  - Treating the finishing clock time as the elapsed duration.
  - Omitting units from the answer.
expected_learner_evidence:
  - Adds the component durations in a visible sequence.
  - Gives the final duration with the correct unit.
success_evidence_type: calculation
accessibility_support:
  - Show a blank two-step number line without filled values.
language_support:
  - Use short Russian sentences and display the time-unit words beside the answer line.
project_or_real_life_contexts:
  - Planning two independent parts of a weather-observation session.
