  - Use one original scenario with three plausible actions and one clearly safest immediate response.
common_misconceptions:
  - Entering the water to retrieve an object without adult supervision.
expected_learner_evidence:
  - Selects the safest immediate action.
  - Gives a reason that mentions distance from danger and adult help.
success_evidence_type: selected_response
accessibility_support:
  - Use short text-only choices so no visual reconstruction or interpretation is required.
language_support:
  - Explain the situation in Russian and provide a short reason frame.
project_or_real_life_contexts:
  - An unfamiliar floating object seen beyond the marked safe area.
