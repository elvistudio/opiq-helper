specification_id: g2-estonian-follow-instruction-spec
status: internal_review
grade: 2
subject: estonian_second_language
subject_et: eesti keel teise keelena
instruction_language: ru
learner_language_level: A1-A2
official_outcome_ids:
  - ee-prk-2026-stage1-estonian-second-language-instructions
official_scope:
  kind: school_stage
  school_stage: 1
  terminal_grade: 3
  exact_grade_claimed: false
target_skill: Follow one short familiar Estonian weather instruction and show the requested observable response.
prerequisite_skills:
  - Recognize familiar Estonian weather words.
  - Follow a one-step classroom direction.
cognitive_action: follow_instruction
task_archetype: one_step_instruction
response_mode: short_answer
difficulty: foundational
expected_time_minutes: 4
permitted_value_ranges:
  - Use one independently authored A1 instruction of no more than eight Estonian words.
common_misconceptions:
  - Responding to a familiar noun while missing the action verb.
expected_learner_evidence:
  - Selects the weather symbol named by the instruction.
  - Produces the separately requested short Estonian label.
success_evidence_type: selected_response
accessibility_support:
  - Use three simple author-created text symbols with no decorative detail.
language_support:
  - Give the task explanation in Russian and keep the Estonian instruction at A1 level.
project_or_real_life_contexts:
  - Responding to a familiar classroom weather direction.
