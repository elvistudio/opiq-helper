target_skill: Distinguish a directly observed weather fact from a conclusion supported by that fact.
prerequisite_skills:
  - Recognize common weather features.
  - Read one short factual sentence.
cognitive_action: distinguish_evidence_and_conclusion
task_archetype: paired_observation_and_inference
response_mode: short_answer
difficulty: core
expected_time_minutes: 5
permitted_value_ranges:
  - Use two newly authored weather statements with no borrowed names or measurements.
common_misconceptions:
  - Treating a prediction or opinion as something directly observed.
expected_learner_evidence:
  - Labels one statement as an observation and the other as a conclusion.
  - Gives one brief reason tied to visible or measured evidence.
success_evidence_type: short_written_response
accessibility_support:
  - Present the two statements on separate lines with observation and conclusion icons.
language_support:
  - Give Russian sentence starters for the reason without supplying the decision.
project_or_real_life_contexts:
  - A short class weather check before going outdoors.
