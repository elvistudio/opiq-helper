target_skill: Arrange independently authored weather-report instructions into a coherent logical sequence.
prerequisite_skills:
  - Read four short Russian action sentences.
  - Recognize first, next, and final actions.
cognitive_action: sequence_actions
task_archetype: ordered_instruction_cards
response_mode: short_answer
difficulty: core
expected_time_minutes: 5
permitted_value_ranges:
  - Use four original actions with one unambiguous order and no source-derived characters.
common_misconceptions:
  - Placing the reporting step before the observation is recorded.
expected_learner_evidence:
  - Writes the four card letters in a coherent order.
  - Explains one adjacency using a Russian because-clause.
success_evidence_type: ordered_sequence
accessibility_support:
  - Give each instruction a large letter and a single action verb.
language_support:
  - Provide Russian sequencing words beside the response line.
project_or_real_life_contexts:
  - Preparing a small class weather report with independently designed steps.
