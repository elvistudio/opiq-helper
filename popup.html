<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 330px; padding: 16px; font-family: Arial, sans-serif; font-size: 13px; }
    h2 { margin: 0 0 12px; font-size: 15px; }
    label { display: block; margin-bottom: 3px; color: #555; font-size: 12px; }
    input, select {
      width: 100%; padding: 5px 7px; margin-bottom: 8px;
      border: 1px solid #ccc; border-radius: 4px;
      box-sizing: border-box; font-size: 12px;
    }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }
    .btn-row { display: flex; gap: 6px; margin-bottom: 8px; }
    button {
      flex: 1; padding: 7px 4px; border: none; border-radius: 4px;
      cursor: pointer; font-size: 12px; font-weight: bold;
    }
    #startBtn  { background: #4CAF50; color: white; }
    #stopBtn   { background: #f44336; color: white; display: none; }
    #exportBtn { background: #2196F3; color: white; }
    #clearBtn  { background: #9e9e9e; color: white; }
    #status {
      padding: 7px; background: #f5f5f5; border-radius: 4px;
      font-size: 11px; min-height: 32px; color: #333;
      margin-bottom: 6px; word-break: break-word;
    }
    #stats { font-size: 11px; color: #555; margin-bottom: 8px; line-height: 1.6; }
    .stats-book { padding: 2px 0; border-bottom: 1px solid #eee; }
    hr { border: none; border-top: 1px solid #eee; margin: 8px 0; }
    .sec { font-weight: bold; font-size: 11px; color: #444; margin-bottom: 4px; }
  </style>
</head>
<body>
  <h2>📚 Opiq Book Scraper</h2>

  <div class="sec">Метаданные книги</div>
  <div class="row">
    <div>
      <label>Издательство</label>
      <input id="publisher" placeholder="Avita / Koolibri">
    </div>
    <div>
      <label>Класс</label>
      <input id="grade" type="number" min="1" max="12" placeholder="1">
    </div>
  </div>
  <div class="row">
    <div>
      <label>Язык</label>
      <select id="language">
        <option value="ru">Русский</option>
        <option value="et">Eesti</option>
        <option value="en">English</option>
      </select>
    </div>
    <div>
      <label>Предмет</label>
      <input id="subject" placeholder="Математика">
    </div>
  </div>
  <label>Название книги (bookId)</label>
  <input id="bookName" placeholder="avita_math_1_ru">

  <hr>
  <div class="sec">Навигация</div>
  <label>Селектор кнопки «Далее»</label>
  <input id="selector" value='a[title="Järgmine peatükk"]'>

  <hr>
  <div class="btn-row">
    <button id="startBtn">▶ Запустить</button>
    <button id="stopBtn">⏹ Стоп</button>
  </div>

  <div id="status">Готов к работе.</div>

  <hr>
  <div class="sec">База знаний</div>
  <div id="stats">Пусто.</div>

  <div class="btn-row">
    <button id="exportBtn">💾 Скачать v2 ZIP</button>
    <button id="importBtn">📂 Импорт ZIP</button>
    <button id="clearBtn">🗑 Очистить</button>
  </div>
  <input type="file" id="importFile" accept=".zip" style="display:none">

  <script src="popup.js"></script>
</body>
</html>
