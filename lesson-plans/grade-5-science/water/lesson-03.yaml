questions:
  - question_id: question-condensation-origin
    question_ru: Откуда появились капли на холодной крышке?
    question_et: Mis juhtub veeauruga külmal pinnal?
    full_expected_answer_ru: Водяной пар у холодной поверхности охлаждается и превращается в капли жидкой воды; этот процесс называется конденсацией.
    short_oral_answer_et: Veeaur jahtub ja veeldub veeks.
    acceptable_variants:
      - Külmal pinnal veeaur veeldub.
      - Veeaur muutub veeks.
    misconception_to_watch: Капли не прошли сквозь крышку и не возникли из материала крышки.
    objective_refs: [explain-melting-condensation, report-phase-change-et]
    provenance_refs: [water-changes-koolibri, phase-change-diagram]
  - question_id: question-melting-data
    question_ru: Как данные подтверждают, что лёд плавился?
    question_et: Mis juhtub jääga soojas kohas?
    full_expected_answer_ru: Лёд уменьшался, появилась жидкая вода, а температура образца изменилась; наблюдения показывают переход из твёрдого состояния в жидкое.
    short_oral_answer_et: Jää sulab ja muutub vedelaks veeks.
    acceptable_variants:
      - Soojas kohas jää sulab.
      - Jää muutub veeks.
    misconception_to_watch: Исчезновение куска льда не означает исчезновения вещества воды.
    objective_refs: [explain-melting-condensation, conduct-safe-water-observation, report-phase-change-et]
    provenance_refs: [water-changes-koolibri, melting-condensation-table]
practical_work:
  work_id: observe-melting-condensation
  title_ru: Наблюдаем плавление и конденсацию
  title_et: Vaatleme sulamist ja veeldumist
  safety_requirements:
    - Ученики не кипятят воду и не касаются сосуда с тёплой водой.
    - Тёплую воду наливает и демонстрационный сосуд перемещает только учитель.
    - Термометры используются по инструкции; стеклянные приборы заменяются безопасными школьными моделями.
  teacher_controlled_steps:
    - Учитель заранее проверяет безопасные термометры и готовит одинаковые кусочки льда.
    - Учитель сам наливает тёплую воду в устойчивый прозрачный сосуд и закрывает его холодной крышкой.
    - Учитель убирает тёплую воду сразу после наблюдения капель.
  pupil_steps:
    - Положить лёд в два подписанных безопасных места и записать начальное наблюдение.
    - Измерить доступную температуру по команде учителя и записать результат.
    - Сравнить скорость таяния и наблюдать капли на холодной крышке с безопасного расстояния.
    - Сначала записать наблюдение, затем отдельно сформулировать вывод.
  materials:
    - Одинаковые кусочки льда, два устойчивых поддона и безопасные школьные термометры.
    - Подготовленный учителем сосуд с тёплой водой и холодная прозрачная крышка.
    - Двуязычная таблица и карточка безопасной работы.
  observation_table:
    columns: [Время, Температура, Наблюдение, Вывод, Märksõna eesti keeles]
    data_collection_ru: Группа записывает начальное и конечное состояние, доступную температуру и отдельный вывод для каждого процесса.
  expected_observation_ru: В более тёплом месте лёд быстрее превращается в жидкую воду; на холодной крышке появляются капли.
  expected_conclusion_ru: При получении тепла лёд плавится, а при охлаждении у поверхности водяной пар конденсируется в жидкую воду.
  russian_report_target: Полный отчёт содержит условия, два наблюдения, два объяснения и различает данные и вывод.
  short_estonian_conclusion: Soojas jää sulab; külmal pinnal veeaur veeldub.
  opiq_source_record_ids: [water-states-koolibri, water-changes-koolibri]
  provenance_refs: [water-states-koolibri, water-changes-koolibri, melting-condensation-table, practical-safety-card]
