  - scaffold_id: pair-rehearsal-conclusion
    type: pair_rehearsal
    description_ru: Перед индивидуальным ответом ученики один раз репетируют короткий эстонский вывод в паре.
    stage_refs: [observe-changes]
    release:
      at_stage: separate-conclusions
      how_reduced_ru: Индивидуальный ответ даётся без помощи партнёра.
    provenance:
      category: author_created_bridge
