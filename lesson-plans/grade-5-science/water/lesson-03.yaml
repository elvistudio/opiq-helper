methodology:
  model: russian_primary_estonian_supported
  approaches:
    - content_language_dual_objectives
    - planned_translanguaging
    - gradual_scaffolding
    - pluriliteracies
    - multimodal_support
    - vocabulary_recycling
    - cognitive_load_control
    - separate_content_language_assessment
  content_priority: subject_comprehension_not_reduced_by_language_support
  language_path:
    - sequence: 1
      stage_id: activate-state-model
      language_mode: activate_prior_knowledge
      description: Схема трёх состояний и знакомые эстонские термины быстро восстанавливаются.
    - sequence: 2
      stage_id: explain-changes-ru
      language_mode: establish_concept_ru
      description: Причина и результат плавления и конденсации объясняются по-русски.
    - sequence: 3
      stage_id: bridge-process-terms-et
      language_mode: introduce_term_et
      description: Новые термины и инструкции вводятся через понятую схему и демонстрацию.
    - sequence: 4
      stage_id: observe-changes
      language_mode: supported_task_et
      description: Ученики следуют коротким инструкциям, измеряют и заполняют двуязычную таблицу.
    - sequence: 5
      stage_id: separate-conclusions
      language_mode: full_subject_answer_ru
      description: Полный вывод по-русски оценивается отдельно от короткого эстонского ответа.
    - sequence: 6
      stage_id: homework-launch
      language_mode: recycle_language
      description: Слова и рамка повторно применяются к безопасному домашнему наблюдению.
  learner_estonian_level: A1-A2
  planned_support_level: high
  scaffold_release:
    introduction: full_support
    guided_practice: partial_support
    final_output: short_independent_output
  content_language_assessment_policy: separate_content_and_estonian_language_evidence
objectives:
  content_objectives:
    - objective_id: explain-melting-condensation
      text_ru: Ученик объясняет плавление и конденсацию как изменения состояния при передаче тепла.
      observable_output_ru: Записывает наблюдения и даёт два причинно-следственных вывода по-русски.
      curriculum_outcome_refs: [prok-ii-loodusopetus-18-water-properties]
    - objective_id: conduct-safe-water-observation
      text_ru: Ученик безопасно измеряет и наблюдает изменения, различая наблюдение и вывод.
      observable_output_ru: Выполняет все ученические шаги безопасно и заполняет минимум четыре ячейки данных.
      curriculum_outcome_refs: [prok-ii-loodusopetus-04-safe-investigation]
  estonian_language_objectives:
    - objective_id: report-phase-change-et
      text_ru: Ученик следует двум инструкциям и даёт короткий вывод о плавлении или конденсации.
      text_et: Õpilane järgib kahte juhist ja ütleb ühe lühikese järelduse.
      observable_output: give_short_oral_answer
      minimum_quantity: 2
      language_functions: [sequence, conclude, report]
  subject_success_criteria:
    - criterion_id: subject-two-causal-conclusions
      descriptor: Два вывода связывают изменение температуры с изменением состояния.
      acceptable_evidence: Таблица наблюдений и полный русский отчёт о плавлении и конденсации.
    - criterion_id: subject-safe-data-collection
      descriptor: Измерения выполнены безопасно, а наблюдения записаны до вывода.
      acceptable_evidence: Соблюдённая процедура и не менее четырёх заполненных ячеек данных.
  estonian_success_criteria:
    - criterion_id: language-instructions-and-conclusion
      descriptor: Ученик выполняет mõõda и kirjuta и произносит один понятный короткий вывод.
      acceptable_evidence: Два выполненных действия и фраза с sulamine или veeldumine.
  prerequisites:
    - Ученик различает tahke, vedel, gaasiline и veeaur из урока 2.
    - Ученик умеет безопасно читать простую шкалу термометра под руководством учителя.
  anticipated_misconceptions:
    - Капли на холодной крышке ошибочно считают водой, прошедшей сквозь крышку.
    - Плавление ошибочно объясняют исчезновением льда, а не переходом в жидкое состояние.
language_load:
  new_terms_et:
    - term_et: sulamine
      equivalent_ru: плавление
      simple_definition_et: Sulamisel muutub tahke aine vedelaks.
      provenance:
        category: author_created_bridge
        source_reference: water-states-et and water-changes-koolibri
        notes: Short phase-change definition grounded in canonical ordinary-textbook records.
      first_use_stage: bridge-process-terms-et
      reuse_stage_refs: [observe-changes, separate-conclusions, homework-launch]
    - term_et: veeldumine
      equivalent_ru: конденсация
      simple_definition_et: Veeldumisel muutub veeaur veeks.
      provenance:
        category: author_created_bridge
        source_reference: water-states-et and water-changes-koolibri
        notes: Short A1-A2 definition grounded in canonical condensation evidence.
      first_use_stage: bridge-process-terms-et
      reuse_stage_refs: [observe-changes, separate-conclusions]
    - term_et: temperatuur
      equivalent_ru: температура
      simple_definition_et: Temperatuur näitab, kui soe või külm miski on.
      provenance:
        category: author_created_bridge
        source_reference: water-changes-koolibri
        notes: Measurement-language bridge based on the canonical practical record.
      first_use_stage: bridge-process-terms-et
      reuse_stage_refs: [observe-changes, separate-conclusions]
    - term_et: termomeeter
      equivalent_ru: термометр
      simple_definition_et: Termomeeter mõõdab temperatuuri.
      provenance:
        category: author_created_bridge
        source_reference: water-changes-koolibri
        notes: Measurement term grounded in the canonical melting-temperature activity.
      first_use_stage: bridge-process-terms-et
      reuse_stage_refs: [observe-changes, homework-launch]
  recycled_terms_et:
    - term_et: tahke
      equivalent_ru: твёрдый
      source_lesson_id: grade-5-water-02-states
      reuse_stage_refs: [activate-state-model, explain-changes-ru, observe-changes]
    - term_et: vedel
      equivalent_ru: жидкий
      source_lesson_id: grade-5-water-02-states
      reuse_stage_refs: [activate-state-model, observe-changes, separate-conclusions]
    - term_et: veeaur
      equivalent_ru: водяной пар
      source_lesson_id: grade-5-water-02-states
      reuse_stage_refs: [explain-changes-ru, bridge-process-terms-et, observe-changes]
  new_instruction_verbs_et:
    - verb_et: mõõda
      equivalent_ru: измерь
      provenance:
        category: author_created_bridge
        source_reference: water-changes-koolibri
        notes: Canonical practical-language verb introduced through teacher modelling.
      first_use_stage: bridge-process-terms-et
      reuse_stage_refs: [observe-changes, homework-launch]
    - verb_et: kirjuta
      equivalent_ru: запиши
      provenance:
        category: author_created_bridge
        source_reference: lesson 03 practical table instruction
        notes: Familiar classroom action reinforced as explicit subject-task language.
      first_use_stage: bridge-process-terms-et
      reuse_stage_refs: [observe-changes, separate-conclusions, homework-launch]
  recycled_instruction_verbs_et:
    - verb_et: vaata
      equivalent_ru: посмотри
      source_lesson_id: grade-5-water-02-states
      reuse_stage_refs: [activate-state-model, observe-changes]
    - verb_et: võrdle
      equivalent_ru: сравни
      source_lesson_id: grade-5-water-01-properties
      reuse_stage_refs: [observe-changes, separate-conclusions]
  model_sentences:
    - text_et: Jää sulab ja muutub vedelaks veeks.
      translation_ru: Лёд плавится и превращается в жидкую воду.
      terms_et: [sulamine, tahke, vedel]
      provenance:
        category: author_created_bridge
        source_reference: water-states-et and water-changes-koolibri
        notes: Short observation model based on canonical phase-change evidence.
    - text_et: Külmal pinnal veeaur veeldub.
      translation_ru: На холодной поверхности водяной пар конденсируется.
      terms_et: [veeaur, veeldumine]
      provenance:
        category: author_created_bridge
        source_reference: water-changes-koolibri
        notes: Short conclusion model grounded in canonical condensation evidence.
  sentence_frames:
    - frame_id: frame-phase-change
      frame_et: ___ muutub ___, sest temperatuur ___.
      purpose_ru: Рамка связывает начальное состояние, результат и изменение температуры.
      stage_refs: [observe-changes, separate-conclusions]
      provenance:
        category: author_created_bridge
        source_reference: lesson 03 causal language bridge
        notes: Teacher-created sentence frame limits output while preserving causal meaning.
  expected_receptive_language_et:
    - Mõõda temperatuur.
    - Kirjuta tulemus tabelisse.
    - Võrdle vaatlust ja järeldust.
  expected_supported_productive_language_et:
    - Jää sulab ja muutub vedelaks veeks.
    - Veeaur veeldub külmal pinnal.
  expected_independent_productive_language_et:
    - Jää sulab.
    - Veeaur veeldub.
  full_expected_answer_ru: >-
    Лёд получает тепло и плавится, переходя из твёрдого состояния в жидкое. Водяной пар у
    холодной поверхности отдаёт тепло и превращается в капли жидкой воды; это конденсация.
  short_expected_oral_answer_et: Jää sulab; külmal pinnal veeaur veeldub.
  oral_output_terms_et: [sulamine, veeldumine, tahke, vedel, veeaur]
cognitive_load:
  new_subject_concepts: 2
  new_estonian_terms: 4
  new_instruction_verbs: 2
  new_sentence_structures: 1
  independent_output_sentences: 2
