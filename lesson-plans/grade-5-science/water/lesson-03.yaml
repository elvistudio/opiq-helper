stages:
  - stage_id: activate-state-model
    duration_minutes: 5
    stage_type: activation
    content_purpose_ru: Восстановить три состояния и предсказать направление двух изменений.
    language_purpose_et: Повторить tahke, vedel и veeaur по знакомой схеме.
    teacher_action_ru: Показывает лёд, воду и схему, просит предсказать изменения по-русски.
    pupil_action_ru: Формулируют гипотезы по-русски и называют знакомые подписи по-эстонски.
    teacher_language: [ru, et]
    expected_pupil_language:
      ru: [Лёд может превратиться в воду]
      et: [tahke, vedel, veeaur]
    material_refs: [phase-change-diagram]
    provenance_refs: [phase-change-diagram]
    scaffold_refs: [russian-causal-model]
    new_language_items: []
    formative_check:
      prompt_ru: Какое состояние начальное и какое конечное?
      subject_evidence: Правильно указывает направление двух изменений.
      language_evidence: Узнаёт три повторяемых термина.
    expected_evidence_of_learning: Предыдущая модель состояний готова для причинного объяснения.
    transition: Объясняем причину и результат на русском языке.
  - stage_id: explain-changes-ru
    duration_minutes: 8
    stage_type: russian_concept_explanation
    content_purpose_ru: Объяснить плавление и конденсацию через передачу тепла и изменение состояния.
    language_purpose_et: Создать понятия до введения sulamine и veeldumine.
    teacher_action_ru: Строит две причинные цепочки и различает наблюдение, объяснение и вывод.
    pupil_action_ru: Пересказывают цепочки по-русски и отмечают, что нужно наблюдать и измерять.
    teacher_language: [ru]
    expected_pupil_language:
      ru: [Лёд получает тепло и плавится, Пар охлаждается и образует капли]
      et: []
    material_refs: [water-states-ru, phase-change-diagram]
    provenance_refs: [water-states-ru, phase-change-diagram]
    scaffold_refs: [russian-causal-model]
    new_language_items: []
    formative_check:
      prompt_ru: Откуда берутся капли на холодной поверхности?
      subject_evidence: Объясняет образование капель из водяного пара.
      language_evidence: Новые эстонские слова пока не оцениваются.
    expected_evidence_of_learning: Два процесса объяснены до начала языкового и практического задания.
    transition: Прикрепляем короткие эстонские термины к причинным цепочкам.
  - stage_id: bridge-process-terms-et
    duration_minutes: 7
    stage_type: estonian_language_bridge
    content_purpose_ru: Сохранить направление и причину каждого процесса при добавлении терминов.
    language_purpose_et: Ввести sulamine, veeldumine, temperatuur, termomeeter, mõõda и kirjuta.
    teacher_action_ru: Моделирует термины на схеме и физически показывает действия mõõda и kirjuta.
    pupil_action_ru: Соотносят карточки, повторяют два предложения и выполняют пробную инструкцию.
    teacher_language: [ru, et]
    expected_pupil_language:
      ru: [Это плавление, Это конденсация]
