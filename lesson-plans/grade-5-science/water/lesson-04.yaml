questions:
  - question_id: question-opposite-processes
    question_ru: Какие изменения воды являются противоположными и что определяет направление?
    question_et: Mis juhtub veega soojenemisel või jahtumisel?
    full_expected_answer_ru: Плавление противоположно замерзанию, а испарение — конденсации; направление зависит от получения или отдачи тепла.
    short_oral_answer_et: Soojenemisel jää sulab; jahtumisel vesi jäätub.
    acceptable_variants:
      - Vesi aurustub või veeldub.
      - Vesi muudab temperatuuri mõjul olekut.
    misconception_to_watch: Перечень терминов без объяснения направления не доказывает предметное понимание.
    objective_refs: [explain-four-water-changes, report-one-water-change-et]
    provenance_refs: [water-states-ru, water-states-et, complete-phase-cycle]
