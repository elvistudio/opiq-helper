methodology:
  model: russian_primary_estonian_supported
  approaches:
    - content_language_dual_objectives
    - planned_translanguaging
    - gradual_scaffolding
    - pluriliteracies
    - multimodal_support
    - vocabulary_recycling
    - cognitive_load_control
    - separate_content_language_assessment
  content_priority: subject_comprehension_not_reduced_by_language_support
  language_path:
    - sequence: 1
      stage_id: retrieve-water-unit
      language_mode: recycle_language
      description: Термины трёх уроков восстанавливаются через изображения и полные русские объяснения.
    - sequence: 2
      stage_id: complete-change-model-ru
      language_mode: establish_concept_ru
      description: Полная система четырёх переходов строится и объясняется по-русски.
    - sequence: 3
      stage_id: add-final-terms-et
      language_mode: introduce_term_et
      description: Jäätumine и aurustumine добавляются к уже знакомым sulamine и veeldumine.
    - sequence: 4
      stage_id: revision-stations
      language_mode: supported_task_et
      description: Термины и инструкции многократно используются на четырёх коротких станциях.
    - sequence: 5
      stage_id: separate-unit-assessment
      language_mode: short_oral_answer_et
      description: Полное предметное объяснение и короткая эстонская продукция оцениваются отдельно.
  learner_estonian_level: A1-A2
  planned_support_level: moderate
  scaffold_release:
    introduction: full_support
    guided_practice: partial_support
    final_output: short_independent_output
  content_language_assessment_policy: separate_content_and_estonian_language_evidence
objectives:
  content_objectives:
    - objective_id: explain-four-water-changes
      text_ru: Ученик связывает три состояния воды четырьмя изменениями и объясняет роль нагревания или охлаждения.
      observable_output_ru: Заполняет полную схему и объясняет минимум три перехода полными русскими предложениями.
      curriculum_outcome_refs: [prok-ii-loodusopetus-18-water-properties]
    - objective_id: interpret-water-observation
      text_ru: Ученик отличает данные наблюдения от вывода на примере unit.
      observable_output_ru: Правильно классифицирует минимум четыре из пяти утверждений как данные или вывод.
      curriculum_outcome_refs: [prok-ii-loodusopetus-04-safe-investigation]
  estonian_language_objectives:
    - objective_id: report-one-water-change-et
      text_ru: Ученик следует знакомым инструкциям и самостоятельно сообщает об одном изменении воды.
      text_et: Õpilane järgib tuttavaid juhiseid ja selgitab lühidalt üht olekumuutust.
      observable_output: give_short_oral_answer
      minimum_quantity: 1
      language_functions: [sequence, explain, conclude]
  subject_success_criteria:
    - criterion_id: subject-complete-change-cycle
      descriptor: Полная схема содержит три состояния, четыре процесса и верные направления стрелок.
      acceptable_evidence: Заполненная схема и три причинных объяснения по-русски.
    - criterion_id: subject-observation-conclusion
      descriptor: Наблюдение, измерение и вывод различаются в четырёх из пяти примеров.
      acceptable_evidence: Карточка классификации с кратким русским обоснованием.
  estonian_success_criteria:
    - criterion_id: language-one-independent-change
      descriptor: Ученик понятно называет начальное состояние, процесс или результат одной короткой фразой.
      acceptable_evidence: Самостоятельный ответ с минимум двумя целевыми словами.
  prerequisites:
    - Ученик знает понятия воды как вещества, трёх состояний, плавления и конденсации.
    - Ученик узнаёт знакомые инструкции vaata, nimeta, liigita, mõõda, kirjuta и võrdle.
  anticipated_misconceptions:
    - Нагревание ошибочно связывают только с кипением, а охлаждение только с замерзанием.
    - Правильно произнесённый эстонский термин ошибочно принимают за доказательство понимания процесса.
language_load:
  new_terms_et:
    - term_et: jäätumine
      equivalent_ru: замерзание
      simple_definition_et: Jäätumisel muutub vedel vesi jääks.
      provenance:
        category: author_created_bridge
        source_reference: water-states-et
        notes: Short definition grounded in the canonical Estonian phase-change page.
      first_use_stage: add-final-terms-et
      reuse_stage_refs: [revision-stations, separate-unit-assessment]
    - term_et: aurustumine
      equivalent_ru: испарение
      simple_definition_et: Aurustumisel muutub vedelik gaasiks.
      provenance:
        category: author_created_bridge
        source_reference: water-states-et and water-changes-koolibri
        notes: Short definition grounded in canonical ordinary-programme records.
      first_use_stage: add-final-terms-et
      reuse_stage_refs: [revision-stations, separate-unit-assessment]
    - term_et: olekumuutus
      equivalent_ru: изменение состояния
      simple_definition_et: Olekumuutus on aine üleminek ühest olekust teise.
      provenance:
        category: author_created_bridge
        source_reference: water-states-ru and water-states-et
        notes: Unit-level bridge term synthesized from aligned canonical explanations.
      first_use_stage: add-final-terms-et
      reuse_stage_refs: [revision-stations, separate-unit-assessment]
  recycled_terms_et:
    - term_et: vesi
      equivalent_ru: вода
      source_lesson_id: grade-5-water-01-properties
      reuse_stage_refs: [retrieve-water-unit, complete-change-model-ru, separate-unit-assessment]
    - term_et: omadus
      equivalent_ru: свойство
      source_lesson_id: grade-5-water-01-properties
      reuse_stage_refs: [retrieve-water-unit, revision-stations]
    - term_et: tahke
      equivalent_ru: твёрдый
      source_lesson_id: grade-5-water-02-states
      reuse_stage_refs: [retrieve-water-unit, complete-change-model-ru, revision-stations]
    - term_et: vedel
      equivalent_ru: жидкий
      source_lesson_id: grade-5-water-02-states
      reuse_stage_refs: [retrieve-water-unit, complete-change-model-ru, revision-stations]
    - term_et: gaasiline
      equivalent_ru: газообразный
      source_lesson_id: grade-5-water-02-states
      reuse_stage_refs: [retrieve-water-unit, complete-change-model-ru, revision-stations]
    - term_et: sulamine
      equivalent_ru: плавление
      source_lesson_id: grade-5-water-03-melting-condensation
      reuse_stage_refs: [retrieve-water-unit, add-final-terms-et, revision-stations, separate-unit-assessment]
    - term_et: veeldumine
      equivalent_ru: конденсация
      source_lesson_id: grade-5-water-03-melting-condensation
      reuse_stage_refs: [retrieve-water-unit, add-final-terms-et, revision-stations, separate-unit-assessment]
    - term_et: temperatuur
      equivalent_ru: температура
      source_lesson_id: grade-5-water-03-melting-condensation
      reuse_stage_refs: [revision-stations, separate-unit-assessment]
  new_instruction_verbs_et:
    - verb_et: selgita
      equivalent_ru: объясни
      provenance:
        category: author_created_bridge
        source_reference: lesson 04 cumulative explanation instruction
        notes: New instruction verb follows repeated supported explanations in the prior lessons.
      first_use_stage: add-final-terms-et
      reuse_stage_refs: [revision-stations, separate-unit-assessment]
  recycled_instruction_verbs_et:
    - verb_et: liigita
      equivalent_ru: классифицируй
      source_lesson_id: grade-5-water-02-states
      reuse_stage_refs: [retrieve-water-unit, revision-stations]
    - verb_et: kirjuta
      equivalent_ru: запиши
      source_lesson_id: grade-5-water-03-melting-condensation
      reuse_stage_refs: [revision-stations, separate-unit-assessment]
    - verb_et: võrdle
      equivalent_ru: сравни
      source_lesson_id: grade-5-water-01-properties
      reuse_stage_refs: [revision-stations]
  model_sentences:
    - text_et: Soojenemisel jää sulab ja vesi aurustub.
      translation_ru: При нагревании лёд плавится, а вода испаряется.
      terms_et: [sulamine, aurustumine]
      provenance:
        category: author_created_bridge
        source_reference: water-states-et and water-changes-koolibri
        notes: Short comparison model synthesized from canonical phase-change evidence.
    - text_et: Jahtumisel veeaur veeldub ja vesi jäätub.
      translation_ru: При охлаждении водяной пар конденсируется, а вода замерзает.
      terms_et: [veeldumine, jäätumine]
      provenance:
        category: author_created_bridge
        source_reference: water-states-et and water-changes-koolibri
        notes: Short sequence model synthesized from canonical phase-change evidence.
  sentence_frames:
    - frame_id: frame-explain-change
      frame_et: ___ muutub ___, kui temperatuur ___. Seda nimetatakse ___.
      purpose_ru: Рамка поддерживает причинное объяснение одного изменения состояния.
      stage_refs: [revision-stations, separate-unit-assessment]
      provenance:
        category: author_created_bridge
        source_reference: lesson 04 cumulative phase-change bridge
        notes: Teacher-created frame recycles the causal structure from lesson 03.
  expected_receptive_language_et:
    - Liigita vee olekud.
    - Võrdle kahte olekumuutust.
    - Selgita üht olekumuutust.
  expected_supported_productive_language_et:
    - Soojenemisel jää sulab.
    - Jahtumisel veeaur veeldub.
    - Vesi jäätub või aurustub.
    - Temperatuur tõuseb või langeb.
  expected_independent_productive_language_et:
    - Jää sulab ja muutub veeks.
  full_expected_answer_ru: >-
    При получении тепла лёд плавится, а жидкая вода может испаряться. При отдаче тепла водяной
    пар конденсируется, а жидкая вода замерзает. Во всех случаях вещество воды сохраняется,
    но меняется его состояние.
  short_expected_oral_answer_et: Vesi muudab soojenemisel või jahtumisel olekut.
  oral_output_terms_et: [vesi, olekumuutus, sulamine, veeldumine, jäätumine, aurustumine]
cognitive_load:
  new_subject_concepts: 1
  new_estonian_terms: 3
  new_instruction_verbs: 1
  new_sentence_structures: 1
  independent_output_sentences: 1
  rationale: Урок добавляет только два недостающих процесса и организует знакомую лексику в одну полную схему.
scaffolds:
  - scaffold_id: complete-russian-cycle
    type: russian_explanation
    description_ru: Учитель собирает четыре процесса в одну причинную модель на русском языке.
    stage_refs: [retrieve-water-unit, complete-change-model-ru, add-final-terms-et]
    release:
      at_stage: revision-stations
      how_reduced_ru: На станциях остаются стрелки и данные, но готовые причинные объяснения убираются.
    provenance:
      category: author_created_explanation
      source_reference: water-states-ru and complete-phase-cycle
      notes: Teacher synthesis grounded in canonical Russian content and prior lesson evidence.
  - scaffold_id: cumulative-word-bank
    type: word_bank
    description_ru: Слова распределены по состояниям, нагреванию и охлаждению, чтобы снизить поиск в памяти.
    stage_refs: [add-final-terms-et, revision-stations]
    release:
      at_stage: separate-unit-assessment
      how_reduced_ru: В индивидуальном ответе остаётся только схема без слов.
    provenance:
      category: author_created_bridge
      source_reference: complete-phase-cycle
      notes: Cumulative word bank recycles rather than restarts the unit vocabulary.
  - scaffold_id: revision-pair-rehearsal
    type: pair_rehearsal
    description_ru: На устной станции ученик один раз репетирует ответ с партнёром и рамкой.
    stage_refs: [revision-stations]
    release:
      at_stage: separate-unit-assessment
      how_reduced_ru: Итоговый короткий ответ даётся индивидуально без партнёра.
    provenance:
      category: author_created_bridge
      source_reference: unit-revision-stations
      notes: Teacher-created rehearsal routine supports gradual release.
multimodal_support:
  - support_id: full-phase-cycle-diagram
    type: diagram
    stage_refs: [retrieve-water-unit, complete-change-model-ru, add-final-terms-et, separate-unit-assessment]
    material_ref: complete-phase-cycle
    provenance:
      category: author_created_bridge
      source_reference: complete-phase-cycle
      notes: Directional diagram coordinates states, heating, cooling, and four process labels.
  - support_id: revision-station-tables
    type: table
    stage_refs: [revision-stations]
    material_ref: unit-revision-stations
    provenance:
      category: author_created_worksheet
      source_reference: unit-revision-stations
      notes: Four compact task formats reduce simultaneous instructions and support retrieval.
stages:
  - stage_id: retrieve-water-unit
    duration_minutes: 6
    stage_type: activation
    content_purpose_ru: Восстановить свойства, состояния, плавление и конденсацию из трёх уроков.
    language_purpose_et: Повторно назвать минимум пять знакомых терминов без нового списка.
    teacher_action_ru: Показывает неполную схему и принимает быстрые ответы сначала по-русски.
    pupil_action_ru: Восстанавливают понятия, затем добавляют знакомые эстонские подписи в паре.
    teacher_language: [ru, et]
    expected_pupil_language:
      ru: [Вода сохраняется, но меняет состояние]
      et: [tahke, vedel, gaasiline, sulamine, veeldumine]
    material_refs: [complete-phase-cycle]
    provenance_refs: [complete-phase-cycle]
    scaffold_refs: [complete-russian-cycle]
    new_language_items: []
    formative_check:
      prompt_ru: Какие две стрелки мы уже наблюдали на прошлом уроке?
      subject_evidence: Правильно называет плавление и конденсацию и их направления.
      language_evidence: Повторно использует минимум три знакомых эстонских термина.
    expected_evidence_of_learning: Знакомая лексика активирована до добавления двух процессов.
    transition: Достраиваем полную предметную модель на русском языке.
  - stage_id: complete-change-model-ru
    duration_minutes: 9
    stage_type: russian_concept_explanation
    content_purpose_ru: Связать нагревание и охлаждение со всеми четырьмя изменениями воды.
    language_purpose_et: Подготовить понятия замерзания и испарения до новых обозначений.
    teacher_action_ru: Достраивает схему, сравнивает противоположные процессы и проверяет сохранение вещества.
    pupil_action_ru: Объясняют три перехода полными русскими предложениями и исправляют направления стрелок.
    teacher_language: [ru]
    expected_pupil_language:
      ru: [При нагревании вода может испаряться, При охлаждении вода замерзает]
      et: []
    material_refs: [water-states-ru, complete-phase-cycle]
    provenance_refs: [water-states-ru, complete-phase-cycle]
    scaffold_refs: [complete-russian-cycle]
    new_language_items: []
    formative_check:
      prompt_ru: Какие процессы противоположны друг другу и почему?
      subject_evidence: Называет две пары и объясняет направление передачи тепла.
      language_evidence: Новые эстонские слова ещё не оцениваются.
    expected_evidence_of_learning: Полная модель сформирована по-русски до языкового моста.
    transition: Добавляем два последних термина и инструкцию selgita.
  - stage_id: add-final-terms-et
    duration_minutes: 7
    stage_type: estonian_language_bridge
    content_purpose_ru: Сохранить правильные направления процессов при добавлении названий.
    language_purpose_et: Ввести jäätumine, aurustumine, olekumuutus и selgita.
    teacher_action_ru: Добавляет слова на готовую схему, моделирует две короткие фразы и действие selgita.
    pupil_action_ru: Соотносят слова, повторяют модели и объясняют выбор стрелки по-русски.
    teacher_language: [ru, et]
    expected_pupil_language:
      ru: [Это замерзание, потому что вода становится льдом]
      et: [jäätumine, aurustumine, olekumuutus, selgita]
    material_refs: [water-states-et, complete-phase-cycle]
    provenance_refs: [water-states-et, complete-phase-cycle]
    scaffold_refs: [complete-russian-cycle, cumulative-word-bank]
    new_language_items: [jäätumine, aurustumine, olekumuutus, selgita]
    formative_check:
      prompt_ru: Поставь два термина на правильные стрелки.
