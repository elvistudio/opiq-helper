differentiation_policy:
  subject_objective_preserved: true
  language_support_options:
    - Дополнительное русское объяснение без сокращения предметного понятия.
    - Накопительный двуязычный глоссарий, визуальная схема и банк слов.
    - Одна короткая эстонская фраза вместо двух при полном русском ответе.
    - Дополнительная эстонская причинная фраза как усложнение, а не обязательный минимум.
  simplified_curriculum_default: forbidden_without_learner_specific_authorisation
  notes: >-
    Языковая поддержка меняет объём эстонской продукции, но не снижает содержание; simplified
    curriculum возможен только как явно авторизованное решение для конкретного ученика.
known_gaps:
  - Официальные outcomes относятся к концу school stage II, а не исключительно к grade 5.
  - Unit покрывает только водную часть более широкого outcome о воде, воздухе и почве.
  - Этот тематический план не является полным годовым курсом и не устанавливает annual completeness.
