unit_content_success_criteria:
  - Называет свойства воды и подтверждает минимум одно свойство наблюдением.
  - Различает три состояния и правильно направляет минимум три из четырёх переходов.
  - Безопасно записывает данные и отделяет наблюдение от причинного вывода.
unit_estonian_language_targets:
  - target_id: unit-recognise-core-terms
    observable_output: Узнать и правильно соотнести минимум десять накопительных терминов unit.
    minimum_quantity: 10
    language_functions: [name, classify]
  - target_id: unit-follow-four-instructions
    observable_output: Выполнить минимум четыре знакомые инструкции в предметных задачах.
    minimum_quantity: 4
    language_functions: [sequence, report]
  - target_id: unit-give-short-causal-answer
    observable_output: Дать один или два коротких устных ответа об изменении состояния воды.
    minimum_quantity: 1
    language_functions: [explain, conclude]
recommended_lesson_sequence:
  - order: 1
    lesson_id: grade-5-water-01-properties
    duration_minutes: 45
    focus_ru: Вода как вещество, наблюдаемые свойства и различие наблюдения и вывода.
  - order: 2
    lesson_id: grade-5-water-02-states
    duration_minutes: 45
    focus_ru: Твёрдое, жидкое и газообразное состояния и их классификация.
  - order: 3
    lesson_id: grade-5-water-03-melting-condensation
    duration_minutes: 45
    focus_ru: Безопасное наблюдение плавления и конденсации с измерениями и выводом.
  - order: 4
    lesson_id: grade-5-water-04-changes-review
    duration_minutes: 45
    focus_ru: Полная система изменений, накопительное повторение и раздельная оценка.
