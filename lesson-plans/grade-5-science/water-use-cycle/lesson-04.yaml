stages:
  - stage_id: water-use-04-activate
    duration_minutes: 5
    stage_type: activation
    content_purpose_ru: Активировать необходимые знания и отделить научное наблюдение от бытового предположения.
    language_purpose_et: Узнать знакомые эстонские термины и инструкции без нового сложного объяснения.
    teacher_action_ru: "Показывает опорную схему и задаёт по-русски вопрос: «Что изменилось после фильтрации и почему прозрачную модельную воду нельзя пить?»; принимает предварительные версии без оценки."
    pupil_action_ru: Вспоминают связанные понятия по-русски, отмечают знакомые эстонские подписи и формулируют первоначальную гипотезу.
    teacher_language:
      - ru
      - et
    expected_pupil_language:
      ru:
        - Формулирует исходное научное предположение полным предложением.
      et:
        - lahus
        - puhastamine
        - reostus
    material_refs:
      - filter-safety-card
    provenance_refs:
      - filter-safety-card
    scaffold_refs:
      - water-use-04-russian-explanation
    new_language_items: []
    formative_check:
      prompt_ru: Что мы уже знаем и что ещё нужно доказать или уточнить?
      subject_evidence: Отделяет знакомый факт от предположения и называет связанное понятие.
      language_evidence: Узнаёт хотя бы одну знакомую эстонскую подпись.
    expected_evidence_of_learning: Учитель видит исходные представления и выбирает необходимую глубину русского объяснения.
    transition: Переходим к точному научному объяснению на русском языке.
  - stage_id: water-use-04-explain-ru
    duration_minutes: 8
    stage_type: russian_concept_explanation
    content_purpose_ru: Безопасно сравнивает модельную воду до и после фильтрации и объясняет ограничения модели.
    language_purpose_et: Сначала установить научный смысл по-русски, чтобы новые или повторяемые эстонские слова обозначали уже понятные идеи.
    teacher_action_ru: "Строит связное объяснение по выбранным каноническим источникам. Целевой вывод: Бумажный фильтр может задержать часть видимых частиц, поэтому внешний вид модельной воды изменится. Растворённые вещества и микроорганизмы могут остаться. Классная модель не воспроизводит водоочистную станцию и не подтверждает пригодность воды для питья; модельную воду никогда не пробуют."
    pupil_action_ru: Работают со схемой, задают уточняющие вопросы и формулируют полный предметный ответ по-русски.
    teacher_language:
      - ru
    expected_pupil_language:
      ru:
        - Бумажный фильтр может задержать часть видимых частиц, поэтому внешний вид модельной воды изменится. Растворённые вещества и микроорганизмы могут остаться. Классная модель не воспроизводит водоочистную станцию и не подтверждает пригодность воды для питья; модельную воду никогда не пробуют.
      et: []
    material_refs:
      - water-treatment-et-koolibri
      - filter-safety-card
    provenance_refs:
      - water-treatment-et-koolibri
      - filter-safety-card
    scaffold_refs:
      - water-use-04-russian-explanation
    new_language_items: []
    formative_check:
      prompt_ru: Что изменилось после фильтрации и почему прозрачную модельную воду нельзя пить?
      subject_evidence: Фильтр задержал часть видимых частиц, но невидимые растворённые вещества или микроорганизмы могут остаться; модель не доказывает безопасность.
      language_evidence: Эстонская продукция на этапе формирования сложного понятия не оценивается.
    expected_evidence_of_learning: Ученик даёт научно корректный русский ответ до перехода к эстонской предметной поддержке.
    transition: Связываем понятую модель с короткими эстонскими обозначениями.
  - stage_id: water-use-04-language-bridge
    duration_minutes: 5
    stage_type: estonian_language_bridge
    content_purpose_ru: Сохранить точность научного понятия при переходе к терминам, подписям и короткой модели ответа.
    language_purpose_et: Повторить знакомые термины и модель предложения без введения новой лексики.
    teacher_action_ru: Показывает соответствия RU–ET, моделирует «Filtreeritud vesi ei ole automaatselt joogivesi.» и короткую инструкцию перед заданием.
    pupil_action_ru: Соотносят подписи со знакомой схемой, повторяют модель и репетируют ответ в паре.
    teacher_language:
      - ru
      - et
    expected_pupil_language:
      ru:
        - Отфильтрованная вода не становится автоматически питьевой.
      et:
        - Filtreeritud vesi ei ole automaatselt joogivesi.
    material_refs:
      - water-treatment-et-koolibri
      - filter-safety-card
    provenance_refs:
      - water-treatment-et-koolibri
      - filter-safety-card
    scaffold_refs:
      - water-use-04-russian-explanation
      - water-use-04-bilingual-frame
    new_language_items: []
    formative_check:
