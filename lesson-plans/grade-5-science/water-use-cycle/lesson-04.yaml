methodology:
  model: russian_primary_estonian_supported
  approaches:
    - content_language_dual_objectives
    - planned_translanguaging
    - gradual_scaffolding
    - pluriliteracies
    - multimodal_support
    - vocabulary_recycling
    - cognitive_load_control
    - separate_content_language_assessment
  content_priority: subject_comprehension_not_reduced_by_language_support
  language_path:
    - sequence: 1
      stage_id: water-use-04-activate
      language_mode: activate_prior_knowledge
      description: Активируем знакомые научные представления по-русски и узнаём ранее введённые эстонские обозначения.
    - sequence: 2
      stage_id: water-use-04-explain-ru
      language_mode: establish_concept_ru
      description: Формируем сложное научное различие и причинные связи на русском языке.
    - sequence: 3
      stage_id: water-use-04-language-bridge
      language_mode: model_sentence_et
      description: Связываем понятую модель с короткими эстонскими терминами, инструкцией и предложением.
    - sequence: 4
      stage_id: water-use-04-practical-observation
      language_mode: supported_task_et
      description: Выполняем содержательное задание с короткой эстонской поддержкой и полным русским рассуждением.
    - sequence: 5
      stage_id: water-use-04-independent-output
      language_mode: full_subject_answer_ru
      description: Фиксируем полный русский предметный результат отдельно от короткого эстонского ответа.
  learner_estonian_level: A1-A2
  planned_support_level: high
  scaffold_release:
    introduction: full_support
    guided_practice: partial_support
    final_output: short_independent_output
  content_language_assessment_policy: separate_content_and_estonian_language_evidence
objectives:
  content_objectives:
    - objective_id: water-use-04-content-objective
      text_ru: Безопасно сравнивает модельную воду до и после фильтрации и объясняет ограничения модели.
      observable_output_ru: "Записывает наблюдения и делает русский вывод: видимые частицы могут уменьшиться, но прозрачность не доказывает питьевую безопасность."
      curriculum_outcome_refs:
        - prok-ii-loodusopetus-04-safe-investigation
        - prok-ii-loodusopetus-08-water-purification
  estonian_language_objectives:
    - objective_id: water-use-04-language-objective
      text_ru: Выполняет знакомые инструкции сравнения и даёт короткий поддержанный вывод по-эстонски.
      text_et: Õpilane järgib tuttavaid juhiseid ja ütleb ühe lühikese järelduse.
      observable_output: give_short_oral_answer
      minimum_quantity: 1
      language_functions:
        - compare
        - conclude
  subject_success_criteria:
    - criterion_id: water-use-04-subject-success
      descriptor: "Записывает наблюдения и делает русский вывод: видимые частицы могут уменьшиться, но прозрачность не доказывает питьевую безопасность."
      acceptable_evidence: Фильтр задержал часть видимых частиц, но невидимые растворённые вещества или микроорганизмы могут остаться; модель не доказывает безопасность.
  estonian_success_criteria:
    - criterion_id: water-use-04-language-success
      descriptor: Выполняет знакомые инструкции сравнения и даёт короткий поддержанный вывод по-эстонски.
      acceptable_evidence: Filtreeritud vesi ei ole joogivesi.
  prerequisites:
    - Ученик может объяснить знакомое наблюдение полным предложением по-русски.
    - Ученик помнит ключевые понятия предыдущих уроков блока и может пользоваться двуязычной схемой.
  anticipated_misconceptions:
    - Прозрачная вода ошибочно считается безопасной.
    - Фильтрация считается способом удаления всех загрязнителей.
    - Классная модель считается точной копией водоочистной станции.
