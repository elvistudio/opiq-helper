practical_work:
  work_id: practical-water-filter-model
  title_ru: Безопасная модель фильтрации и её ограничения
  title_et: Ohutu filtreerimise mudel ja selle piirid
  safety_requirements:
    - Использовать только подготовленные учителем воду и чистую почву; неизвестные загрязнители запрещены.
    - Модельную воду нельзя пить или пробовать ни до, ни после фильтрации.
    - Разлитую воду вытереть сразу; после работы вымыть руки.
    - Учитель контролирует выдачу материалов, сбор сосудов и утилизацию смеси.
    - Прозрачный вид после фильтрации не доказывает питьевую безопасность.
  teacher_controlled_steps:
    - Учитель заранее готовит модельную воду из воды и чистой почвы, устанавливает воронки над устойчивыми прозрачными сосудами и держит поднос под установкой.
    - Учитель выдаёт безопасные школьные материалы, контролирует переливание, разливы, сбор и утилизацию.
    - "Учитель до и после опыта явно проговаривает: бумажный фильтр не удаляет все растворённые вещества и микроорганизмы и не создаёт питьевую воду."
  pupil_steps:
    - Не пробуя воду, описать внешний вид учительского образца до фильтрации.
    - Под контролем учителя медленно пропустить смесь через бумажный фильтр.
    - Сравнить внешний вид до и после, записать только наблюдаемое изменение.
    - Сделать вывод о видимых частицах и отдельно назвать то, чего модель не доказывает.
    - Передать установку учителю и вымыть руки.
  materials:
    - Вода и чистая почва, подготовленные учителем.
    - Прозрачные сосуды, устойчивая воронка, бумажный фильтр и поднос.
    - Печатные safety card, observation table и model-limit card.
  observation_table:
    columns:
      - До фильтрации
      - После фильтрации
      - Наблюдение
      - Ограничение модели
      - Märksõna eesti keeles
    data_collection_ru: Ученики отдельно фиксируют видимые изменения и то, что невозможно установить по внешнему виду.
  expected_observation_ru: После бумажного фильтра количество видимых частиц может уменьшиться и вода может выглядеть прозрачнее.
  expected_conclusion_ru: Фильтр задерживает лишь часть видимых частиц; растворённые вещества и микроорганизмы могут остаться, поэтому модельная вода не является питьевой.
  russian_report_target: Дать наблюдение, объяснить одно ограничение модели и прямо сказать, что модельную воду нельзя пить.
  short_estonian_conclusion: Filtreeritud vesi ei ole joogivesi.
  opiq_source_record_ids:
    - water-treatment-et-koolibri
    - drinking-water-et-koolibri
    - water-pollution-et-avita-2024
  provenance_refs:
    - water-treatment-et-koolibri
    - drinking-water-et-koolibri
    - water-pollution-et-avita-2024
    - filter-safety-card
    - filter-observation-table
    - filter-comparison-sheet
    - filter-limit-card
    - filter-exit-ticket
assessment:
  - criterion_id: water-use-04-assess-subject
    domain: subject_understanding
    what_is_checked: Безопасно сравнивает модельную воду до и после фильтрации и объясняет ограничения модели.
    acceptable_evidence: "Полный русский ответ: Фильтр задержал часть видимых частиц, но невидимые растворённые вещества или микроорганизмы могут остаться; модель не доказывает безопасность."
    success_threshold: Научно корректный ответ содержит центральное различие и хотя бы одно обоснование.
    affects: subject_assessment
  - criterion_id: water-use-04-assess-practical
    domain: practical_skill
    what_is_checked: Безопасное сравнение, точная запись наблюдения и признание пределов фильтрационной модели.
    acceptable_evidence: Соблюдает запрет пробования, записывает до/после и не называет модельную воду питьевой.
    success_threshold: Все правила безопасности выполнены, наблюдение и вывод разделены.
    affects: subject_assessment
  - criterion_id: water-use-04-assess-et-recognition
    domain: estonian_terminology_recognition
    what_is_checked: Узнавание целевых эстонских терминов в схеме, карточках или инструкции.
    acceptable_evidence: Корректно соотносит минимум два целевых слова с понятиями или изображениями.
    success_threshold: Не менее двух корректных соответствий.
    affects: language_assessment
  - criterion_id: water-use-04-assess-et-supported
    domain: supported_estonian_production
    what_is_checked: Заполнение короткой эстонской рамки с сохранением научного смысла.
    acceptable_evidence: Фраза по рамке «Pärast filtreerimist on vesi __, kuid __.» с допустимой грамматической неточностью.
    success_threshold: Одна понятная поддержанная фраза.
    affects: language_assessment
  - criterion_id: water-use-04-assess-et-independent
    domain: independent_estonian_production
    what_is_checked: Короткий самостоятельный эстонский ответ после снятия полной рамки.
    acceptable_evidence: Filtreeritud vesi ei ole joogivesi. или научно эквивалентный короткий вариант.
    success_threshold: Одна понятная короткая фраза.
    affects: language_assessment
