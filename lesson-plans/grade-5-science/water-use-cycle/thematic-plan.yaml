prerequisite_map:
  - prerequisite_id: water-properties-and-state-changes
    description_ru: Ученик понимает свойства воды, раствор, состояния воды, испарение, конденсацию и замерзание из предыдущего четырёхурочного блока.
    needed_by_lesson_ids:
      - grade-5-water-use-01-groundwater
      - grade-5-water-use-02-protection
      - grade-5-water-use-03-cycle
      - grade-5-water-use-04-filter-model
      - grade-5-water-use-05-subject-assessment
      - grade-5-water-use-06-language-assessment
    support_if_missing_ru: Использовать схему предыдущего блока и коротко восстановить смысл терминов по-русски до новых системных связей.
  - prerequisite_id: observation-versus-conclusion
    description_ru: Ученик различает непосредственно наблюдаемое изменение и научный вывод из наблюдения.
    needed_by_lesson_ids:
      - grade-5-water-use-04-filter-model
      - grade-5-water-use-05-subject-assessment
    support_if_missing_ru: Учитель моделирует пару «видимых частиц стало меньше — безопасность питья не доказана».
unit_learning_outcomes:
  - outcome_id: unit-groundwater-and-protection
    text_ru: Объясняет образование и использование подземных вод и обосновывает необходимость защиты источников.
    text_et: Õpilane nimetab põhjavee ja joogivee ning ütleb ühe kaitselause.
    provenance:
      category: author_created_bridge
      source_reference: groundwater-ru-avita and groundwater-et-avita-2024
      notes: Bilingual outcome synthesized from selected canonical ordinary sources.
  - outcome_id: unit-water-use-and-cycle-system
    text_ru: Связывает использование, загрязнение, очистку, защиту и природный круговорот воды в одну причинную систему.
    text_et: Õpilane järjestab veeringe ja kasutab lühidalt põhitermineid.
    provenance:
      category: author_created_bridge
      source_reference: selected eight-record multi-source synthesis
      notes: Russian system explanation and short Estonian subject-language layer are kept distinct.
  - outcome_id: unit-safe-filter-model
    text_ru: Безопасно проводит модель фильтрации и объясняет, почему прозрачность не доказывает пригодность воды для питья.
    text_et: Õpilane võrdleb vett ja ütleb, et filtreeritud mudelivesi ei ole joogivesi.
    provenance:
      category: author_created_explanation
      source_reference: practical-water-filter-model and canonical treatment sources
      notes: Bounded safety explanation addresses a dangerous misconception without claiming textbook authorship.
unit_content_success_criteria:
  - Объясняет образование подземных вод и отличает их от открытых поверхностных вод.
  - Различает использование, загрязнение, очистку, защиту и экономию воды на конкретных примерах.
  - Строит связную модель круговорота с испарением, конденсацией, осадками, стоком и просачиванием.
  - По результатам фильтрационной модели отделяет наблюдаемое изменение от недоказанной питьевой безопасности.
unit_estonian_language_targets:
  - target_id: unit-recognise-eight-terms
    observable_output: Распознать восемь новых терминов блока и основные повторяемые термины воды.
    minimum_quantity: 8
    language_functions:
      - name
      - classify
  - target_id: unit-sequence-cycle-et
    observable_output: Упорядочить и подписать основные этапы круговорота с короткой поддержкой.
    minimum_quantity: 4
    language_functions:
      - sequence
      - describe
  - target_id: unit-give-short-protection-answer
    observable_output: Завершить причинную рамку и дать один короткий ответ о защите воды.
    minimum_quantity: 1
    language_functions:
      - explain
      - conclude
recommended_lesson_sequence:
  - order: 1
    lesson_id: grade-5-water-use-01-groundwater
    duration_minutes: 45
    focus_ru: Объясняет по-русски образование подземных вод, отличие от поверхностной воды и необходимость защиты источника.
  - order: 2
    lesson_id: grade-5-water-use-02-protection
    duration_minutes: 45
    focus_ru: Классифицирует способы использования воды, источники загрязнения, очистку и меры защиты без смешения этих понятий.
  - order: 3
    lesson_id: grade-5-water-use-03-cycle
    duration_minutes: 45
    focus_ru: Объясняет круговорот как связанную систему испарения, конденсации, осадков, стока и просачивания.
  - order: 4
    lesson_id: grade-5-water-use-04-filter-model
    duration_minutes: 45
    focus_ru: Безопасно сравнивает модельную воду до и после фильтрации и объясняет ограничения модели.
  - order: 5
    lesson_id: grade-5-water-use-05-subject-assessment
    duration_minutes: 45
    focus_ru: Систематизирует весь блок и применяет научные понятия к схеме круговорота, фильтрационной модели и решению по защите воды.
  - order: 6
    lesson_id: grade-5-water-use-06-language-assessment
    duration_minutes: 45
    focus_ru: Сохраняет научный смысл знакомых понятий при работе с короткими эстонскими подписями и последовательностями.
lesson_ids:
  - grade-5-water-use-01-groundwater
