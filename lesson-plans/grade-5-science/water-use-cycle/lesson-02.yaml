stages:
  - stage_id: water-use-02-activate
    duration_minutes: 5
    stage_type: activation
    content_purpose_ru: Активировать необходимые знания и отделить научное наблюдение от бытового предположения.
    language_purpose_et: Узнать знакомые эстонские термины и инструкции без нового сложного объяснения.
    teacher_action_ru: "Показывает опорную схему и задаёт по-русски вопрос: «Почему загрязнённая вода может быть опасной, даже если выглядит прозрачной?»; принимает предварительные версии без оценки."
    pupil_action_ru: Вспоминают связанные понятия по-русски, отмечают знакомые эстонские подписи и формулируют первоначальную гипотезу.
    teacher_language:
      - ru
      - et
    expected_pupil_language:
      ru:
        - Формулирует исходное научное предположение полным предложением.
      et:
        - vesi
        - põhjavesi
        - joogivesi
    material_refs:
      - water-protection-sheet
    provenance_refs:
      - water-protection-sheet
    scaffold_refs:
      - water-use-02-russian-explanation
    new_language_items: []
    formative_check:
      prompt_ru: Что мы уже знаем и что ещё нужно доказать или уточнить?
      subject_evidence: Отделяет знакомый факт от предположения и называет связанное понятие.
      language_evidence: Узнаёт хотя бы одну знакомую эстонскую подпись.
    expected_evidence_of_learning: Учитель видит исходные представления и выбирает необходимую глубину русского объяснения.
    transition: Переходим к точному научному объяснению на русском языке.
  - stage_id: water-use-02-explain-ru
    duration_minutes: 12
    stage_type: russian_concept_explanation
    content_purpose_ru: Классифицирует способы использования воды, источники загрязнения, очистку и меры защиты без смешения этих понятий.
    language_purpose_et: Сначала установить научный смысл по-русски, чтобы новые или повторяемые эстонские слова обозначали уже понятные идеи.
    teacher_action_ru: "Строит связное объяснение по выбранным каноническим источникам. Целевой вывод: Люди используют воду дома, в сельском хозяйстве и промышленности. После использования часть воды становится сточной. Загрязнение может быть видимым или невидимым. Очистка уменьшает загрязнение, а защита предотвращает его; экономить воду означает избегать лишних потерь, но не отказываться от необходимой гигиены."
    pupil_action_ru: Работают со схемой, задают уточняющие вопросы и формулируют полный предметный ответ по-русски.
    teacher_language:
      - ru
    expected_pupil_language:
      ru:
        - Люди используют воду дома, в сельском хозяйстве и промышленности. После использования часть воды становится сточной. Загрязнение может быть видимым или невидимым. Очистка уменьшает загрязнение, а защита предотвращает его; экономить воду означает избегать лишних потерь, но не отказываться от необходимой гигиены.
      et: []
    material_refs:
      - water-use-ru-avita
      - water-protection-sheet
    provenance_refs:
      - water-use-ru-avita
      - water-protection-sheet
    scaffold_refs:
      - water-use-02-russian-explanation
    new_language_items: []
    formative_check:
      prompt_ru: Почему загрязнённая вода может быть опасной, даже если выглядит прозрачной?
      subject_evidence: В воде могут находиться растворённые вещества или микроорганизмы, которых не видно, поэтому внешний вид не доказывает безопасность.
      language_evidence: Эстонская продукция на этапе формирования сложного понятия не оценивается.
    expected_evidence_of_learning: Ученик даёт научно корректный русский ответ до перехода к эстонской предметной поддержке.
    transition: Связываем понятую модель с короткими эстонскими обозначениями.
  - stage_id: water-use-02-language-bridge
    duration_minutes: 8
    stage_type: estonian_language_bridge
    content_purpose_ru: Сохранить точность научного понятия при переходе к терминам, подписям и короткой модели ответа.
    language_purpose_et: "Ввести и отрепетировать: reostus, puhastamine, veekaitse, põhjenda."
