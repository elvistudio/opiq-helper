objectives:
  content_objectives:
    - objective_id: water-use-02-content-objective
      text_ru: Классифицирует способы использования воды, источники загрязнения, очистку и меры защиты без смешения этих понятий.
      observable_output_ru: Обосновывает по-русски одно решение по защите или экономии воды и объясняет отличие использования, загрязнения, очистки и защиты.
      curriculum_outcome_refs:
        - prok-ii-loodusopetus-19-groundwater
        - prok-ii-loodusopetus-35-human-impact-communities
  estonian_language_objectives:
    - objective_id: water-use-02-language-objective
      text_ru: Узнаёт три новых термина и завершает одну причинную рамку по-эстонски.
      text_et: Õpilane tunneb kolme terminit ja lõpetab lause vee kaitsmise kohta.
      observable_output: complete_sentence_frame
      minimum_quantity: 1
      language_functions:
        - classify
        - explain
  subject_success_criteria:
    - criterion_id: water-use-02-subject-success
      descriptor: Обосновывает по-русски одно решение по защите или экономии воды и объясняет отличие использования, загрязнения, очистки и защиты.
      acceptable_evidence: В воде могут находиться растворённые вещества или микроорганизмы, которых не видно, поэтому внешний вид не доказывает безопасность.
  estonian_success_criteria:
    - criterion_id: water-use-02-language-success
      descriptor: Узнаёт три новых термина и завершает одну причинную рамку по-эстонски.
      acceptable_evidence: Vett tuleb kaitsta, sest puhas vesi on vajalik.
  prerequisites:
    - Ученик может объяснить знакомое наблюдение полным предложением по-русски.
    - Ученик помнит ключевые понятия предыдущих уроков блока и может пользоваться двуязычной схемой.
  anticipated_misconceptions:
    - Все загрязнения ошибочно считаются видимыми.
    - Экономия воды ошибочно понимается как отказ от необходимой гигиены.
    - Очистка и предотвращение загрязнения считаются одним действием.
