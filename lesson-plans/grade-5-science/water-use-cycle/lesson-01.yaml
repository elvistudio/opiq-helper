objectives:
  content_objectives:
    - objective_id: water-use-01-content-objective
      text_ru: Объясняет по-русски образование подземных вод, отличие от поверхностной воды и необходимость защиты источника.
      observable_output_ru: Строит схему просачивания и даёт полный русский ответ с источником питьевой воды и мерой защиты.
      curriculum_outcome_refs:
        - prok-ii-loodusopetus-19-groundwater
  estonian_language_objectives:
    - objective_id: water-use-01-language-objective
      text_ru: Узнаёт два новых термина и даёт одну короткую фразу о местонахождении подземной воды.
      text_et: Õpilane tunneb sõnu põhjavesi ja joogivesi ning ütleb ühe lause.
      observable_output: give_short_oral_answer
      minimum_quantity: 1
      language_functions:
        - name
        - describe
  subject_success_criteria:
    - criterion_id: water-use-01-subject-success
      descriptor: Строит схему просачивания и даёт полный русский ответ с источником питьевой воды и мерой защиты.
      acceptable_evidence: Подземная вода заполняет поры и трещины горных пород под поверхностью, а вода рек и озёр находится в открытых поверхностных водоёмах.
  estonian_success_criteria:
    - criterion_id: water-use-01-language-success
      descriptor: Узнаёт два новых термина и даёт одну короткую фразу о местонахождении подземной воды.
      acceptable_evidence: Põhjavesi on maa sees.
  prerequisites:
    - Ученик может объяснить знакомое наблюдение полным предложением по-русски.
    - Ученик различает воду как вещество и знаком с базовыми свойствами воды.
  anticipated_misconceptions:
    - Подземная вода ошибочно представляется как большое пустое озеро под землёй повсюду.
    - Прозрачная вода из колодца автоматически считается безопасной без проверки.
