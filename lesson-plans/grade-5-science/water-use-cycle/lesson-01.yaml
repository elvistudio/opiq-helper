    transition: Переходим к точному научному объяснению на русском языке.
  - stage_id: water-use-01-explain-ru
    duration_minutes: 12
    stage_type: russian_concept_explanation
    content_purpose_ru: Объясняет по-русски образование подземных вод, отличие от поверхностной воды и необходимость защиты источника.
    language_purpose_et: Сначала установить научный смысл по-русски, чтобы новые или повторяемые эстонские слова обозначали уже понятные идеи.
    teacher_action_ru: "Строит связное объяснение по выбранным каноническим источникам. Целевой вывод: Часть осадков просачивается через почву и водопроницаемые слои, заполняет поры и трещины и образует подземные воды. Вода реки или озера находится на поверхности. Подземные воды используют для питьевого водоснабжения, поэтому их нужно защищать от загрязнения."
    pupil_action_ru: Работают со схемой, задают уточняющие вопросы и формулируют полный предметный ответ по-русски.
