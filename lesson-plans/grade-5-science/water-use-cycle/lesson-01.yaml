    new_language_items: []
    formative_check:
      prompt_ru: Чем подземная вода отличается от воды в реке или озере?
      subject_evidence: Подземная вода заполняет поры и трещины горных пород под поверхностью, а вода рек и озёр находится в открытых поверхностных водоёмах.
      language_evidence: Эстонская продукция на этапе формирования сложного понятия не оценивается.
    expected_evidence_of_learning: Ученик даёт научно корректный русский ответ до перехода к эстонской предметной поддержке.
    transition: Связываем понятую модель с короткими эстонскими обозначениями.
  - stage_id: water-use-01-language-bridge
