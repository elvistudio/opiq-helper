      - ru
    expected_pupil_language:
      ru:
        - Часть осадков просачивается через почву и водопроницаемые слои, заполняет поры и трещины и образует подземные воды. Вода реки или озера находится на поверхности. Подземные воды используют для питьевого водоснабжения, поэтому их нужно защищать от загрязнения.
