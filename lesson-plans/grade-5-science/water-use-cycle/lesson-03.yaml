      stage_id: water-use-03-activate
      language_mode: activate_prior_knowledge
      description: Активируем знакомые научные представления по-русски и узнаём ранее введённые эстонские обозначения.
    - sequence: 2
      stage_id: water-use-03-explain-ru
      language_mode: establish_concept_ru
      description: Формируем сложное научное различие и причинные связи на русском языке.
    - sequence: 3
      stage_id: water-use-03-language-bridge
      language_mode: introduce_term_et
      description: Связываем понятую модель с короткими эстонскими терминами, инструкцией и предложением.
    - sequence: 4
      stage_id: water-use-03-guided-practice
      language_mode: supported_task_et
      description: Выполняем содержательное задание с короткой эстонской поддержкой и полным русским рассуждением.
    - sequence: 5
      stage_id: water-use-03-independent-output
      language_mode: full_subject_answer_ru
      description: Фиксируем полный русский предметный результат отдельно от короткого эстонского ответа.
