assessment:
  - criterion_id: water-use-03-assess-subject
    domain: subject_understanding
    what_is_checked: Объясняет круговорот как связанную систему испарения, конденсации, осадков, стока и просачивания.
    acceptable_evidence: "Полный русский ответ: Вода испаряется, водяной пар охлаждается и конденсируется в капли, из которых при подходящих условиях выпадают осадки."
    success_threshold: Научно корректный ответ содержит центральное различие и хотя бы одно обоснование.
    affects: subject_assessment
  - criterion_id: water-use-03-assess-et-recognition
    domain: estonian_terminology_recognition
    what_is_checked: Узнавание целевых эстонских терминов в схеме, карточках или инструкции.
    acceptable_evidence: Корректно соотносит минимум два целевых слова с понятиями или изображениями.
    success_threshold: Не менее двух корректных соответствий.
    affects: language_assessment
  - criterion_id: water-use-03-assess-et-supported
    domain: supported_estonian_production
    what_is_checked: Заполнение короткой эстонской рамки с сохранением научного смысла.
    acceptable_evidence: Фраза по рамке «Kõigepealt vesi __, siis __ ja lõpuks __.» с допустимой грамматической неточностью.
    success_threshold: Одна понятная поддержанная фраза.
    affects: language_assessment
  - criterion_id: water-use-03-assess-et-independent
    domain: independent_estonian_production
    what_is_checked: Короткий самостоятельный эстонский ответ после снятия полной рамки.
    acceptable_evidence: Vesi aurustub ja hiljem veeldub. или научно эквивалентный короткий вариант.
    success_threshold: Одна понятная короткая фраза.
    affects: language_assessment
