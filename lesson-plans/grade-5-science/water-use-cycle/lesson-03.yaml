    introduction: full_support
    guided_practice: partial_support
    final_output: short_independent_output
  content_language_assessment_policy: separate_content_and_estonian_language_evidence
objectives:
  content_objectives:
    - objective_id: water-use-03-content-objective
      text_ru: Объясняет круговорот как связанную систему испарения, конденсации, осадков, стока и просачивания.
      observable_output_ru: Правильно упорядочивает модель и даёт полный причинный рассказ по-русски, возвращая воду к водоёмам и подземным водам.
      curriculum_outcome_refs:
        - prok-ii-loodusopetus-01-models-and-water-cycle
        - prok-ii-loodusopetus-19-groundwater
  estonian_language_objectives:
    - objective_id: water-use-03-language-objective
      text_ru: Упорядочивает схему, подписывает три новых термина и произносит короткую последовательность по-эстонски.
      text_et: Õpilane järjestab veeringe ja ütleb ühe lühikese järjestuse.
      observable_output: label_visual
      minimum_quantity: 1
      language_functions:
        - sequence
        - explain
  subject_success_criteria:
    - criterion_id: water-use-03-subject-success
      descriptor: Правильно упорядочивает модель и даёт полный причинный рассказ по-русски, возвращая воду к водоёмам и подземным водам.
      acceptable_evidence: Вода испаряется, водяной пар охлаждается и конденсируется в капли, из которых при подходящих условиях выпадают осадки.
  estonian_success_criteria:
    - criterion_id: water-use-03-language-success
      descriptor: Упорядочивает схему, подписывает три новых термина и произносит короткую последовательность по-эстонски.
      acceptable_evidence: Vesi aurustub ja hiljem veeldub.
  prerequisites:
    - Ученик может объяснить знакомое наблюдение полным предложением по-русски.
    - Ученик помнит ключевые понятия предыдущих уроков блока и может пользоваться двуязычной схемой.
  anticipated_misconceptions:
    - Вода во время испарения ошибочно считается исчезнувшей.
    - Облака считаются состоящими только из невидимого водяного пара.
    - Круговорот представляется как однонаправленная линия с концом.
