      - ru
    expected_pupil_language:
      ru:
        - Солнечное тепло вызывает испарение. Водяной пар поднимается, охлаждается и конденсируется в капли; из облаков выпадают осадки. Вода стекает в водоёмы или просачивается в грунт и пополняет подземные воды. Затем она снова участвует в круговороте; это не однонаправленная линия.
