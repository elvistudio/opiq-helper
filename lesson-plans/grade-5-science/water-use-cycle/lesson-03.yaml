      - water-cycle-diagram
    scaffold_refs:
      - water-use-03-russian-explanation
    new_language_items: []
    formative_check:
      prompt_ru: Как связаны испарение, конденсация и осадки?
      subject_evidence: Вода испаряется, водяной пар охлаждается и конденсируется в капли, из которых при подходящих условиях выпадают осадки.
      language_evidence: Эстонская продукция на этапе формирования сложного понятия не оценивается.
    expected_evidence_of_learning: Ученик даёт научно корректный русский ответ до перехода к эстонской предметной поддержке.
    transition: Связываем понятую модель с короткими эстонскими обозначениями.
  - stage_id: water-use-03-language-bridge
