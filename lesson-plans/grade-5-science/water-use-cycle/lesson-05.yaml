    teacher_action_ru: "Показывает опорную схему и задаёт по-русски вопрос: «Как круговорот, подземные воды и защита воды связаны в одной системе?»; принимает предварительные версии без оценки."
    pupil_action_ru: Вспоминают связанные понятия по-русски, отмечают знакомые эстонские подписи и формулируют первоначальную гипотезу.
