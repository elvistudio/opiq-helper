      language_evidence: Узнаёт хотя бы одну знакомую эстонскую подпись.
    expected_evidence_of_learning: Учитель видит исходные представления и выбирает необходимую глубину русского объяснения.
    transition: Переходим к точному научному объяснению на русском языке.
  - stage_id: water-use-05-explain-ru
    duration_minutes: 8
    stage_type: russian_concept_explanation
    content_purpose_ru: Систематизирует весь блок и применяет научные понятия к схеме круговорота, фильтрационной модели и решению по защите воды.
    language_purpose_et: Сначала установить научный смысл по-русски, чтобы новые или повторяемые эстонские слова обозначали уже понятные идеи.
    teacher_action_ru: "Строит связное объяснение по выбранным каноническим источникам. Целевой вывод: Подземные воды образуются при просачивании воды; люди используют и очищают воду, но должны предотвращать загрязнение. В круговороте вода испаряется, конденсируется, выпадает осадками, стекает или просачивается. Бумажная фильтрация удаляет лишь часть видимых частиц и не делает модельную воду питьевой."
