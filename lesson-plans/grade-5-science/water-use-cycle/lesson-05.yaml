  content_objectives:
    - objective_id: water-use-05-content-objective
      text_ru: Систематизирует весь блок и применяет научные понятия к схеме круговорота, фильтрационной модели и решению по защите воды.
      observable_output_ru: "Выполняет предметную работу на русском: concept map, последовательность, интерпретацию модели и один полный доказательный ответ."
      curriculum_outcome_refs:
        - prok-ii-loodusopetus-01-models-and-water-cycle
        - prok-ii-loodusopetus-08-water-purification
        - prok-ii-loodusopetus-19-groundwater
        - prok-ii-loodusopetus-35-human-impact-communities
  estonian_language_objectives:
    - objective_id: water-use-05-language-objective
      text_ru: Узнаёт ключевые эстонские подписи как поддержку, не включая эстонскую беглость в предметный балл.
      text_et: Õpilane tunneb ära vähemalt kuus tuttavat terminit.
      observable_output: recognise_terms
      minimum_quantity: 1
      language_functions:
        - classify
        - sequence
  subject_success_criteria:
    - criterion_id: water-use-05-subject-success
      descriptor: "Выполняет предметную работу на русском: concept map, последовательность, интерпретацию модели и один полный доказательный ответ."
      acceptable_evidence: Осадки и просачивание пополняют подземные воды; загрязнение на поверхности может угрожать источнику, поэтому использование воды должно сопровождаться защитой и очисткой.
  estonian_success_criteria:
    - criterion_id: water-use-05-language-success
      descriptor: Узнаёт ключевые эстонские подписи как поддержку, не включая эстонскую беглость в предметный балл.
      acceptable_evidence: Põhjavesi ja veeringe on seotud.
  prerequisites:
    - Ученик может объяснить знакомое наблюдение полным предложением по-русски.
    - Ученик помнит ключевые понятия предыдущих уроков блока и может пользоваться двуязычной схемой.
  anticipated_misconceptions:
    - Перечень терминов ошибочно принимается за научное объяснение.
    - Фильтрационная модель считается доказательством питьевой безопасности.
    - Круговорот описывается без возврата воды в систему.
