methodology:
  model: russian_primary_estonian_supported
  approaches:
    - content_language_dual_objectives
    - planned_translanguaging
    - gradual_scaffolding
    - pluriliteracies
    - multimodal_support
    - vocabulary_recycling
    - cognitive_load_control
    - separate_content_language_assessment
  content_priority: subject_comprehension_not_reduced_by_language_support
  language_path:
    - sequence: 1
      stage_id: activate-weather
      language_mode: activate_prior_knowledge
      description: Ученик активирует знакомое содержание на русском языке.
    - sequence: 2
      stage_id: explain-weather-ru
      language_mode: establish_concept_ru
      description: Полное предметное объяснение сначала даётся по-русски.
    - sequence: 3
      stage_id: bridge-weather-et
      language_mode: introduce_term_et
      description: Эстонские единицы вводятся после понимания содержания.
    - sequence: 4
      stage_id: individual-weather-observation
      language_mode: supported_task_et
      description: Индивидуальное задание выполняется с видимой языковой опорой.
    - sequence: 5
      stage_id: assess-weather-separately
      language_mode: short_oral_answer_et
      description: Предметный результат и короткая эстонская фраза проверяются отдельно.
  learner_estonian_level: A1
  planned_support_level: high
  scaffold_release:
    introduction: full_support
    guided_practice: partial_support
    final_output: short_independent_output
  content_language_assessment_policy: separate_content_and_estonian_language_evidence
objectives:
  content_objectives:
    - objective_id: record-current-weather-evidence
      text_ru: Ученик безопасно наблюдает текущую погоду и записывает признак вместе с доказательством.
      observable_output_ru: Индивидуальный лист содержит время, признак, доказательство и краткий русский вывод.
      curriculum_outcome_refs:
        - ee-prk-2026-stage1-natural-science-guided-inquiry
  estonian_language_objectives:
    - objective_id: say-one-weather-frame-et
      text_ru: Ученик произносит одну короткую поддержанную фразу о наблюдаемой погоде.
      text_et: Õpilane ütleb ühe toetatud lause ilma kohta.
      observable_output: give_short_oral_answer
      minimum_quantity: 1
      language_functions:
        - name
        - describe
  subject_success_criteria:
    - criterion_id: subject-weather-evidence
      descriptor: Запись связывает текущий признак погоды с безопасно наблюдаемым доказательством.
      acceptable_evidence: Индивидуальный лист и русский вывод ученика, созданные до общей доски.
  estonian_success_criteria:
    - criterion_id: language-one-weather-sentence
      descriptor: Одна короткая фраза по видимой рамке понятна слушателю.
      acceptable_evidence: Индивидуальная устная фраза с одним уместным целевым словом.
  prerequisites:
    - Ученик может описать по-русски то, что видит в данный момент.
  anticipated_misconceptions:
    - Прогноз на вечер ошибочно записывается как текущее наблюдение.
    - Наличие ветра определяется без наблюдаемого безопасного признака.
language_load:
  new_terms_et:
    - term_et: ilm
      equivalent_ru: погода
      simple_definition_et: Ilm on õhu ja taeva seisund.
      provenance:
        category: author_created_bridge
        source_reference: grade-2 weather bilingual word bank
        notes: Short original definition supports only the bounded A1 weather vocabulary.
      first_use_stage: bridge-weather-et
      reuse_stage_refs:
        - individual-weather-observation
        - assess-weather-separately
    - term_et: vihmane
      equivalent_ru: дождливая
      simple_definition_et: Vihmane ilm tähendab, et sajab vihma.
      provenance:
        category: author_created_bridge
        source_reference: grade-2 weather bilingual word bank
        notes: Short original definition supports only the bounded A1 weather vocabulary.
      first_use_stage: bridge-weather-et
      reuse_stage_refs:
        - individual-weather-observation
        - assess-weather-separately
    - term_et: tuuline
      equivalent_ru: ветреная
      simple_definition_et: Tuulise ilmaga liiguvad oksad, lipp või rohi.
      provenance:
        category: author_created_bridge
        source_reference: grade-2 weather bilingual word bank
        notes: Short original definition supports only the bounded A1 weather vocabulary.
      first_use_stage: bridge-weather-et
      reuse_stage_refs:
        - individual-weather-observation
        - assess-weather-separately
    - term_et: pilvine
      equivalent_ru: облачная
      simple_definition_et: Pilvise ilmaga on taevas palju pilvi.
      provenance:
        category: author_created_bridge
        source_reference: grade-2 weather bilingual word bank
        notes: Short original definition supports only the bounded A1 weather vocabulary.
      first_use_stage: bridge-weather-et
      reuse_stage_refs:
        - individual-weather-observation
        - assess-weather-separately
    - term_et: päikeseline
      equivalent_ru: солнечная
      simple_definition_et: Päikeselise ilmaga paistab päike.
      provenance:
        category: author_created_bridge
        source_reference: grade-2 weather bilingual word bank
        notes: Short original definition supports only the bounded A1 weather vocabulary.
      first_use_stage: bridge-weather-et
      reuse_stage_refs:
        - individual-weather-observation
        - assess-weather-separately
  recycled_terms_et: []
  new_instruction_verbs_et:
    - verb_et: vaatle
      equivalent_ru: наблюдай
      provenance:
        category: author_created_bridge
        source_reference: grade-2 weather observation instruction
        notes: The instruction verb is introduced with teacher modelling and a visible procedure.
      first_use_stage: bridge-weather-et
      reuse_stage_refs:
        - individual-weather-observation
  recycled_instruction_verbs_et: []
  model_sentences:
    - text_et: Täna on tuuline ilm.
      translation_ru: Сегодня ветрено.
      terms_et:
        - tuuline
        - ilm
      provenance:
        category: author_created_bridge
        source_reference: grade-2 weather oral model
        notes: Original short sentence models one bounded supported weather statement.
  sentence_frames:
    - frame_id: weather-description-frame
      frame_et: Täna on ___ ilm.
      purpose_ru: Рамка ограничивает обязательную эстонскую продукцию одной короткой фразой.
      stage_refs:
        - bridge-weather-et
        - individual-weather-observation
        - assess-weather-separately
      provenance:
        category: author_created_bridge
        source_reference: grade-2 weather sentence frame
        notes: Original A1 frame supports one oral output after the Russian conclusion.
  expected_receptive_language_et:
    - Vaatle ilma.
    - Näita sõna.
    - Ütle üks lause.
  expected_supported_productive_language_et:
    - Täna on vihmane ilm.
    - Täna on tuuline ilm.
    - Täna on pilvine ilm.
    - Täna on päikeseline ilm.
  expected_independent_productive_language_et:
    - Täna on ___ ilm.
  full_expected_answer_ru: Я наблюдал(а) погоду в указанное время, записал(а) текущий признак и подтвердил(а) его тем, что
    можно было безопасно увидеть.
  short_expected_oral_answer_et: Täna on ___ ilm.
  oral_output_terms_et:
    - ilm
    - vihmane
    - tuuline
    - pilvine
    - päikeseline
cognitive_load:
  new_subject_concepts: 2
  new_estonian_terms: 5
  new_instruction_verbs: 1
  new_sentence_structures: 1
  independent_output_sentences: 1
  rationale: Полное понятие и процедура устанавливаются по-русски; эстонский output ограничен одной рамкой.
scaffolds:
  - scaffold_id: weather-russian-explanation
    type: russian_explanation
    description_ru: Учитель по-русски моделирует отличие наблюдения от прогноза и полный безопасный порядок.
    stage_refs:
      - explain-weather-ru
    release:
      at_stage: individual-weather-observation
      how_reduced_ru: Ученик следует напечатанному порядку без повторного устного объяснения каждого шага.
    provenance:
      category: author_created_explanation
      source_reference: grade-2 weather standalone explanation
      notes: Original Russian explanation preserves full subject demand before language support.
  - scaffold_id: weather-word-bank
    type: word_bank
    description_ru: Пять целевых слов остаются видимыми рядом с русскими эквивалентами.
    stage_refs:
      - bridge-weather-et
      - individual-weather-observation
    release:
      at_stage: assess-weather-separately
      how_reduced_ru: На выходной карточке остаётся только список слов без русского перевода.
    provenance:
      category: author_created_bridge
      source_reference: grade-2 weather word bank
      notes: Bounded bilingual word bank contains five independently authored term links.
  - scaffold_id: weather-description-sentence-frame
    type: sentence_frame
    description_ru: Рамка поддерживает одну короткую устную фразу после русского вывода.
    stage_refs:
      - bridge-weather-et
      - individual-weather-observation
      - assess-weather-separately
    release:
      at_stage: assess-weather-separately
      how_reduced_ru: Ученик самостоятельно выбирает одно подходящее прилагательное для пустого места.
    provenance:
      category: author_created_bridge
      source_reference: grade-2 weather sentence frame
      notes: Original frame limits productive language load to a single supported sentence.
multimodal_support:
  - support_id: weather-observation-table-support
    type: table
    stage_refs:
      - individual-weather-observation
    material_ref: g2-weather-observation-task
    provenance:
      category: author_created_worksheet
      source_reference: grade-2 weather observation sheet
      notes: Original table externalises the safe observation sequence and evidence fields.
stages:
  - stage_id: activate-weather
    duration_minutes: 5
    stage_type: activation
    content_purpose_ru: Отделить наблюдение текущей погоды от предположения о будущем.
    language_purpose_et: Aktiveerida tuttav sõna ilm.
    teacher_action_ru: Показывает два высказывания и просит определить, где записано наблюдение.
    pupil_action_ru: Выбирает наблюдаемое высказывание и объясняет выбор по-русски.
    teacher_language:
      - ru
      - et
    expected_pupil_language:
      ru:
        - Я могу увидеть этот признак сейчас.
      et: []
    material_refs:
      - g2-weather-observation-explanation
    provenance_refs:
      - g2-weather-observation-explanation
    scaffold_refs: []
    new_language_items: []
    formative_check:
      prompt_ru: Что можно проверить прямо сейчас?
      subject_evidence: Ученик отличает наблюдение от прогноза.
      language_evidence: Эстонская продукция на этом этапе не требуется.
    expected_evidence_of_learning: Индивидуальный русский ответ называет один проверяемый текущий признак.
    transition: Переход к полному русскому объяснению.
  - stage_id: explain-weather-ru
    duration_minutes: 8
    stage_type: russian_concept_explanation
    content_purpose_ru: Сформировать полный безопасный алгоритм наблюдения погоды.
    language_purpose_et: Sisu mõistmine toimub vene keeles.
    teacher_action_ru: Объясняет признаки погоды, границы одного наблюдения и правила безопасности.
    pupil_action_ru: Следит по объяснению и располагает пять признаков в порядке наблюдения.
    teacher_language:
      - ru
      - et
    expected_pupil_language:
      ru:
        - Сначала я записываю время, потом наблюдаю признаки.
      et: []
    material_refs:
      - g2-weather-observation-explanation
    provenance_refs:
      - g2-weather-observation-explanation
    scaffold_refs:
      - weather-russian-explanation
    new_language_items: []
    formative_check:
      prompt_ru: Почему одно наблюдение не является прогнозом?
      subject_evidence: Ученик связывает вывод с текущим временем и местом.
      language_evidence: Содержание объясняется полностью по-русски.
    expected_evidence_of_learning: Ученик по-русски воспроизводит не менее трёх шагов безопасной процедуры.
    transition: Переход к пяти видимым эстонским словам.
  - stage_id: bridge-weather-et
    duration_minutes: 7
    stage_type: estonian_language_bridge
    content_purpose_ru: Связать уже понятые признаки с пятью ограниченными словами для описания погоды.
    language_purpose_et: Õppida ilm, vihmane, tuuline, pilvine ja päikeseline.
    teacher_action_ru: Показывает слова рядом с русскими эквивалентами и моделирует одну короткую рамку.
    pupil_action_ru: Соотносит пять слов с погодными условиями и повторяет одну рамку с поддержкой.
    teacher_language:
      - ru
      - et
    expected_pupil_language:
      ru:
        - Это слово обозначает наблюдаемый признак.
      et:
        - Täna on pilvine ilm.
    material_refs:
      - g2-weather-observation-explanation
    provenance_refs:
      - g2-weather-observation-explanation
    scaffold_refs:
      - weather-word-bank
      - weather-description-sentence-frame
    new_language_items:
      - ilm
      - vihmane
      - tuuline
      - pilvine
      - päikeseline
      - vaatle
    formative_check:
      prompt_ru: Покажи слово для облачной погоды.
      subject_evidence: Ученик сохраняет связь слова с наблюдаемым признаком.
      language_evidence: Ученик узнаёт не менее четырёх из пяти слов.
    expected_evidence_of_learning: Ученик соотносит целевые слова с безопасно наблюдаемыми признаками погоды.
    transition: Переход к индивидуальному наблюдению.
  - stage_id: individual-weather-observation
    duration_minutes: 17
    stage_type: practical_observation
    content_purpose_ru: Получить индивидуальную запись признака и доказательства.
    language_purpose_et: Kasutada üht toetatud lauset.
    teacher_action_ru: Организует наблюдение через закрытое окно или разрешённый контролируемый выход.
    pupil_action_ru: Самостоятельно заполняет лист, пишет русский вывод и только затем передаёт одну запись на доску.
    teacher_language:
      - ru
      - et
    expected_pupil_language:
      ru:
        - Я вижу признак и могу назвать доказательство.
      et:
        - Täna on tuuline ilm.
    material_refs:
      - g2-weather-observation-task
    provenance_refs:
      - g2-weather-observation-task
    scaffold_refs:
      - weather-word-bank
      - weather-description-sentence-frame
    new_language_items: []
    formative_check:
      prompt_ru: Какое доказательство записано на твоём листе?
      subject_evidence: Лист содержит время, признак и индивидуальное доказательство.
      language_evidence: Короткая фраза дана по рамке после предметного вывода.
    expected_evidence_of_learning: Каждый ученик создаёт собственный лист до сборки подписанной общей доски.
    transition: Переход к раздельной выходной проверке.
  - stage_id: assess-weather-separately
    duration_minutes: 8
    stage_type: assessment
    content_purpose_ru: Отдельно проверить предметное доказательство и языковой output.
    language_purpose_et: Hinnata lühikest lauset eraldi.
    teacher_action_ru: Собирает карточку и отдельно отмечает предметный результат и понятность фразы.
    pupil_action_ru: Пишет признак с доказательством и произносит одну короткую эстонскую фразу.
    teacher_language:
      - ru
      - et
    expected_pupil_language:
      ru:
        - Признак подтверждается моим наблюдением.
      et:
        - Täna on ___ ilm.
    material_refs:
      - g2-weather-observation-assessment
    provenance_refs:
      - g2-weather-observation-assessment
    scaffold_refs:
      - weather-description-sentence-frame
    new_language_items: []
    formative_check:
      prompt_ru: Как доказательство связано с признаком?
      subject_evidence: Письменная предметная строка содержит признак и наблюдаемое доказательство.
      language_evidence: Отдельно зафиксирована одна понятная поддержанная фраза.
    expected_evidence_of_learning: Предметная и эстонская строки заполнены независимо друг от друга.
    transition: Урок завершается без обязательного домашнего наблюдения.
questions:
  - question_id: weather-evidence-question
    question_ru: Какой признак погоды ты наблюдал(а) и чем можешь его доказать?
    question_et: Milline ilm on täna?
    full_expected_answer_ru: Ответ называет текущий признак и конкретное безопасно наблюдаемое доказательство.
    short_oral_answer_et: Täna on ___ ilm.
    acceptable_variants:
      - Допустим любой точный текущий признак с соответствующим наблюдаемым доказательством.
    misconception_to_watch: Ученик сообщает прогноз или мнение вместо наблюдаемого доказательства.
    objective_refs:
      - record-current-weather-evidence
      - say-one-weather-frame-et
    provenance_refs:
      - g2-weather-observation-task
practical_work:
  work_id: safe-individual-weather-observation
  title_ru: Безопасное индивидуальное наблюдение погоды
  title_et: Ohutu individuaalne ilmavaatlus
  safety_requirements:
    - Основной режим — наблюдение через закрытое окно без открывания и высовывания.
    - Выход возможен только по решению учителя или взрослого и под непосредственным присмотром.
    - Нельзя приближаться к дороге, воде, скользкому краю или грозе ради наблюдения.
  teacher_controlled_steps:
    - Учитель выбирает безопасное место и решает, остаётся ли группа в помещении.
    - Учитель прекращает наблюдение при изменении условий или отсутствии контроля.
  pupil_steps:
    - Записать время и место до начала наблюдения.
    - Отметить солнце, облака, дождь и безопасный признак ветра.
    - Записать собственный русский вывод и короткую эстонскую фразу.
    - Передать одну запись на общую доску только после завершения своего листа.
  materials:
    - Индивидуальный печатный лист
    - Карандаш
    - Часы
    - Безопасный обзор через закрытое окно
  observation_table:
    columns:
      - время
      - солнце
      - облака
      - дождь
      - ветер
      - доказательство
    data_collection_ru: Каждый ученик самостоятельно отмечает текущие признаки до совместного обсуждения.
  expected_observation_ru: Запись соответствует условиям в месте и времени наблюдения и содержит видимое доказательство.
  expected_conclusion_ru: Вывод описывает текущую погоду и не превращает одно наблюдение в общий прогноз.
  russian_report_target: Один полный русский вывод с признаком и доказательством на индивидуальном листе.
  short_estonian_conclusion: Täna on ___ ilm.
  opiq_source_record_ids: []
