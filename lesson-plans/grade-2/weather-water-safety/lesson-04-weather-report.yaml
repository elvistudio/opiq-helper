    release:
      at_stage: draft-individual-contribution
      how_reduced_ru: Во время личной первой попытки остаются только данные и пустая рамка ученика.
    provenance:
      category: author_created_explanation
      source_reference: grade-2 weather-report standalone explanation
      notes: Original explanation uses a neutral dataset distinct from both pending tasks.
  - scaffold_id: weather-report-four-point-table
    type: partially_completed_table
    description_ru: Четырёхточечная таблица сохраняет все исходные значения задачи 11.
    stage_refs:
      - check-four-point-data
      - draft-individual-contribution
      - verify-attribution-code
      - assemble-shared-weather-report
    release:
      at_stage: assemble-shared-weather-report
      how_reduced_ru: В общий отчёт переносится только проверенная идея с личным кодом.
    provenance:
      category: author_created_task_set
      source_reference: g2-shared-weather-report-contribution-task customer dataset
      notes: The table preserves the exact four-point learner data.
  - scaffold_id: weather-report-word-bank
    type: word_bank
    description_ru: Мини-банк soojem | külmem поддерживает только отдельную выходную рамку.
    stage_refs:
      - check-four-point-data
      - complete-individual-exit-ticket
    release:
      at_stage: check-estonian-output-separately
      how_reduced_ru: После первой попытки ученик произносит одну завершённую фразу.
    provenance:
      category: author_created_bridge
      source_reference: g2-weather-exit-ticket-task customer word bank
      notes: The two supplied choices remain visible without a completed answer.
  - scaffold_id: weather-exit-sentence-frame
    type: sentence_frame
    description_ru: Пустая рамка Kell 13 on ____. отделена от двух русских ответов.
    stage_refs:
      - complete-individual-exit-ticket
      - check-estonian-output-separately
    release:
      at_stage: check-estonian-output-separately
      how_reduced_ru: После первой попытки остаётся единственная завершённая устная фраза.
    provenance:
      category: author_created_bridge
      source_reference: g2-weather-exit-ticket-task customer frame
      notes: No second productive sentence is introduced.
multimodal_support:
