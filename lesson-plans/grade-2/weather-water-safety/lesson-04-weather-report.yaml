stages:
  - stage_id: retrieve-module-evidence
    duration_minutes: 5
    stage_type: activation
    content_purpose_ru: Вспомнить личные доказательства, созданные в предыдущих уроках модуля.
    language_purpose_et: Aktiveerida tuttav sõna ilm ilma uue lauseta.
    teacher_action_ru: Просит каждого ученика назвать по-русски одно собственное наблюдение, вычисление или безопасное решение.
    pupil_action_ru: Индивидуально называет одно личное доказательство и не заменяет его групповым ответом.
    teacher_language:
      - ru
      - et
    expected_pupil_language:
      ru:
        - У меня есть собственное доказательство.
      et: []
    material_refs:
      - g2-weather-report-explanation
    provenance_refs:
      - g2-weather-report-explanation
    scaffold_refs: []
    new_language_items: []
    formative_check:
      prompt_ru: Какое личное доказательство из модуля принадлежит тебе?
      subject_evidence: Каждый ученик различает личное и групповое доказательство.
      language_evidence: Новая эстонская продукция не требуется.
    expected_evidence_of_learning: Краткое индивидуальное называние одного доказательства.
    transition: Переход к русскому объяснению точного отчёта.
  - stage_id: explain-evidence-report-ru
    duration_minutes: 6
    stage_type: russian_concept_explanation
    content_purpose_ru: Понять требования точного факта, сравнения и проверяемого личного вклада.
    language_purpose_et: Mõista sisu kõigepealt vene keeles.
    teacher_action_ru: По-русски разбирает нейтральный пример 5 °C и 9 °C, не раскрывая данные или ответы задач 11/12.
    pupil_action_ru: Объясняет по-русски, что нужно проверить в точном факте и сравнении.
    teacher_language:
      - ru
      - et
    expected_pupil_language:
      ru:
        - Проверяю точку, число и направление сравнения.
      et: []
    material_refs:
      - g2-weather-report-explanation
    provenance_refs:
      - g2-weather-report-explanation
    scaffold_refs:
      - weather-report-russian-explanation
    new_language_items: []
    formative_check:
      prompt_ru: Какие три элемента делают вклад проверяемым?
      subject_evidence: Названы факт, сравнение и личный код.
      language_evidence: Предметное объяснение остаётся русским.
    expected_evidence_of_learning: Ученик объясняет критерии точности без готового ответа задачи.
    transition: Переход к чтению четырёх новых значений.
  - stage_id: check-four-point-data
    duration_minutes: 5
    stage_type: guided_practice
    content_purpose_ru: Точно прочитать четыре точки и проверить диапазон данных до написания вывода.
    language_purpose_et: Tunda ära sõnad soojem, külmem ja kell.
    teacher_action_ru: Показывает четыре точки 8, 12, 15 и 10 °C и моделирует только процедуру проверки.
    pupil_action_ru: Индивидуально сверяет названия точек и значения, затем устно называет возможную пару для сравнения.
    teacher_language:
      - ru
      - et
    expected_pupil_language:
      ru:
        - Сравню два значения после проверки каждой точки.
      et: []
    material_refs:
      - g2-shared-weather-report-contribution-task
    provenance_refs:
      - g2-shared-weather-report-contribution-task
    scaffold_refs:
      - weather-report-four-point-table
      - weather-report-word-bank
    new_language_items:
      - soojem
      - külmem
      - kell
    formative_check:
      prompt_ru: Какие два значения ты собираешься сравнить?
      subject_evidence: Пара значений существует в четырёхточечном наборе.
      language_evidence: Ученик узнаёт три эстонских слова без обязательной фразы.
    expected_evidence_of_learning: Отмеченная пара точек перед самостоятельным письмом.
    transition: Переход к закрытой индивидуальной работе над вкладом.
  - stage_id: draft-individual-contribution
    duration_minutes: 8
    stage_type: independent_output
    content_purpose_ru: Создать отдельный точный факт, сравнение и личный код до групповой сборки.
    language_purpose_et: Eestikeelset produktiivset vastust ei nõuta.
    teacher_action_ru: Выдаёт задачу 11, не показывает критерии teacher-only guidance и не предлагает обязательную формулировку.
    pupil_action_ru: Самостоятельно пишет два русских предложения и ставит личный код в отдельной рамке.
