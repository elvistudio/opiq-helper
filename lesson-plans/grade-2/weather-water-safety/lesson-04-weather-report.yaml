methodology:
  model: russian_primary_estonian_supported
  approaches:
    - content_language_dual_objectives
    - planned_translanguaging
    - gradual_scaffolding
    - pluriliteracies
    - multimodal_support
    - vocabulary_recycling
    - cognitive_load_control
    - separate_content_language_assessment
  content_priority: subject_comprehension_not_reduced_by_language_support
  language_path:
    - sequence: 1
      stage_id: retrieve-module-evidence
      language_mode: activate_prior_knowledge
      description: Ученик вспоминает личное evidence на русском языке.
    - sequence: 2
      stage_id: explain-evidence-report-ru
      language_mode: establish_concept_ru
      description: Требования к точному отчёту полностью объясняются по-русски.
    - sequence: 3
      stage_id: check-four-point-data
      language_mode: introduce_term_et
      description: Три эстонских слова вводятся рецептивно после понимания данных.
    - sequence: 4
      stage_id: draft-individual-contribution
      language_mode: full_subject_answer_ru
      description: Открытая задача 11 выполняется индивидуально по-русски.
    - sequence: 5
      stage_id: verify-attribution-code
      language_mode: full_subject_answer_ru
      description: Личный код проверяется до общего продукта.
    - sequence: 6
      stage_id: assemble-shared-weather-report
      language_mode: full_subject_answer_ru
      description: Группа собирает отчёт только из проверенных вкладов.
    - sequence: 7
      stage_id: complete-individual-exit-ticket
      language_mode: supported_task_et
      description: Задача 12 выполняется с пустой рамкой и мини-банком.
    - sequence: 8
      stage_id: check-estonian-output-separately
      language_mode: short_oral_answer_et
      description: После первой попытки произносится одна короткая эстонская фраза.
    - sequence: 9
      stage_id: reflect-and-handoff-evidence
      language_mode: recycle_language
      description: Предметное, языковое и рефлексивное evidence сдаётся раздельно.
  learner_estonian_level: A1
  planned_support_level: high
  scaffold_release:
    introduction: full_support
    guided_practice: partial_support
    final_output: short_independent_output
  content_language_assessment_policy: separate_content_and_estonian_language_evidence
objectives:
  content_objectives:
    - objective_id: produce-attributable-weather-report-evidence
      text_ru: Ученик создаёт точный индивидуальный факт и сравнение до участия в общем отчёте.
      observable_output_ru: Отдельная рамка содержит два предложения и личный код, а общий отчёт использует только проверенные вклады.
      curriculum_outcome_refs:
        - ee-prk-2026-stage1-natural-science-guided-inquiry
    - objective_id: check-and-correct-weather-data-claim
      text_ru: Ученик проверяет короткий вывод по двум температурам и исправляет неверную запись.
      observable_output_ru: Первые две рамки exit ticket отдельно показывают вывод, разницу и способ проверки.
      curriculum_outcome_refs:
        - ee-prk-2026-stage1-natural-science-guided-inquiry
  estonian_language_objectives:
    - objective_id: say-one-warmer-time-sentence-et
      text_ru: Ученик после предметной первой попытки произносит одну поддержанную фразу о более тёплом времени.
      text_et: Õpilane ütleb ühe toetatud lause soojema aja kohta.
      observable_output: give_short_oral_answer
      minimum_quantity: 1
      language_functions:
        - compare
        - report
  subject_success_criteria:
    - criterion_id: individual-weather-report-contribution
      descriptor: Личная рамка содержит точный факт, верное сравнение и личный код до групповой сборки.
      acceptable_evidence: Индивидуальная рамка задачи 11 и связанная с ней запись на общей доске.
    - criterion_id: individual-weather-exit-evidence
      descriptor: Первые две рамки exit ticket верно сравнивают 14 °C и 7 °C и объясняют проверку.
      acceptable_evidence: Два отдельных русских ответа задачи 12 до просмотра teacher-only guidance.
  estonian_success_criteria:
    - criterion_id: language-one-warmer-time-sentence
      descriptor: Отдельная рамка завершена единственным подходящим словом и произнесена как одна короткая фраза.
      acceptable_evidence: Третья строка задачи 12 и отдельный короткий устный ответ.
  prerequisites:
    - Ученик читает целые температуры и сравнивает значения в пределах двадцати.
    - Ученик различает индивидуальную работу и общий продукт.
  anticipated_misconceptions:
    - Групповой текст сдаётся вместо отдельной личной рамки.
    - Слово külmem выбирается вопреки сравнению 14 °C и 7 °C.
language_load:
  new_terms_et:
    - term_et: soojem
      equivalent_ru: теплее
      simple_definition_et: Soojem tähendab kõrgemat temperatuuri.
      provenance:
        category: author_created_bridge
        source_reference: grade-2 weather comparison word bank
        notes: Original concise receptive definition supports one bounded output.
      first_use_stage: check-four-point-data
      reuse_stage_refs:
        - complete-individual-exit-ticket
        - check-estonian-output-separately
    - term_et: külmem
      equivalent_ru: холоднее
      simple_definition_et: Külmem tähendab madalamat temperatuuri.
      provenance:
        category: author_created_bridge
        source_reference: grade-2 weather comparison word bank
        notes: Original concise receptive contrast remains in the supplied mini-bank.
      first_use_stage: check-four-point-data
      reuse_stage_refs:
        - complete-individual-exit-ticket
    - term_et: kell
      equivalent_ru: в ... часов
      simple_definition_et: Kell näitab aega.
      provenance:
        category: author_created_bridge
        source_reference: grade-2 time-in-weather-report word bank
        notes: Original concise definition supports the supplied exit frame.
      first_use_stage: check-four-point-data
      reuse_stage_refs:
        - complete-individual-exit-ticket
        - check-estonian-output-separately
  recycled_terms_et:
    - term_et: ilm
      equivalent_ru: погода
      source_lesson_id: grade-2-weather-water-safety-01-observation
      reuse_stage_refs:
        - retrieve-module-evidence
        - assemble-shared-weather-report
  new_instruction_verbs_et: []
  recycled_instruction_verbs_et: []
  model_sentences:
    - text_et: Kell 13 on soojem.
      translation_ru: В 13 часов теплее.
      terms_et:
        - kell
        - soojem
      provenance:
        category: author_created_bridge
        source_reference: g2-weather-exit-ticket-task bounded oral answer
        notes: The exact model is teacher-visible and released to the learner only after the first attempt.
  sentence_frames:
    - frame_id: weather-exit-warmer-frame
      frame_et: Kell 13 on ____.
      purpose_ru: Рамка поддерживает одну отдельную A1-фразу после русского сравнения данных.
      stage_refs:
        - complete-individual-exit-ticket
        - check-estonian-output-separately
      provenance:
        category: author_created_bridge
        source_reference: g2-weather-exit-ticket-task customer frame
        notes: The blank frame and two-word bank preserve the pending task projection.
  expected_receptive_language_et:
    - soojem
    - külmem
    - kell
  expected_supported_productive_language_et:
    - Kell 13 on soojem.
  expected_independent_productive_language_et:
    - Kell 13 on soojem.
  full_expected_answer_ru: Ученик создаёт собственный точный факт и сравнение, сохраняет личный код, участвует в
    проверяемом общем отчёте и отдельно исправляет неверный вывод по 14 °C и 7 °C.
  short_expected_oral_answer_et: Kell 13 on soojem.
  oral_output_terms_et:
    - kell
    - soojem
cognitive_load:
  new_subject_concepts: 2
  new_estonian_terms: 3
  new_instruction_verbs: 0
  new_sentence_structures: 1
  independent_output_sentences: 1
  rationale: Полный отчёт и проверка выполняются по-русски; обязательная эстонская продукция ограничена одной короткой фразой.
