methodology:
  model: russian_primary_estonian_supported
  approaches:
    - content_language_dual_objectives
    - planned_translanguaging
    - gradual_scaffolding
    - pluriliteracies
    - multimodal_support
    - vocabulary_recycling
    - cognitive_load_control
    - separate_content_language_assessment
  content_priority: subject_comprehension_not_reduced_by_language_support
  language_path:
    - sequence: 1
      stage_id: activate-data
      language_mode: activate_prior_knowledge
      description: Ученик активирует знакомое содержание на русском языке.
    - sequence: 2
      stage_id: explain-data-time-ru
      language_mode: establish_concept_ru
      description: Полное предметное объяснение сначала даётся по-русски.
    - sequence: 3
      stage_id: bridge-data-et
      language_mode: introduce_term_et
      description: Эстонские единицы вводятся после понимания содержания.
    - sequence: 4
      stage_id: solve-approved-tasks
      language_mode: supported_task_et
      description: Индивидуальное задание выполняется с видимой языковой опорой.
    - sequence: 5
      stage_id: assess-data-separately
      language_mode: short_oral_answer_et
      description: Предметный результат и короткая эстонская фраза проверяются отдельно.
  learner_estonian_level: A1-A2
  planned_support_level: high
  scaffold_release:
    introduction: full_support
    guided_practice: partial_support
    final_output: short_independent_output
  content_language_assessment_policy: separate_content_and_estonian_language_evidence
objectives:
  content_objectives:
    - objective_id: solve-weather-data-and-time
      text_ru: Ученик сравнивает четыре значения осадков и решает задачу на общую длительность.
      observable_output_ru: Индивидуальные записи показывают максимум, минимум, разность, сложение и перевод шестидесяти минут в один час.
      curriculum_outcome_refs:
        - ee-prk-2026-stage1-mathematics-real-life
  estonian_language_objectives:
    - objective_id: say-one-data-frame-et
      text_ru: Ученик произносит одну короткую поддержанную фразу о результате после вычисления.
      text_et: Õpilane ütleb ühe toetatud lause tulemuse kohta.
      observable_output: give_short_oral_answer
      minimum_quantity: 1
      language_functions:
        - name
        - compare
        - report
  subject_success_criteria:
    - criterion_id: subject-two-correct-solutions
      descriptor: Обе работы показывают требуемые действия и сохраняют правильные единицы.
      acceptable_evidence: Два индивидуальных learner sheets до просмотра teacher-only guidance.
  estonian_success_criteria:
    - criterion_id: language-one-data-sentence
      descriptor: Одна выбранная короткая рамка с результатом понятна слушателю.
      acceptable_evidence: Индивидуальная устная фраза после завершения математической работы.
  prerequisites:
    - Ученик сравнивает двузначные целые числа и выполняет сложение и вычитание в пределах ста.
    - Ученик знает, что число в задаче читается вместе с единицей измерения.
  anticipated_misconceptions:
    - Из максимума вычитается второе по величине число вместо минимума.
    - Шестьдесят минут ошибочно называются двумя часами.
language_load:
  new_terms_et:
    - term_et: millimeeter
      equivalent_ru: миллиметр
      simple_definition_et: Millimeeter on väike pikkusühik.
      provenance:
        category: author_created_bridge
        source_reference: grade-2 data and time bilingual word bank
        notes: Short original definition supports bounded A1-A2 mathematics language.
      first_use_stage: bridge-data-et
      reuse_stage_refs:
        - assess-data-separately
    - term_et: minut
      equivalent_ru: минута
      simple_definition_et: Minut on ajaühik.
      provenance:
        category: author_created_bridge
        source_reference: grade-2 data and time bilingual word bank
        notes: Short original definition supports bounded A1-A2 mathematics language.
      first_use_stage: bridge-data-et
      reuse_stage_refs:
        - assess-data-separately
    - term_et: tund
      equivalent_ru: час
      simple_definition_et: Tund on kuuskümmend minutit.
      provenance:
        category: author_created_bridge
        source_reference: grade-2 data and time bilingual word bank
        notes: Short original definition supports bounded A1-A2 mathematics language.
      first_use_stage: bridge-data-et
      reuse_stage_refs:
        - assess-data-separately
    - term_et: kokku
      equivalent_ru: всего
      simple_definition_et: Kokku näitab kogu hulka või aega.
      provenance:
        category: author_created_bridge
        source_reference: grade-2 data and time bilingual word bank
        notes: Short original definition supports bounded A1-A2 mathematics language.
      first_use_stage: bridge-data-et
      reuse_stage_refs:
        - assess-data-separately
  recycled_terms_et:
    - term_et: ilm
      equivalent_ru: погода
      source_lesson_id: grade-2-weather-water-safety-01-observation
      reuse_stage_refs:
        - activate-data
        - solve-approved-tasks
  new_instruction_verbs_et:
    - verb_et: võrdle
      equivalent_ru: сравни
      provenance:
        category: author_created_bridge
        source_reference: grade-2 data and time instruction bank
        notes: Instruction verb is introduced only after the Russian calculation strategy.
      first_use_stage: bridge-data-et
      reuse_stage_refs:
        - solve-approved-tasks
    - verb_et: liida
      equivalent_ru: сложи
      provenance:
        category: author_created_bridge
        source_reference: grade-2 data and time instruction bank
        notes: Instruction verb is introduced only after the Russian calculation strategy.
      first_use_stage: bridge-data-et
      reuse_stage_refs:
        - solve-approved-tasks
  recycled_instruction_verbs_et: []
  model_sentences:
    - text_et: Kokku on kümme minutit.
      translation_ru: Всего десять минут.
      terms_et:
        - kokku
        - minut
      provenance:
        category: author_created_bridge
        source_reference: grade-2 data and time oral model
        notes: Original model uses data different from both approved integrated tasks.
  sentence_frames:
    - frame_id: data-result-frame
      frame_et: Kokku on ___ minutit.
      purpose_ru: Рамка поддерживает одну короткую фразу после полного русского вычисления.
      stage_refs:
        - bridge-data-et
        - assess-data-separately
      provenance:
        category: author_created_bridge
        source_reference: grade-2 data result frame
        notes: Original A1-A2 frame remains separate from mathematics assessment.
  expected_receptive_language_et:
    - Võrdle arve.
    - Liida ajad.
    - Ütle üks lause.
  expected_supported_productive_language_et:
    - Kõige rohkem on ___.
    - Kokku on ___ minutit.
  expected_independent_productive_language_et:
    - Kokku on ___ minutit.
  full_expected_answer_ru: Ученик правильно находит максимум и минимум осадков, вычисляет разность, складывает две
    длительности и показывает равенство шестидесяти минут одному часу.
  short_expected_oral_answer_et: Kokku on ___ minutit.
  oral_output_terms_et:
    - kokku
    - minut
cognitive_load:
  new_subject_concepts: 2
  new_estonian_terms: 4
  new_instruction_verbs: 2
  new_sentence_structures: 1
  independent_output_sentences: 1
  rationale: Русский язык сохраняет полную вычислительную нагрузку; эстонская продукция ограничена одной фразой.
scaffolds:
  - scaffold_id: data-russian-explanation
    type: russian_explanation
    description_ru: Учитель по-русски моделирует оба алгоритма без раскрытия ответов индивидуальных задач.
    stage_refs:
      - explain-data-time-ru
    release:
      at_stage: solve-approved-tasks
      how_reduced_ru: Во время первой попытки остаются только нейтральные шаги стратегии.
    provenance:
      category: author_created_explanation
      source_reference: grade-2 data and time standalone explanation
      notes: Original Russian explanation precedes and preserves full independent calculations.
  - scaffold_id: data-word-bank
    type: word_bank
    description_ru: Четыре новых слова и повторяемое ilm остаются видимыми без готового ответа.
    stage_refs:
      - bridge-data-et
      - solve-approved-tasks
    release:
      at_stage: assess-data-separately
      how_reduced_ru: На выходе ученик самостоятельно выбирает одну из двух рамок.
    provenance:
      category: author_created_bridge
      source_reference: grade-2 data and time word bank
      notes: Original bounded word bank does not alter either approved task projection.
  - scaffold_id: data-sentence-frame
    type: sentence_frame
    description_ru: Рамка поддерживает один краткий устный отчёт после вычисления.
    stage_refs:
      - bridge-data-et
      - assess-data-separately
    release:
      at_stage: assess-data-separately
      how_reduced_ru: Ученик сам выбирает число из собственной завершённой работы.
    provenance:
      category: author_created_bridge
      source_reference: grade-2 data result frame
      notes: Original frame keeps the oral output separate from the task-bank answer contract.
multimodal_support:
  - support_id: weather-data-table-support
    type: table
    stage_refs:
      - solve-approved-tasks
    material_ref: g2-weather-data-comparison-task
    provenance:
      category: author_created_task_set
      source_reference: g2-weather-data-comparison-task
      notes: Approved learner table supplies the exact four-value data comparison projection.
stages:
  - stage_id: activate-data
    duration_minutes: 5
    stage_type: activation
    content_purpose_ru: Вспомнить, что число читается вместе с подписью и единицей.
    language_purpose_et: Taaskasutada sõna ilm.
    teacher_action_ru: Показывает два числа с разными подписями и просит назвать, что именно измерено.
    pupil_action_ru: По-русски связывает каждое число с подписью и единицей измерения.
    teacher_language:
      - ru
      - et
    expected_pupil_language:
      ru:
        - Число нужно читать вместе с подписью.
      et:
        - ilm
    material_refs:
      - g2-weather-data-time-explanation
    provenance_refs:
      - g2-weather-data-time-explanation
    scaffold_refs: []
    new_language_items: []
    formative_check:
      prompt_ru: Что обозначает это число?
      subject_evidence: Ученик называет величину и единицу.
      language_evidence: Ученик узнаёт повторяемое слово ilm.
    expected_evidence_of_learning: Индивидуальный ответ связывает число с величиной и единицей измерения.
    transition: Переход к русскому алгоритму сравнения.
  - stage_id: explain-data-time-ru
    duration_minutes: 8
    stage_type: russian_concept_explanation
    content_purpose_ru: Освоить алгоритмы максимум–минимум–разность и сложение длительностей.
    language_purpose_et: Sisu mõistmine toimub vene keeles.
    teacher_action_ru: По-русски моделирует порядок сравнения и правило 60 минут равно 1 часу.
    pupil_action_ru: Расставляет карточки шагов в правильном порядке и объясняет выбор.
    teacher_language:
      - ru
      - et
    expected_pupil_language:
      ru:
        - Сначала нахожу максимум и минимум, затем разность.
      et: []
    material_refs:
      - g2-weather-data-time-explanation
    provenance_refs:
      - g2-weather-data-time-explanation
    scaffold_refs:
      - data-russian-explanation
    new_language_items: []
    formative_check:
      prompt_ru: Какой шаг выполняется перед вычитанием?
      subject_evidence: Ученик называет максимум, минимум и действие разности.
      language_evidence: Эстонская продукция на этапе объяснения не требуется.
    expected_evidence_of_learning: Ученик по-русски воспроизводит оба вычислительных алгоритма по порядку.
    transition: Переход к примеру с другими данными.
  - stage_id: bridge-data-et
    duration_minutes: 7
    stage_type: estonian_language_bridge
    content_purpose_ru: Закрепить единицы и краткую устную рамку после понимания математики.
    language_purpose_et: Õppida millimeeter, minut, tund ja kokku.
    teacher_action_ru: Показывает четыре слова и моделирует две короткие рамки без ответов к заданиям.
    pupil_action_ru: Соотносит единицы с величинами и повторяет одну рамку с нейтральным числом.
    teacher_language:
      - ru
      - et
    expected_pupil_language:
      ru:
        - Миллиметр — единица длины, минута и час — единицы времени.
      et:
        - Kokku on kümme minutit.
    material_refs:
      - g2-weather-data-time-explanation
    provenance_refs:
      - g2-weather-data-time-explanation
    scaffold_refs:
      - data-word-bank
      - data-sentence-frame
    new_language_items:
      - millimeeter
      - minut
      - tund
      - kokku
      - võrdle
      - liida
    formative_check:
      prompt_ru: Покажи слово для часа.
      subject_evidence: Ученик правильно различает единицы длины и времени.
      language_evidence: Ученик узнаёт четыре новых слова.
    expected_evidence_of_learning: Единицы измерения связаны с правильными величинами до индивидуальных задач.
    transition: Переход к двум индивидуальным заданиям.
  - stage_id: solve-approved-tasks
    duration_minutes: 17
    stage_type: independent_output
    content_purpose_ru: Получить индивидуальные вычисления по двум одобренным заданиям.
    language_purpose_et: Hoida matemaatika ja eesti keele tõend eraldi.
    teacher_action_ru: Выдаёт только два одобренных learner files и не показывает teacher-only guidance.
    pupil_action_ru: Индивидуально решает обе задачи, показывает действия и только затем обсуждает записи.
    teacher_language:
      - ru
      - et
    expected_pupil_language:
      ru:
        - Я показываю сравнение, действие и единицу.
        - Я складываю две длительности.
      et: []
    material_refs:
      - g2-weather-data-comparison-task
      - g2-time-measurement-problem-task
    provenance_refs:
      - g2-weather-data-comparison-task
      - g2-time-measurement-problem-task
    scaffold_refs:
      - data-word-bank
    new_language_items: []
    formative_check:
      prompt_ru: Какие два числа нужно использовать для разности?
      subject_evidence: Есть индивидуальные максимум, минимум, разность и add-then-convert решение.
      language_evidence: Эстонская продукция не входит в task-bank answers.
    expected_evidence_of_learning: Каждый ученик сохраняет собственные вычисления до общей проверки или доски.
    transition: Переход к раздельной выходной проверке.
  - stage_id: assess-data-separately
    duration_minutes: 8
    stage_type: assessment
    content_purpose_ru: Отдельно проверить математику и короткую эстонскую фразу.
    language_purpose_et: Hinnata üht lühikest lauset eraldi.
    teacher_action_ru: Проверяет ответы по teacher-only guidance и отдельно слушает одну рамку.
    pupil_action_ru: Проверяет единицы и действие, затем произносит одну выбранную эстонскую фразу.
    teacher_language:
      - ru
      - et
    expected_pupil_language:
      ru:
