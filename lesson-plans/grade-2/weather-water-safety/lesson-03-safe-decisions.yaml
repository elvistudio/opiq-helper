methodology:
  model: russian_primary_estonian_supported
  approaches:
    - content_language_dual_objectives
    - planned_translanguaging
    - gradual_scaffolding
    - pluriliteracies
    - multimodal_support
    - vocabulary_recycling
    - cognitive_load_control
    - separate_content_language_assessment
  content_priority: subject_comprehension_not_reduced_by_language_support
  language_path:
    - sequence: 1
      stage_id: retrieve-weather-data
      language_mode: activate_prior_knowledge
      description: Ученик вспоминает индивидуальную первую попытку на русском языке.
    - sequence: 2
      stage_id: explain-water-safety-ru
      language_mode: establish_concept_ru
      description: Полная безопасная последовательность сначала объясняется по-русски.
    - sequence: 3
      stage_id: bridge-adult-help-et
      language_mode: introduce_term_et
      description: Одна эстонская фраза вводится после понимания безопасного действия.
    - sequence: 4
      stage_id: demonstrate-dry-boundary
      language_mode: supported_task_et
      description: Сухая демонстрация использует только короткую видимую языковую опору.
    - sequence: 5
      stage_id: attempt-human-studies-task
      language_mode: supported_task_et
      description: Human-studies evidence создаётся индивидуально по-русски.
    - sequence: 6
      stage_id: attempt-pe-task
      language_mode: supported_task_et
      description: PE evidence создаётся индивидуально по-русски.
    - sequence: 7
      stage_id: discuss-after-individual-work
      language_mode: supported_task_et
      description: Парное обсуждение начинается только после двух индивидуальных ответов.
    - sequence: 8
      stage_id: assess-three-streams
      language_mode: short_oral_answer_et
      description: Предметные строки и одна эстонская фраза проверяются отдельно.
    - sequence: 9
      stage_id: recap-stop-stay-tell
      language_mode: short_oral_answer_et
      description: Ученик повторяет одну короткую поддержанную фразу в safety recap.
  learner_estonian_level: A1-A2
  planned_support_level: high
  scaffold_release:
    introduction: full_support
    guided_practice: partial_support
    final_output: short_independent_output
  content_language_assessment_policy: separate_content_and_estonian_language_evidence
objectives:
  content_objectives:
    - objective_id: make-responsible-water-edge-choice
      text_ru: Ученик выбирает ответственное действие, объясняет, кого оно защищает, и называет обязанность обратиться к
        взрослому.
      observable_output_ru: Индивидуальный ответ задания 09 содержит выбор, защищаемого человека и взрослую помощь.
      curriculum_outcome_refs:
        - ee-prk-2026-stage1-human-studies-rights-duties
    - objective_id: apply-dry-water-safety-decision
      text_ru: Ученик в сухой симуляции не пересекает границу, не отправляет другого ребёнка и выбирает помощь взрослого.
      observable_output_ru: Индивидуальный ответ задания 10 и teacher observation показывают дистанцию от опасности и взрослую помощь.
      curriculum_outcome_refs:
        - ee-prk-2026-stage1-physical-education-water-safety
  estonian_language_objectives:
    - objective_id: say-one-adult-help-phrase-et
      text_ru: Ученик произносит одну короткую поддержанную фразу об обращении к взрослому.
      text_et: Õpilane ütleb ühe toetatud lause täiskasvanu kutsumise kohta.
      observable_output: give_short_oral_answer
      minimum_quantity: 1
      language_functions:
        - report
  subject_success_criteria:
    - criterion_id: human-studies-responsible-choice
      descriptor: Выбор защищает себя или других и немедленно передаёт решение взрослому.
      acceptable_evidence: Индивидуальный ответ задания 09 до парного обсуждения.
    - criterion_id: pe-dry-water-safety-choice
      descriptor: Ученик сохраняет границу, не отправляет другого ребёнка и объясняет дистанцию и взрослую помощь.
      acceptable_evidence: Индивидуальный ответ задания 10 и наблюдение в сухой classroom-only симуляции.
  estonian_success_criteria:
    - criterion_id: language-one-adult-help-sentence
      descriptor: Одна поддержанная фраза Ma kutsun täiskasvanu. понятна слушателю.
      acceptable_evidence: Отдельная устная языковая строка, не влияющая на human-studies или PE score.
  prerequisites:
    - Ученик узнаёт взрослого как источник немедленной помощи.
    - Ученик может дать одну короткую причину выбора по-русски.
  anticipated_misconceptions:
    - Мелкая на вид вода ошибочно считается безопасной.
    - Предмет ставится выше безопасной границы.
    - Опасное действие передаётся другому ребёнку.
    - Уверенность или умение плавать ошибочно отменяют обозначенную границу.
language_load:
  new_terms_et:
    - term_et: täiskasvanu
      equivalent_ru: взрослый
      simple_definition_et: Täiskasvanu aitab ohu korral.
      provenance:
        category: author_created_bridge
        source_reference: grade-2 dry water-safety bilingual word bank
        notes: Short original definition supports only the bounded adult-help phrase and receptive instructions.
      first_use_stage: bridge-adult-help-et
      reuse_stage_refs:
        - demonstrate-dry-boundary
        - assess-three-streams
        - recap-stop-stay-tell
    - term_et: ohutu koht
      equivalent_ru: безопасное место
      simple_definition_et: Ohutu koht on ohust eemal.
      provenance:
        category: author_created_bridge
        source_reference: grade-2 dry water-safety bilingual word bank
        notes: Short original definition supports only the bounded adult-help phrase and receptive instructions.
      first_use_stage: bridge-adult-help-et
      reuse_stage_refs:
        - demonstrate-dry-boundary
        - assess-three-streams
        - recap-stop-stay-tell
    - term_et: vesi
      equivalent_ru: вода
      simple_definition_et: Vesi võib olla ohtlik.
      provenance:
        category: author_created_bridge
        source_reference: grade-2 dry water-safety bilingual word bank
        notes: Short original definition supports only the bounded adult-help phrase and receptive instructions.
      first_use_stage: bridge-adult-help-et
      reuse_stage_refs:
        - demonstrate-dry-boundary
        - assess-three-streams
        - recap-stop-stay-tell
  recycled_terms_et:
    - term_et: ilm
      equivalent_ru: погода
      source_lesson_id: grade-2-weather-water-safety-01-observation
      reuse_stage_refs:
        - retrieve-weather-data
  new_instruction_verbs_et:
    - verb_et: jää
      equivalent_ru: останься
      provenance:
        category: author_created_bridge
        source_reference: grade-2 dry water-safety receptive instruction bank
        notes: Instruction remains receptive and does not expand required Estonian production.
      first_use_stage: bridge-adult-help-et
      reuse_stage_refs:
        - demonstrate-dry-boundary
        - recap-stop-stay-tell
    - verb_et: kutsu
      equivalent_ru: позови
      provenance:
        category: author_created_bridge
        source_reference: grade-2 dry water-safety receptive instruction bank
        notes: Instruction remains receptive and does not expand required Estonian production.
      first_use_stage: bridge-adult-help-et
      reuse_stage_refs:
        - demonstrate-dry-boundary
        - recap-stop-stay-tell
    - verb_et: ära mine
      equivalent_ru: не иди
      provenance:
        category: author_created_bridge
        source_reference: grade-2 dry water-safety receptive instruction bank
        notes: Instruction remains receptive and does not expand required Estonian production.
      first_use_stage: bridge-adult-help-et
      reuse_stage_refs:
        - demonstrate-dry-boundary
        - recap-stop-stay-tell
  recycled_instruction_verbs_et: []
  model_sentences:
    - text_et: Ma kutsun täiskasvanu.
      translation_ru: Я позову взрослого.
      terms_et:
        - täiskasvanu
      provenance:
        category: author_created_bridge
        source_reference: grade-2 adult-help oral model
        notes: Original short sentence is the only required productive Estonian output.
  sentence_frames:
    - frame_id: adult-help-phrase
      frame_et: Ma kutsun täiskasvanu.
      purpose_ru: Видимая опора ограничивает обязательную продукцию одной короткой фразой.
      stage_refs:
        - bridge-adult-help-et
        - demonstrate-dry-boundary
        - assess-three-streams
        - recap-stop-stay-tell
      provenance:
        category: author_created_bridge
        source_reference: grade-2 adult-help phrase card
        notes: Original A1-A2 support remains separate from both subject scores.
  expected_receptive_language_et:
    - Jää ohutusse kohta.
    - Kutsu täiskasvanu.
    - Ära mine vette.
  expected_supported_productive_language_et:
    - Ma kutsun täiskasvanu.
  expected_independent_productive_language_et:
    - Ma kutsun täiskasvanu.
  full_expected_answer_ru: Ученик остаётся за обозначенной границей, не отправляет другого ребёнка, сохраняет безопасное
    расстояние и сразу сообщает взрослому.
  short_expected_oral_answer_et: Ma kutsun täiskasvanu.
  oral_output_terms_et:
    - täiskasvanu
cognitive_load:
  new_subject_concepts: 2
  new_estonian_terms: 3
  new_instruction_verbs: 3
  new_sentence_structures: 1
  independent_output_sentences: 1
  rationale: Два предметных evidence streams создаются по-русски; обязательный эстонский output ограничен одной
    поддержанной фразой.
scaffolds:
  - scaffold_id: water-safety-russian-sequence
    type: russian_explanation
    description_ru: Шесть карточек показывают полный безопасный порядок без роли ребёнка-спасателя.
    stage_refs:
      - explain-water-safety-ru
    release:
      at_stage: attempt-human-studies-task
      how_reduced_ru: Во время первой попытки остаётся только нейтральная рамка причины.
    provenance:
      category: author_created_explanation
      source_reference: grade-2 dry water-safety decision sequence
      notes: Original Russian sequence establishes the adult-controlled safety boundary.
  - scaffold_id: dry-boundary-markers
    type: teacher_modelling
    description_ru: Лента и карточка безопасного места моделируют границу только на сухом полу класса.
    stage_refs:
      - demonstrate-dry-boundary
      - attempt-pe-task
      - recap-stop-stay-tell
    release:
      at_stage: assess-three-streams
      how_reduced_ru: На выходе ученик объясняет границу по собственной записи.
    provenance:
      category: author_created_worked_example
      source_reference: grade-2 classroom-only boundary simulation
      notes: Original dry procedure forbids real-water exposure and rescue simulation.
  - scaffold_id: adult-help-phrase-card
    type: sentence_frame
    description_ru: Карточка поддерживает только фразу Ma kutsun täiskasvanu.
    stage_refs:
      - bridge-adult-help-et
      - demonstrate-dry-boundary
      - assess-three-streams
      - recap-stop-stay-tell
    release:
      at_stage: assess-three-streams
      how_reduced_ru: Ученик самостоятельно читает одну видимую фразу.
    provenance:
      category: author_created_bridge
      source_reference: grade-2 adult-help phrase card
      notes: One visible phrase does not reduce or alter either subject task.
  - scaffold_id: water-safety-reason-frame
    type: sentence_frame
    description_ru: Русская рамка причины не называет правильный вариант и не раскрывает answer contract.
    stage_refs:
      - attempt-human-studies-task
      - attempt-pe-task
      - discuss-after-individual-work
    release:
      at_stage: assess-three-streams
      how_reduced_ru: На выходе ученик пишет причину без готовой рамки.
    provenance:
      category: author_created_bridge
      source_reference: grade-2 water-safety neutral reason frame
      notes: Original neutral support preserves both pending task projections.
multimodal_support:
  - support_id: dry-floor-boundary-support
    type: demonstration
    stage_refs:
      - demonstrate-dry-boundary
      - attempt-pe-task
    material_ref: g2-water-safety-dry-simulation
    provenance:
      category: author_created_worked_example
      source_reference: grade-2 classroom floor-marker model
      notes: Dry floor markers externalise distance without representing real water.
  - support_id: water-safety-scenario-card-support
    type: real_object
    stage_refs:
      - attempt-human-studies-task
      - attempt-pe-task
    material_ref: g2-water-edge-safe-decision-task
    provenance:
      category: author_created_task_set
      source_reference: g2-water-edge-safe-decision-task; g2-pe-water-safety-decision-task
      notes: Text-only task cards preserve the pending learner projections without copied visual material.
stages:
  - stage_id: retrieve-weather-data
    duration_minutes: 4
    stage_type: activation
    content_purpose_ru: Вспомнить порядок индивидуального ответа до общего обсуждения.
    language_purpose_et: Meenutada tuttavat ühe lause reeglit.
    teacher_action_ru: Напоминает, что в уроках 1–2 каждый ученик сначала создавал собственное доказательство.
    pupil_action_ru: Индивидуально называет по-русски один пример безопасного порядка работы.
    teacher_language:
      - ru
      - et
    expected_pupil_language:
      ru:
        - Сначала я отвечаю сам(а), потом обсуждаю.
      et: []
    material_refs:
      - g2-water-safety-explanation
    provenance_refs:
      - g2-water-safety-explanation
    scaffold_refs: []
    new_language_items: []
    formative_check:
      prompt_ru: Что мы делаем до общего обсуждения?
      subject_evidence: Ученик называет индивидуальную первую попытку.
      language_evidence: Эстонская продукция пока не требуется.
    expected_evidence_of_learning: Каждый ученик вспоминает правило индивидуальной первой попытки.
    transition: Переход к русскому объяснению безопасной границы.
  - stage_id: explain-water-safety-ru
    duration_minutes: 8
    stage_type: russian_concept_explanation
    content_purpose_ru: Понять последовательность остановись — оставайся — сообщи взрослому.
    language_purpose_et: Sisu mõistmine toimub vene keeles.
    teacher_action_ru: По-русски объясняет шесть шагов, ценность безопасной границы и немедленную помощь взрослого.
    pupil_action_ru: Раскладывает карточки шести шагов и объясняет, почему предмет не важнее безопасности.
    teacher_language:
      - ru
      - et
    expected_pupil_language:
      ru:
        - Предмет не важнее безопасности.
        - Я остаюсь в безопасном месте и сообщаю взрослому.
      et: []
    material_refs:
      - g2-water-safety-explanation
    provenance_refs:
      - g2-water-safety-explanation
    scaffold_refs:
      - water-safety-russian-sequence
    new_language_items: []
    formative_check:
      prompt_ru: Почему нельзя идти за предметом, даже если вода кажется мелкой?
      subject_evidence: Ученик связывает границу с защитой себя и других.
      language_evidence: Полное предметное объяснение дано по-русски.
    expected_evidence_of_learning: Ученик по-русски воспроизводит безопасную последовательность без роли спасателя.
    transition: Переход к одной поддержанной эстонской фразе.
  - stage_id: bridge-adult-help-et
    duration_minutes: 5
    stage_type: estonian_language_bridge
    content_purpose_ru: Связать уже понятное обращение за помощью с одной короткой фразой.
    language_purpose_et: Õppida lause Ma kutsun täiskasvanu.
    teacher_action_ru: Показывает три воспринимаемые инструкции и моделирует только одну обязательную фразу.
    pupil_action_ru: Следует знакомым жестам и один раз произносит поддержанную фразу.
    teacher_language:
      - ru
      - et
    expected_pupil_language:
      ru:
        - Я позову взрослого.
      et:
