adult_roles:
  - bounded_action_ru: Не объяснять предметный ответ и не исправлять работу вместо ребёнка.
    purpose_ru: Открывать релевантный ключ только после завершённой самостоятельной попытки.
    role: check_answers
  - bounded_action_ru: Не давать предметный ответ и не завершать действие вместо ребёнка.
    purpose_ru: Поддержать выполнение в пределах указанной операционной роли.
    role: listening_partner
  - bounded_action_ru: Контролировать только разрешённые материалы, остановку и уборку.
    purpose_ru: Поддержать выполнение в пределах указанной операционной роли.
    role: safety_supervision
allowed_actions_ru:
  - Подготовить место и материалы.
  - Убрать отвлекающие факторы и помочь запустить таймер.
  - Хранить ключ закрытым до самостоятельной попытки.
  - Выслушать объяснение, не заканчивая ответ за ребёнка.
  - Напомнить сверить ответ и отметить исправление другим цветом.
  - Обеспечить только явно требуемый надзор безопасности.
  - Помочь передать нерешённый вопрос предметному учителю.
answer_access:
  correction_method: separate_colour
  first_attempt_without_answer: true
  key_release: adult_managed
artifact_type: parent_guidance
escalation_triggers_ru:
  - Ребёнок не понимает предоставленное учителем объяснение.
  - Ключ и учебный материал противоречат друг другу.
  - Практическая инструкция неясна или условие безопасности не выполнено.
  - Повторяющаяся ошибка не исправляется после сверки.
  - Требуется новое предметное объяснение.
  - Нужный ресурс недоступен.
  - Запланированное время систематически нереалистично.
guidance_id: grade-5-water-03-melting-condensation-homeschool-adaptation-parent-guidance
known_limits:
  - Взрослый не считается предметным учителем.
  - Инструкции и временные оценки требуют teacher review и домашней апробации.
prohibited_actions_ru:
  - Не давать ответ до самостоятельной попытки.
  - Не придумывать предметное объяснение и не менять научные утверждения учителя.
  - Не менять процедуру или меры безопасности.
  - Не считать эстонскую беглость доказательством предметного понимания.
  - Не снижать предметный результат только из-за формы эстонского ответа.
  - Не разрешать практическую работу без разрешения предметного учителя.
responsibility_boundary:
  adult_safety_supervision_ru: Взрослый выполняет только указанный надзор и не меняет процедуру.
  adult_support_ru: Взрослый организует условия и разрешённую поддержку, но не создаёт предметный ответ.
  child_responsibility_ru: Ребёнок выполняет попытку, объясняет, сверяет и отмечает нерешённый вопрос.
  subject_teacher_responsibility_ru: Предметный учитель отвечает за научное объяснение, ключ,
    процедуру и разрешение практической работы.
safety:
  adapted_supervision_required: true
  adult_supervision_required: true
  controls_ru:
    - Только учитель утверждает домашнюю процедуру до её применения.
    - Взрослый находится рядом на протяжении всего наблюдения.
    - Нагревание и пробование воды полностью запрещены.
    - После наблюдения воду убирают, поверхность вытирают и руки моют.
  effective_supervision_required: true
  source_supervision_required: true
  teacher_authorization_required: true
schema_version: "1.0"
status:
  home_trial: not_started
  homeschool_ready: false
  teacher_review: pending
timing:
  adult_answer_access_minutes: 3
  adult_live_support_minutes: 4
  adult_preparation_minutes: 3
  adult_safety_minutes: 13
  total_adult_minutes: 23
