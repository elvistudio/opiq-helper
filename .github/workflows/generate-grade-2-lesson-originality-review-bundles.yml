name: Generate Grade 2 lesson originality review bundles

on:
  push:
    branches:
      - codex/grade-2-lesson-originality-review-bundles

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out authoring branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: codex/grade-2-lesson-originality-review-bundles
          fetch-depth: 0
          persist-credentials: true

      - name: Verify trigger scope
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='32baf4a074c79760ee11e3b2017c922773af9fbd'
          actual_parent="$(git rev-parse HEAD^)"
          if [[ "$actual_parent" != "$expected_parent" ]]; then
            echo "Unexpected trigger parent: $actual_parent" >&2
            exit 1
          fi
          changed="$(git diff --name-only HEAD^ HEAD)"
          if [[ "$changed" != '.github/workflows/generate-grade-2-lesson-originality-review-bundles.yml' ]]; then
            echo 'Trigger commit changed unexpected paths:' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Register focused npm scripts
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts['check:lesson-originality-review-bundles'] = 'node scripts/check-lesson-originality-review-bundles.mjs';
          pkg.scripts['generate:lesson-originality-review-bundles'] = 'node scripts/generate-lesson-originality-review-bundles.mjs --write';
          pkg.scripts['test:lesson-originality-review-bundles'] = 'node --test scripts/lesson-originality-review-bundles.test.mjs';
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Generate deterministic review artifacts
        run: node scripts/generate-lesson-originality-review-bundles.mjs --write

      - name: Run focused tests
        run: node --test scripts/lesson-originality-review-bundles.test.mjs

      - name: Check generated artifacts
        run: node scripts/check-lesson-originality-review-bundles.mjs

      - name: Check diff formatting
        run: git diff --check

      - name: Commit generated outputs and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/generate-grade-2-lesson-originality-review-bundles.yml
          git add package.json teacher-packs/grade-2/weather-water-safety/originality-reviews
          git diff --cached --check
          git commit -m 'Generate Grade 2 lesson originality review bundles'
          git push origin HEAD:codex/grade-2-lesson-originality-review-bundles
