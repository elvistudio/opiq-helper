name: Validate Grade 2 lesson originality reviews

on:
  pull_request:
    paths:
      - schemas/lesson-originality-review-bundle.schema.json
      - scripts/lib/lesson-originality-review-bundles.mjs
      - scripts/generate-lesson-originality-review-bundles.mjs
      - scripts/check-lesson-originality-review-bundles.mjs
      - scripts/lesson-originality-review-bundles.test.mjs
      - teacher-packs/grade-2/weather-water-safety/originality-reviews/**
      - lesson-plans/grade-2/weather-water-safety/**
      - task-bank/reviews/grade-2/weather-water-safety/**
      - source-manifest.json
      - package.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate lesson originality review bundles
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test lesson originality review bundles
        run: npm run test:lesson-originality-review-bundles

      - name: Check lesson originality review bundles
        run: npm run check:lesson-originality-review-bundles
