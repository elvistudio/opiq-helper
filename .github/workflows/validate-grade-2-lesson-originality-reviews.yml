name: Validate Grade 2 lesson originality reviews

on:
  pull_request:
    paths:
      - schemas/lesson-originality-review-bundle.schema.json
      - scripts/lib/lesson-originality-review-bundles.mjs
      - scripts/generate-lesson-originality-review-bundles.mjs
      - scripts/check-lesson-originality-review-bundles.mjs
      - scripts/lesson-originality-review-bundles.test.mjs
      - teacher-packs/grade-2/weather-water-safety/originality-reviews/**
      - lesson-plans/grade-2/weather-water-safety/**
      - task-bank/reviews/grade-2/weather-water-safety/**
      - source-manifest.json
      - package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate lesson originality review bundles
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out PR head branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Bind bundle to existing commercial originality gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lib_path = Path('scripts/lib/lesson-originality-review-bundles.mjs')
          source = lib_path.read_text()

          import_line = "import { computeCommercialOriginalityFingerprint } from './commercial-course-schema.mjs';\n"
          if import_line not in source:
              source = source.replace(
                  "import YAML from 'yaml';\n",
                  "import YAML from 'yaml';\n" + import_line,
                  1,
              )

          commercial_block = """  const commercialGateFingerprint = computeCommercialOriginalityFingerprint(
            rootDir,
            lesson,
            existingReview.covered_author_material_ids ?? [],
          );
          """
          if 'const commercialGateFingerprint = computeCommercialOriginalityFingerprint' not in source:
              marker = "  const dependencies = await taskDependencies(rootDir, spec.taskReviewPaths);\n"
              if source.count(marker) != 1:
                  raise SystemExit(f'unexpected dependency marker count: {source.count(marker)}')
              source = source.replace(marker, commercial_block + marker, 1)

          if 'commercial_gate_fingerprint: commercialGateFingerprint' not in source:
              marker = "    bundle_fingerprint: {\n"
              if source.count(marker) != 1:
                  raise SystemExit(f'unexpected bundle marker count: {source.count(marker)}')
              source = source.replace(
                  marker,
                  "    commercial_gate_fingerprint: commercialGateFingerprint,\n" + marker,
                  1,
              )

          if 'Existing commercial-gate fingerprint' not in source:
              old = "- Content fingerprint: \\`${bundle.content_fingerprint.value}\\`\\n- Bundle fingerprint:"
              new = "- Review-content fingerprint: \\`${bundle.content_fingerprint.value}\\`\\n- Existing commercial-gate fingerprint: \\`${bundle.commercial_gate_fingerprint.value}\\`\\n- Bundle fingerprint:"
              if source.count(old) != 1:
                  raise SystemExit(f'unexpected packet identity marker count: {source.count(old)}')
              source = source.replace(old, new, 1)

          if 'commercial_gate_fingerprint: bundle.commercial_gate_fingerprint.value' not in source:
              marker = "      bundle_fingerprint: bundle.bundle_fingerprint.value,\n"
              if source.count(marker) != 1:
                  raise SystemExit(f'unexpected index marker count: {source.count(marker)}')
              source = source.replace(
                  marker,
                  "      commercial_gate_fingerprint: bundle.commercial_gate_fingerprint.value,\n" + marker,
                  1,
              )

          if '## Fingerprint contracts' not in source:
              source = source.replace(
                  "5. Record a real reviewer identity, role, review date, reviewed commit and the current fingerprint only in a later human-decision change.",
                  "5. Record a real reviewer identity, role, review date, reviewed commit and reviewed bundle identity only in a later human-decision change; recompute the existing commercial originality gate fingerprint separately.",
                  1,
              )
              marker = "    + `## Route boundary\\n\\nGrade 2 first-language Estonian"
              insert = "    + `## Fingerprint contracts\\n\\nThe review-content fingerprint binds the authored lesson projection plus covered files and identifies this review packet. The separate commercial-gate fingerprint is computed with the repository's existing commercial originality gate from the covered material files. A later human-decision change must not copy one value into the other contract by assumption: it must recompute the commercial gate fingerprint and independently preserve the reviewed bundle identity.\\n\\n`\n"
              if source.count(marker) != 1:
                  raise SystemExit(f'unexpected route-boundary marker count: {source.count(marker)}')
              source = source.replace(marker, insert + marker, 1)

          lib_path.write_text(source)
          PY

          node <<'NODE'
          const fs = require('node:fs');
          const path = 'schemas/lesson-originality-review-bundle.schema.json';
          const schema = JSON.parse(fs.readFileSync(path, 'utf8'));
          schema.$defs.commercialFingerprint = {
            type: 'object',
            additionalProperties: false,
            required: ['algorithm', 'specification_version', 'value', 'file_count'],
            properties: {
              algorithm: { const: 'sha256' },
              specification_version: { const: '1.0' },
              value: { $ref: '#/$defs/sha256' },
              file_count: { type: 'integer', minimum: 1 },
            },
          };
          const bundle = schema.$defs.bundle;
          if (!bundle.required.includes('commercial_gate_fingerprint')) {
            bundle.required.splice(bundle.required.indexOf('bundle_fingerprint'), 0, 'commercial_gate_fingerprint');
          }
          bundle.properties.commercial_gate_fingerprint = { $ref: '#/$defs/commercialFingerprint' };
          const entry = schema.$defs.indexEntry;
          if (!entry.required.includes('commercial_gate_fingerprint')) {
            entry.required.splice(entry.required.indexOf('bundle_fingerprint'), 0, 'commercial_gate_fingerprint');
          }
          entry.properties.commercial_gate_fingerprint = { $ref: '#/$defs/sha256' };
          fs.writeFileSync(path, `${JSON.stringify(schema, null, 2)}\n`);
          NODE

          python - <<'PY'
          from pathlib import Path
          test_path = Path('scripts/lesson-originality-review-bundles.test.mjs')
          source = test_path.read_text()
          import_line = "import { computeCommercialOriginalityFingerprint } from './lib/commercial-course-schema.mjs';\n"
          if import_line not in source:
              source = source.replace("import YAML from 'yaml';\n", "import YAML from 'yaml';\n" + import_line, 1)
          if "for (const { bundle, lesson } of first.built) {" not in source:
              source = source.replace(
                  "for (const { bundle } of first.built) {",
                  "for (const { bundle, lesson } of first.built) {",
                  1,
              )
          if 'computeCommercialOriginalityFingerprint(rootDir, lesson, bundle.covered_material_ids)' not in source:
              marker = "    assert.match(bundle.bundle_fingerprint.value, /^[0-9a-f]{64}$/u);\n"
              if source.count(marker) != 1:
                  raise SystemExit(f'unexpected bundle assertion marker count: {source.count(marker)}')
              addition = """    assert.match(bundle.commercial_gate_fingerprint.value, /^[0-9a-f]{64}$/u);
              assert.deepEqual(
                bundle.commercial_gate_fingerprint,
                computeCommercialOriginalityFingerprint(rootDir, lesson, bundle.covered_material_ids),
              );
          """
              source = source.replace(marker, addition + marker, 1)
          test_path.write_text(source)
          PY

      - name: Generate deterministic review artifacts
        run: npm run generate:lesson-originality-review-bundles

      - name: Test lesson originality review bundles
        run: npm run test:lesson-originality-review-bundles

      - name: Check generated review bundles
        run: npm run check:lesson-originality-review-bundles

      - name: Verify generator is byte-current
        run: node scripts/generate-lesson-originality-review-bundles.mjs --check

      - name: Check diff formatting
        run: git diff --check

      - name: Commit gate-compatible review artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            schemas/lesson-originality-review-bundle.schema.json \
            scripts/lib/lesson-originality-review-bundles.mjs \
            scripts/lesson-originality-review-bundles.test.mjs \
            teacher-packs/grade-2/weather-water-safety/originality-reviews
          git diff --cached --check
          git commit -m 'Bind lesson review bundles to commercial gate fingerprint'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
