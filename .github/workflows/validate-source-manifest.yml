name: Validate source manifest

on:
  pull_request:
    paths:
      - source-manifest.json
      - scripts/**
      - project-files/**
      - evaluations/**
      - curriculum-maps/**
      - lesson-plans/**
      - teacher-packs/**
      - pedagogical-reviews/**
      - annual-courses/**
      - external-sources/**
      - knowledge/**
      - schemas/**
      - docs/curriculum-maps.md
      - docs/grade-5-science-annual-course.md
      - docs/lesson-plans.md
      - docs/pedagogical-knowledge-base.md
      - docs/pedagogical-taxonomy.md
      - docs/lesson-pedagogy-engine.md
      - docs/homeschool-learning-engine.md
      - docs/teacher-pack-content-fingerprint.md
      - docs/topic-synthesis-policy.md
      - docs/templates/**
      - README.md
      - .github/ISSUE_TEMPLATE/**
      - package.json
      - package-lock.json
      - .github/workflows/validate-source-manifest.yml
  push:
    branches:
      - main
    paths:
      - source-manifest.json
      - scripts/**
      - project-files/**
      - evaluations/**
      - curriculum-maps/**
      - lesson-plans/**
      - teacher-packs/**
      - pedagogical-reviews/**
      - annual-courses/**
      - external-sources/**
      - knowledge/**
      - schemas/**
      - docs/curriculum-maps.md
      - docs/grade-5-science-annual-course.md
      - docs/lesson-plans.md
      - docs/pedagogical-knowledge-base.md
      - docs/pedagogical-taxonomy.md
      - docs/lesson-pedagogy-engine.md
      - docs/homeschool-learning-engine.md
      - docs/teacher-pack-content-fingerprint.md
      - docs/topic-synthesis-policy.md
      - docs/templates/**
      - README.md
      - .github/ISSUE_TEMPLATE/**
      - package.json
      - package-lock.json
      - .github/workflows/validate-source-manifest.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifest and source records
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test known-topic regression runner
        run: npm run test:topics

      - name: Check known-topic regressions
        run: npm run check:topics

      - name: Test curriculum map validator
        run: npm run test:curriculum

      - name: Check curriculum maps
        run: npm run check:curriculum

      - name: Test bilingual teaching-plan validator
        run: npm run test:plans

      - name: Check bilingual teaching plans
        run: npm run check:plans

      - name: Test multilingual topic synthesis
        run: npm run test:synthesis

      - name: Test teacher-pack validator
        run: npm run test:teacher-packs

      - name: Check teacher packs
        run: npm run check:teacher-packs

      - name: Test teacher-pack fingerprinting
        run: npm run test:fingerprints

      - name: Check teacher-pack fingerprints
        run: npm run check:fingerprints

      - name: Test pedagogical review validator
        run: npm run test:reviews

      - name: Check pedagogical review workflow
        run: npm run check:reviews

      - name: Test pedagogical knowledge
        run: npm run test:pedagogy

      - name: Check pedagogical knowledge
        run: npm run check:pedagogy

      - name: Test lesson pedagogy selection
        run: npm run test:pedagogy-selection

      - name: Check lesson pedagogy selection
        run: npm run check:pedagogy-selection

      - name: Inspect deterministic pedagogy fixtures
        run: npm run select:pedagogy

      - name: Test homeschool pedagogy adaptation
        run: npm run test:pedagogy-homeschool

      - name: Check homeschool pedagogy adaptation
        run: npm run check:pedagogy-homeschool

      - name: Test pedagogy generation integration
        run: npm run test:pedagogy-integration

      - name: Check pedagogy generation integration
        run: npm run check:pedagogy-integration

      - name: Check generated water pedagogy pilot
        run: npm run generate:pedagogy-water-pilot -- --check

      - name: Verify generated grade 1 mathematics QA
        run: node scripts/generate-grade-1-mathematics-qa.mjs --check

      - name: Verify generated grade 2 source indexes
        run: npm run check:grade-2-sources

      - name: Test grade 2 catalogue integrity guards
        run: npm run test:grade-2-sources

      - name: Test grade 2 content-quality audit
        run: npm run test:grade-2-content-quality

      - name: Check grade 2 content quality
        run: npm run check:grade-2-content-quality

      - name: Verify generated grade 3 mathematics QA
        run: npm run check:grade-3-mathematics

      - name: Test grade 3 mathematics original-source migration
        run: npm run test:grade-3-mathematics

      - name: Verify generated grade 3 Russian source
        run: npm run check:grade-3-russian

      - name: Test grade 3 Russian original-source migration
        run: npm run test:grade-3-russian

      - name: Verify generated grade 3 Russian-reading source
        run: npm run check:grade-3-russian-reading

      - name: Test grade 3 Russian-reading source import
        run: npm run test:grade-3-russian-reading

      - name: Verify generated grade 3 music source
        run: npm run check:grade-3-music

      - name: Test grade 3 music source import
        run: npm run test:grade-3-music

      - name: Verify generated grade 3 Estonian sources
        run: npm run check:grade-3-estonian

      - name: Test grade 3 Estonian source import
        run: npm run test:grade-3-estonian

      - name: Verify generated grade 3 arts-and-crafts source
        run: npm run check:grade-3-arts-and-crafts

      - name: Test grade 3 arts-and-crafts source import
        run: npm run test:grade-3-arts-and-crafts

      - name: Verify generated grade 3 English source
        run: npm run check:grade-3-english

      - name: Test grade 3 English source import
        run: npm run test:grade-3-english

      - name: Validate source manifest
        run: node scripts/check-source-manifest.mjs
