name: Teacher pack pedagogical review
description: Record non-personal findings from an independent teacher-pack review.
title: "Teacher review: "
labels: []
body:
  - type: markdown
    attributes:
      value: Do not include any student personal data. The YAML review record remains the machine-readable evidence authority.
  - type: input
    id: content_fingerprint
    attributes:
      label: Reviewed content fingerprint
      description: Lower-case SHA-256 value computed with fingerprint specification 1.0.
    validations:
      required: true
  - type: input
    id: fingerprint_file_count
    attributes:
      label: Fingerprint file count
      description: The file count printed by the fingerprint CLI.
    validations:
      required: true
  - type: input
    id: provenance_commit_sha
    attributes:
      label: Provenance commit SHA
      description: Git location for audit and navigation; this is not the readiness gate.
    validations:
      required: true
  - type: dropdown
    id: reviewer_role
    attributes:
      label: Reviewer role
      options:
        - primary_science_teacher
        - bilingual_science_teacher
        - curriculum_specialist
    validations:
      required: true
  - type: dropdown
    id: decision
    attributes:
      label: Review decision
      options:
        - changes_required
        - approved_with_minor_notes
        - approved
        - rejected
    validations:
      required: true
  - type: textarea
    id: findings
    attributes:
      label: Findings and evidence
      description: Use artifact paths and lesson IDs only; do not identify pupils.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirm that this issue contains no student names, identifiers, contacts, photos, health data, identifiable grades, or identifiable free text.
          required: true
