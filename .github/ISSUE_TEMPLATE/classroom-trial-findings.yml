name: Classroom trial findings
description: Record anonymised, aggregated findings from a limited classroom trial.
title: "Classroom trial: "
labels: []
body:
  - type: markdown
    attributes:
      value: Only aggregated observations are allowed. Never enter a pupil name or information that can identify a pupil.
  - type: input
    id: pack_commit_sha
    attributes:
      label: Trialled pack commit SHA
    validations:
      required: true
  - type: input
    id: lesson_ids
    attributes:
      label: Lesson IDs trialled
      description: Repository lesson IDs, separated by commas.
    validations:
      required: true
  - type: input
    id: approximate_group_size
    attributes:
      label: Approximate group size
      description: Aggregate number only.
    validations:
      required: true
  - type: textarea
    id: aggregate_observations
    attributes:
      label: Aggregated observations
      description: Example — 7 of 12 pupils followed the instruction without repetition. Do not include individual records.
    validations:
      required: true
  - type: textarea
    id: safety_and_materials
    attributes:
      label: Safety and material findings
      description: Describe pack or stage-level evidence, never pupil-level details.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: Observations are aggregated and contain no names, identifiers, contacts, photos, health data, identifiable grades, or identifiable free text.
          required: true
        - label: I manually checked all free text for direct and indirect identifiers.
          required: true
